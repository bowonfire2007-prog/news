<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<title>Matt's Daily Read</title>
<style>
  :root { --bg:#faf9f7; --text:#0a0a0a; --text-muted:#6b6b6b; --text-soft:#9a9a9a; --border:#e8e6e0; --accent:#b8331a; --card-hover:#f0ede8; }
  [data-theme="dark"] { --bg:#0f0e0d; --text:#f5f5f4; --text-muted:#a3a3a3; --text-soft:#6b6b6b; --border:#2a2825; --accent:#ff6b4a; --card-hover:#1c1b19; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background-color .25s ease,color .25s ease; }
  a { color:inherit; text-decoration:none; }

  /* ── ALERT BANNER ── */
  #alertBanner { width:100%; display:none; flex-direction:column; gap:0; }
  #alertBanner.has-alerts { display:flex; }
  .alert-item { padding:10px 20px; display:flex; align-items:flex-start; gap:10px; font-size:13px; line-height:1.4; color:#fff; }
  .alert-item.extreme  { background:#7f1d1d; }
  .alert-item.severe   { background:#92400e; }
  .alert-item.moderate { background:#1e3a5f; }
  .alert-item.minor    { background:#374151; }
  .alert-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
  .alert-body { flex:1; min-width:0; }
  .alert-event { font-weight:700; letter-spacing:0.02em; }
  .alert-headline { opacity:.9; margin-top:2px; }
  .alert-link { color:#fff; text-decoration:underline; white-space:nowrap; font-weight:600; margin-left:8px; flex-shrink:0; }

  /* ── DRAWER ── */
  .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .drawer-overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; left:0; bottom:0; width:min(300px,85vw); background:var(--bg); border-right:1px solid var(--border); z-index:60; transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; overflow:hidden; }
  .drawer.open { transform:translateX(0); }
  .drawer-header { padding:20px 20px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); flex-shrink:0; }
  .drawer-brand { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; letter-spacing:-0.01em; }
  .drawer-brand span { color:var(--accent); }
  .drawer-close { width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .drawer-close:hover { background:var(--card-hover); color:var(--text); }
  .drawer-list { flex:1; overflow-y:auto; padding:10px 0; }
  .drawer-item { display:flex; align-items:center; gap:12px; padding:12px 20px; cursor:pointer; font-size:15px; font-weight:500; color:var(--text-muted); border-left:3px solid transparent; transition:background .15s,color .15s; }
  .drawer-item:hover { background:var(--card-hover); color:var(--text); }
  .drawer-item.active { color:var(--accent); border-left-color:var(--accent); background:var(--card-hover); font-weight:700; }
  .drawer-item-icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }

  /* ── HEADER ── */
  header { position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--bg) 90%,transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--border); padding:max(env(safe-area-inset-top),12px) 20px 0; }
  .header-row { max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; }
  .brand { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:22px; font-weight:700; letter-spacing:-0.01em; }
  .brand span { color:var(--accent); }
  .header-actions { display:flex; align-items:center; gap:5px; }
  .icon-btn { width:36px; height:36px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--border); color:var(--text); cursor:pointer; flex-shrink:0; }
  .icon-btn:hover { background:var(--card-hover); }
  .icon-btn svg { width:17px; height:17px; }
  .font-btn { height:28px; padding:0 9px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:11px; font-weight:700; font-family:inherit; line-height:1; }
  .font-btn:hover { background:var(--card-hover); color:var(--text); }

  /* ── SEARCH ── */
  .search-wrap { max-width:760px; margin:0 auto; overflow:hidden; max-height:0; opacity:0; transition:max-height .2s ease,opacity .2s ease; }
  .search-wrap.open { max-height:52px; opacity:1; }
  .search-inner { display:flex; gap:8px; padding-bottom:10px; }
  .search-input { flex:1; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card-hover); color:var(--text); font-size:14px; outline:none; font-family:inherit; }
  .search-input:focus { border-color:var(--accent); }
  .search-clear { width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  /* ── WEATHER ── */
  .weather { max-width:760px; margin:0 auto 2px; padding:10px 0; display:flex; flex-direction:column; gap:8px; font-size:14px; }
  .weather.loading { opacity:0.5; }
  .w-current { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .w-temp { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .w-icon { font-size:22px; }
  .w-cond { color:var(--text); font-weight:500; }
  .w-sep { color:var(--text-soft); }
  .w-meta { color:var(--text-muted); font-size:12px; margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .w-meta span { white-space:nowrap; }
  .w-forecast { display:flex; align-items:center; gap:10px; padding-top:6px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted); flex-wrap:wrap; }
  .w-day { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .w-day-name { color:var(--text); font-weight:600; }
  .w-radar { margin-left:auto; color:var(--accent); font-weight:600; white-space:nowrap; text-decoration:none; }
  .w-radar:hover { text-decoration:underline; }
  .w-lake { display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 8px; background:color-mix(in srgb,var(--accent) 12%,transparent); border-radius:999px; font-weight:700; color:var(--accent); font-size:13px; white-space:nowrap; text-decoration:none; }
  .w-lake:hover { text-decoration:underline; }

  /* ── QUOTE OF DAY ── */
  .quote-bar { max-width:760px; margin:0 auto; padding:8px 0 6px; border-top:1px solid var(--border); }
  .quote-text { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:13px; color:var(--text-muted); font-style:italic; line-height:1.5; }
  .quote-author { font-size:11px; color:var(--text-soft); margin-top:2px; letter-spacing:0.02em; }

  /* ── SECTION BAR ── */
  .section-bar { max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:8px 0 4px; }
  .section-left { display:flex; align-items:center; gap:8px; }
  .section-label { font-size:13px; font-weight:700; color:var(--text); letter-spacing:0.02em; text-transform:uppercase; }
  .new-pill { font-size:10px; font-weight:700; color:var(--accent); background:color-mix(in srgb,var(--accent) 13%,transparent); padding:2px 7px; border-radius:999px; white-space:nowrap; }
  .section-menu-btn { font-size:13px; font-weight:600; color:var(--accent); background:transparent; border:none; cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:5px; }
  .section-menu-btn svg { width:14px; height:14px; }

  /* ── QUICK TABS ── */
  .quick-tabs { max-width:760px; margin:0 auto; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; display:flex; gap:7px; padding:5px 0 10px; }
  .quick-tabs::-webkit-scrollbar { display:none; }
  .qtab { flex-shrink:0; padding:5px 13px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .12s,color .12s,border-color .12s; }
  .qtab:hover { background:var(--card-hover); color:var(--text); }
  .qtab.active { background:var(--text); color:var(--bg); border-color:var(--text); font-weight:600; }

  /* ── MAIN ── */
  main { max-width:760px; margin:0 auto; padding:8px 20px max(env(safe-area-inset-bottom),40px); }
  .status { padding:40px 20px; text-align:center; color:var(--text-muted); font-size:14px; line-height:1.6; }
  .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes shimmer { 0%{opacity:.35} 50%{opacity:.7} 100%{opacity:.35} }

  /* ── SKELETON ── */
  .skel { display:flex; gap:16px; padding:20px 0; border-bottom:1px solid var(--border); }
  .skel-body { flex:1; display:flex; flex-direction:column; gap:7px; padding-top:4px; }
  .skel-line { background:var(--card-hover); border-radius:4px; animation:shimmer 1.5s ease-in-out infinite; }
  .skel-line.s1 { height:11px; width:38%; }
  .skel-line.s2 { height:19px; width:94%; }
  .skel-line.s3 { height:19px; width:72%; }
  .skel-line.s4 { height:13px; width:88%; }
  .skel-line.s5 { height:13px; width:60%; }
  .skel-img { width:110px; height:110px; flex-shrink:0; border-radius:8px; background:var(--card-hover); animation:shimmer 1.5s ease-in-out infinite; }

  /* ── NEWS ITEMS ── */
  article.item { display:flex; gap:16px; padding:20px 0; border-bottom:1px solid var(--border); cursor:pointer; position:relative; }
  article.item:hover .title { color:var(--accent); }
  article.item.read { opacity:0.52; }
  article.item.read:hover { opacity:0.82; }
  article.item.kb-focus { outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
  .item-text { flex:1; min-width:0; }
  .meta { display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:5px; flex-wrap:wrap; }
  .source-chip { background:var(--card-hover); color:var(--text-muted); font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; letter-spacing:0.04em; text-transform:uppercase; }
  .meta-dot { color:var(--text-soft); opacity:0.4; }
  .meta-age { font-size:11px; color:var(--text-soft); }
  .badge-row { display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; align-items:center; }
  .badge { font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; letter-spacing:0.04em; text-transform:uppercase; }
  .badge-breaking { background:#7f1d1d; color:#fecaca; }
  .badge-trending { background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 28%,transparent); }
  .badge-new { background:#14532d; color:#bbf7d0; }
  .title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:19px; font-weight:700; line-height:1.3; letter-spacing:-0.01em; color:var(--text); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .desc { margin-top:6px; font-size:14px; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .thumb { width:110px; height:110px; flex-shrink:0; border-radius:8px; background:var(--card-hover); object-fit:cover; }
  .bkmk-btn { position:absolute; bottom:18px; right:0; width:30px; height:30px; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; font-size:15px; opacity:0; transition:opacity .15s; color:var(--text-soft); padding:0; }
  article.item:hover .bkmk-btn { opacity:1; }
  article.item.bookmarked .bkmk-btn { opacity:1; color:var(--accent); }

  /* ── HERO (first story) ── */
  article.item.hero { flex-direction:column; gap:10px; padding-bottom:24px; }
  article.item.hero .thumb { width:100%; height:220px; border-radius:10px; }
  article.item.hero .title { font-size:26px; -webkit-line-clamp:4; }
  article.item.hero .desc { -webkit-line-clamp:3; font-size:15px; }

  /* ── STOCKS ── */
  .stock-input-row { display:flex; gap:8px; padding:20px 0 12px; border-bottom:1px solid var(--border); }
  .stock-input { flex:1; padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card-hover); color:var(--text); font-size:14px; outline:none; font-family:inherit; text-transform:uppercase; letter-spacing:0.03em; }
  .stock-input:focus { border-color:var(--accent); }
  .stock-add-btn { padding:0 18px; border-radius:999px; border:none; background:var(--text); color:var(--bg); font-weight:600; font-size:14px; cursor:pointer; }
  .stock-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
  .stock-main { flex:1; min-width:0; }
  .stock-ticker { font-weight:700; font-size:15px; letter-spacing:0.02em; }
  .stock-name { font-size:12px; color:var(--text-soft); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stock-spark { width:70px; height:30px; flex-shrink:0; opacity:0.9; }
  .stock-price { text-align:right; min-width:92px; }
  .stock-price .price { font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; }
  .stock-price .change { font-size:12px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .up { color:#15803d; } [data-theme="dark"] .up { color:#4ade80; }
  .down { color:#b91c1c; } [data-theme="dark"] .down { color:#f87171; }
  .stock-remove { width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--text-soft); cursor:pointer; font-size:18px; line-height:1; padding:0; flex-shrink:0; }
  .stock-remove:hover { background:var(--card-hover); color:var(--accent); }
  .stock-loading { opacity:0.5; }
  .stock-news-header { display:flex; align-items:center; gap:8px; padding:24px 0 4px; border-top:2px solid var(--border); margin-top:8px; }
  .stock-news-title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; color:var(--text); }
  .stock-news-sub { font-size:12px; color:var(--text-muted); margin-left:auto; }
  .stock-news-loading { padding:20px 0; text-align:center; color:var(--text-muted); font-size:13px; }

  /* ── FOOTER ── */
  footer { max-width:760px; margin:40px auto 0; padding:20px; text-align:center; color:var(--text-soft); font-size:12px; border-top:1px solid var(--border); }
  .retry-btn { margin-top:14px; padding:8px 18px; border-radius:999px; background:var(--accent); color:white; border:none; font-size:14px; font-weight:500; cursor:pointer; }

  /* ── RESPONSIVE ── */
  @media (max-width:520px) {
    .brand { font-size:19px; }
    .title { font-size:17px; }
    .thumb { width:84px; height:84px; }
    article.item { padding:16px 0; gap:12px; }
    article.item.hero .thumb { height:170px; }
    article.item.hero .title { font-size:21px; }
    main, .header-row, header, .weather, .section-bar, .quick-tabs, .quote-bar, .search-wrap { padding-left:16px; padding-right:16px; }
    .weather, .section-bar, .quick-tabs, .quote-bar { padding-left:0; padding-right:0; }
    .w-temp { font-size:20px; }
    .w-meta { font-size:11px; gap:6px; }
    .skel-img { width:84px; height:84px; }
    .font-btn { display:none; }
  }

  /* ── OUTDOOR / FISHING ADVISOR ── */
  .fish-advisor { background:color-mix(in srgb,var(--accent) 5%,var(--bg)); border:1px solid var(--border); border-radius:12px; padding:20px; margin:8px 0 20px; }
  .fish-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .fish-title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; }
  .fish-date { font-size:12px; color:var(--text-muted); }
  .fish-bite-meter { display:flex; align-items:center; gap:16px; padding:14px; background:var(--card-hover); border-radius:8px; margin-bottom:14px; flex-wrap:wrap; }
  .fish-bite-score { font-size:38px; line-height:1; flex-shrink:0; }
  .fish-bite-info { flex:1; min-width:80px; }
  .fish-bite-label { font-weight:700; font-size:16px; }
  .fish-bite-sub { font-size:13px; color:var(--accent); margin-top:2px; letter-spacing:0.02em; }
  .fish-conditions { display:flex; gap:16px; flex-wrap:wrap; }
  .fish-lake-stat { text-align:center; min-width:48px; }
  .fish-stat-val { font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
  .fish-stat-lbl { font-size:11px; color:var(--text-muted); }
  .fish-stat-trend { font-size:11px; font-weight:700; margin-top:2px; }
  .fish-stat-trend.rising { color:#15803d; } [data-theme="dark"] .fish-stat-trend.rising { color:#4ade80; }
  .fish-stat-trend.falling { color:#b91c1c; } [data-theme="dark"] .fish-stat-trend.falling { color:#f87171; }
  .fish-stat-trend.stable { color:var(--text-muted); }
  .fish-section { margin:12px 0; }
  .fish-section-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-bottom:6px; }
  .fish-chip { display:inline-block; padding:4px 10px; border-radius:999px; background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent); font-size:12px; font-weight:600; margin:2px 3px 2px 0; }
  .fish-chip-bait { background:color-mix(in srgb,#2563eb 10%,transparent); color:#2563eb; }
  [data-theme="dark"] .fish-chip-bait { color:#60a5fa; background:color-mix(in srgb,#60a5fa 13%,transparent); }
  .fish-chip-spot { background:color-mix(in srgb,#059669 10%,transparent); color:#059669; font-size:11px; }
  [data-theme="dark"] .fish-chip-spot { color:#34d399; background:color-mix(in srgb,#34d399 13%,transparent); }
  .fish-tip { font-size:14px; color:var(--text); line-height:1.5; padding:9px 12px; background:var(--card-hover); border-radius:6px; margin:5px 0; }
  .outdoor-news-header { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; padding:16px 0 8px; border-bottom:2px solid var(--border); margin-bottom:4px; }
  .fish-loading { padding:24px 0; text-align:center; color:var(--text-muted); font-size:14px; }
</style>
</head>
<body>

<div id="alertBanner"></div>
<div id="drawerOverlay" class="drawer-overlay"></div>

<nav id="drawer" class="drawer" aria-label="Navigation">
  <div class="drawer-header">
    <div class="drawer-brand">Matt's Daily<span>.</span>Read</div>
    <button id="drawerClose" class="drawer-close" aria-label="Close menu">×</button>
  </div>
  <div id="drawerList" class="drawer-list"></div>
</nav>

<header>
  <div class="header-row">
    <button class="icon-btn" id="menuBtn" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">Matt's Daily<span>.</span>Read</div>
    <div class="header-actions">
      <button class="font-btn" id="fontSmBtn" aria-label="Smaller text">A−</button>
      <button class="font-btn" id="fontLgBtn" aria-label="Larger text">A+</button>
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>

function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
}
function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
}
function extractImg(html) {
  if (!html) return "";
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  return m ? m[1] : "";
}
function relativeTime(ts) {
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  if (diff < 604800) return Math.floor(diff/86400) + "d ago";
  return new Date(ts).toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Heat score: source weight × exponential recency decay (half-life ~12h)
function heatScore(item) {
  const ageHours = (Date.now() - item.pubDate) / 3600000;
  const decay = Math.exp(-ageHours / 12);
  const weight = SOURCE_WEIGHT[item.source] || SOURCE_WEIGHT["default"];
  return decay * weight;
}

// Breaking news keyword detection
const BREAKING_RE = /\b(breaking|urgent|alert|developing|just in|emergency|exclusive)\b/i;
function isBreaking(title) { return BREAKING_RE.test(title); }

// Cross-source trending: count how many distinct sources share overlapping title words
function wordSet(title) {
  const stop = new Set(["the","a","an","in","of","to","and","is","for","on","at","by","with","as","from","are","was","his","her","its","it","says","say","after","over"]);
  return new Set(title.toLowerCase().split(/\W+/).filter(w => w.length > 3 && !stop.has(w)));
}
function markTrending(items) {
  const sets = items.map(i => wordSet(i.title));
  items.forEach((item, i) => {
    let matches = 0;
    const seenSources = new Set([item.source]);
    sets.forEach((s, j) => {
      if (i === j) return;
      if (seenSources.has(items[j].source)) return;
      const inter = [...sets[i]].filter(w => s.has(w));
      if (inter.length / Math.max(sets[i].size, s.size, 1) >= 0.38) {
        matches++;
        seenSources.add(items[j].source);
      }
    });
    item.trending = matches >= 2;
  });
}

// Normal pool elevation for Truman Lake = 706.0 ft NGVD
const TRUMAN_NORMAL_POOL = 706.0;
const TRUMAN_READINGS_KEY = "news.truman.history";

async function fetchTrumanLake() {
  let stage = null, time = null, source = null;

  // 1) USGS site 06922540 — Truman Lake pool elevation (most reliable)
  try {
    const res = await fetchWithTimeout(
      "https://waterservices.usgs.gov/nwis/iv/?sites=06922540&parameterCd=00062&format=json&siteStatus=all", 7000
    );
    if (res.ok) {
      const data = await res.json();
      const ts = data?.value?.timeSeries?.[0];
      const vals = ts?.values?.[0]?.value || [];
      const last = [...vals].reverse().find(v => v.value && v.value !== "-999999");
      if (last) {
        const val = parseFloat(last.value);
        if (isFinite(val) && val > 500) { stage = val; time = last.dateTime; source = "USGS pool elev"; }
      }
    }
  } catch(e) { console.warn("USGS Truman:", e); }

  // 2) USGS outflow gauge fallback
  if (stage === null) {
    try {
      const res = await fetchWithTimeout(
        "https://waterservices.usgs.gov/nwis/iv/?sites=06922550&parameterCd=00065&format=json&siteStatus=all", 6000
      );
      if (res.ok) {
        const data = await res.json();
        const ts = data?.value?.timeSeries?.[0];
        const vals = ts?.values?.[0]?.value || [];
        const last = [...vals].reverse().find(v => v.value && v.value !== "-999999");
        if (last) {
          const val = parseFloat(last.value);
          if (isFinite(val) && val >= 0) { stage = val; time = last.dateTime; source = "USGS stage"; }
        }
      }
    } catch(e) { console.warn("USGS stage:", e); }
  }

  // 3) NOAA NWS fallback
  if (stage === null) {
    for (const ep of [
      "https://api.water.noaa.gov/nwps/v1/gauges/TUMM7/stageflow/observed",
      "https://api.water.noaa.gov/nwps/v1/gauges/WRSM7/stageflow/observed"
    ]) {
      try {
        const res = await fetchWithTimeout(ep, 5000);
        if (!res.ok) continue;
        const data = await res.json();
        const rows = (data?.data) || [];
        const last = [...rows].reverse().find(r => r.primary != null);
        if (!last) continue;
        const val = parseFloat(last.primary);
        if (!isFinite(val)) continue;
        stage = val; time = last.validTime; source = ep.includes("WRSM7") ? "Warsaw" : "Truman";
        break;
      } catch(e) { console.warn("NOAA lake:", e); }
    }
  }

  if (stage === null) return null;

  // Track rise/fall: store rolling history in localStorage
  let history = [];
  try { history = JSON.parse(localStorage.getItem(TRUMAN_READINGS_KEY) || "[]"); } catch {}
  history.push({ stage, ts: Date.now() });
  history = history.filter(r => Date.now() - r.ts < 24 * 3600000).slice(-48);
  try { localStorage.setItem(TRUMAN_READINGS_KEY, JSON.stringify(history)); } catch {}

  // Compare to reading ~3 hours ago for trend
  let trend = "stable", trendDiff = 0;
  const threeHoursAgo = Date.now() - 3 * 3600000;
  const oldReading = [...history].reverse().find(r => r.ts <= threeHoursAgo);
  if (oldReading) {
    trendDiff = stage - oldReading.stage;
    if (trendDiff > 0.05) trend = "rising";
    else if (trendDiff < -0.05) trend = "falling";
  }

  const isElevation = source === "USGS pool elev";
  const aboveBelow = isElevation ? (stage - TRUMAN_NORMAL_POOL).toFixed(1) : null;

  return { stage, time, source, trend, trendDiff: Math.abs(trendDiff).toFixed(2), isElevation, aboveBelow };
}

function parseXmlFeed(xmlText, source) {
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.querySelector("parsererror")) return [];
  const isAtom = doc.documentElement.nodeName.toLowerCase()==="feed";
  const entries = Array.from(doc.querySelectorAll(isAtom?"entry":"item"));
  return entries.slice(0, PER_FEED_LIMIT).map(el => {
    const get = sel => { const n=el.querySelector(sel); return n?n.textContent.trim():""; };
    let link="";
    if (isAtom) {
      const a = el.querySelector("link[rel='alternate']")||el.querySelector("link");
      link = a?(a.getAttribute("href")||a.textContent.trim()):"";
    } else { link=get("link"); }
    const title=get("title"), desc=get("description")||get("summary")||get("content");
    const pubStr=get("pubDate")||get("published")||get("updated");
    const enclosure=el.querySelector("enclosure[url]");
    return {
      title, link,
      description: stripHtml(desc).slice(0,240),
      pubDate: pubStr?new Date(pubStr).getTime():Date.now(),
      thumbnail: (enclosure?enclosure.getAttribute("url"):extractImg(desc))||"",
      source
    };
  }).filter(x=>x.title&&x.link);
}

async function fetchViaProxy(proxy, feed) {
  const res = await fetchWithTimeout(proxy.url(feed.url), FEED_TIMEOUT_MS);
  if (!res.ok) throw new Error(proxy.name+" HTTP "+res.status);
  if (proxy.parse==="json") {
    const data = await res.json();
    if (data.status!=="ok"||!Array.isArray(data.items)) throw new Error("bad rss2json");
    return data.items.slice(0,PER_FEED_LIMIT).map(it=>({
      title:(it.title||"").trim(), link:it.link,
      description: stripHtml(it.description||it.content||"").slice(0,240),
      pubDate: it.pubDate?new Date(it.pubDate).getTime():Date.now(),
      thumbnail: it.thumbnail||(it.enclosure&&it.enclosure.link)||extractImg(it.content||it.description)||"",
      source: feed.source
    })).filter(x=>x.title&&x.link);
  }
  if (proxy.parse==="allorigins") {
    const data = await res.json();
    if (!data.contents) throw new Error("empty allorigins");
    return parseXmlFeed(data.contents, feed.source);
  }
  if (proxy.parse==="xml") {
    const text = await res.text();
    if (!text || text.length < 50) throw new Error("empty xml response");
    return parseXmlFeed(text, feed.source);
  }
  throw new Error("unknown parse mode");
}

// Race both proxies simultaneously — use whichever responds first with valid data
async function fetchFeed(feed) {
  const cacheKey = "news.cache." + feed.url;
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try { const p=JSON.parse(cached); if(Date.now()-p.ts<CACHE_TTL_MS) return p.items; } catch {}
  }
  // Race all proxies — resolve on first success, ignore failures
  const items = await new Promise(resolve => {
    let settled = false, failed = 0;
    PROXIES.forEach(proxy => {
      fetchViaProxy(proxy, feed)
        .then(result => {
          if (!settled && result.length) {
            settled = true;
            try { localStorage.setItem(cacheKey, JSON.stringify({ts:Date.now(), items:result})); } catch {}
            resolve(result);
          } else if (!settled) {
            failed++;
            if (failed === PROXIES.length) resolve([]);
          }
        })
        .catch(() => {
          if (!settled) {
            failed++;
            if (failed === PROXIES.length) resolve([]);
          }
        });
    });
  });
  return items;
}

function generateFishingAdvice(lake, weather) {
  const now = new Date();
  const month = now.getMonth(); // 0-11
  const hour = now.getHours();
  const c = weather?.current || {};
  const airTempF = isFinite(c.temperature_2m) ? c.temperature_2m : 68;
  const windMph  = isFinite(c.wind_speed_10m) ? c.wind_speed_10m : 5;
  const weatherCode = c.weather_code ?? 0;

  const season = (month<=1||month===11)?"winter":(month<=4)?"spring":(month<=7)?"summer":"fall";
  const isRaining = weatherCode >= 51 && weatherCode < 95;
  const isStormy  = weatherCode >= 95;
  const isDawn    = hour>=5 && hour<8;
  const isEvening = hour>=17 && hour<20;
  const isMidDay  = hour>=11 && hour<16;
  const isNight   = hour>=20 || hour<5;

  let bite = 3; // 1–5
  let tips = [], topSpecies = [], baits = [], hotspots = [];

  // ── SEASON BASE ──
  if (season==="spring") {
    bite=4;
    topSpecies=["White Crappie","Largemouth Bass","White Bass"];
    tips.push("Spring is prime time on Truman. Crappie are spawning in the shallows near flooded timber (3–8 ft). White bass are running hard up the Grand and Osage River arms — look for surface action wherever shad are busting.");
    baits=["1/16 oz chartreuse/white jig","live minnow under a slip float","small shad-colored crankbait (size 5)","white Road Runner spinnerbait"];
    hotspots=["Grand River arm brushy coves","Tebo Creek inlet","South Grand spawning flats","Any protected cove with 4–8 ft standing timber"];
  } else if (season==="summer") {
    bite = airTempF>88 ? 2 : 3;
    topSpecies=["Channel Catfish","Flathead Catfish","Largemouth Bass","Crappie"];
    if (airTempF>86) {
      tips.push("Summer heat is on — fish are pushed deep or resting. Your windows are 5–9 AM and 7 PM–midnight. Midday is mostly a waste unless you're targeting deep structure with a drop shot or Carolina rig (20–35 ft).");
    } else {
      tips.push("Early summer pattern: bass are chasing shad along submerged creek channel edges. Hit topwater at dawn, then go deep as the sun rises. Catfish are excellent right now — night fishing from shore near current breaks is hard to beat.");
    }
    baits=["Cut shad or skipjack (catfish)","Texas-rigged green pumpkin Senko","Whopper Plopper at dawn","Deep-diving shad crankbait (15–20 ft)"];
    hotspots=["Main lake submerged creek channels (25–35 ft)","Dam tailwaters for big cats","Night-lit boat docks","Rocky points at dawn"];
  } else if (season==="fall") {
    bite=4;
    topSpecies=["Largemouth Bass","White Crappie","White Bass","Walleye"];
    tips.push("Fall is the second best season on Truman. Bass are aggressively chasing shad onto flats and points — match the hatch with shad-colored baits. Crappie stack on deeper timber (15–25 ft) as temps drop. Walleye start moving shallower at night.");
    baits=["Shad-colored squarebill crankbait","White 3/8 oz spinnerbait","1/8 oz marabou jig (white/chartreuse)","Jerkbait worked slow near deep timber"];
    hotspots=["Shad-covered windward points","Creek channel drop-offs (15–25 ft)","Rock humps near the main lake","Timber edges in 10–20 ft at night for walleye"];
  } else {
    bite=2;
    topSpecies=["White Crappie","Channel Catfish"];
    tips.push("Winter crappie on Truman can be excellent if you slow way down. They're stacked on deep main-lake structure (25–40 ft). Use the lightest jig that will still reach bottom and barely twitch it. Patience is everything — a bite might take 30 seconds of no movement.");
    baits=["1/32 oz tube jig (pink/white)","Live minnow on a long-line rig","Blade bait worked very slowly","Drop shot with small finesse worm"];
    hotspots=["Main lake points 25–40 ft","Deep river channel bends","Submerged roadbeds at depth","Deepest standing timber you can find"];
  }

  // ── LAKE LEVEL MODIFIER ──
  if (lake?.trend==="rising") {
    bite = Math.min(5, bite+1);
    tips.push("Rising water is triggering a feeding response — bass and crappie are pushing into newly flooded timber edges and shoreline brush. Work the freshest flooded cover you can find, especially grass and brush in 2–5 ft.");
  } else if (lake?.trend==="falling") {
    tips.push("Falling water is pushing fish off the flats. Follow them to the nearest channel edge or deep timber. Concentrate on the last structural piece before the drop.");
  }
  if (lake?.isElevation && lake?.aboveBelow !== null) {
    const diff = parseFloat(lake.aboveBelow);
    if (diff > 2) tips.push("Pool is "+Math.abs(diff).toFixed(1)+" ft above normal — bank fishing access may be limited but flooded brush and timber are prime ambush spots.");
    else if (diff < -2) tips.push("Pool is "+Math.abs(diff).toFixed(1)+" ft below normal — fish are concentrated in the remaining deep water. Main lake structure is your best bet.");
  }

  // ── WIND MODIFIER ──
  if (windMph>20) {
    bite = Math.max(1, bite-1);
    tips.push("High winds ("+Math.round(windMph)+" mph) — seek the protected coves and river arm backwaters. Wind-blown rocky points can still be productive for bass; the wave action oxygenates the water and pushes baitfish.");
  } else if (windMph>=7 && windMph<=18) {
    bite = Math.min(5, bite+0.5);
    tips.push("The "+Math.round(windMph)+" mph breeze is your friend — fish the banks the wind is blowing into. Wave action breaks up the surface and pushes baitfish against the bank, concentrating feeding fish.");
  }

  // ── RAIN / STORM ──
  if (isStormy) {
    bite=1;
    tips=["⚠️ Storm conditions — stay off the water. Lightning and open water are a deadly combination. Wait it out."];
    baits=[]; hotspots=[];
  } else if (isRaining) {
    bite = Math.min(5, bite+0.5);
    tips.push("Light rain reduces surface glare and can trigger aggressive feeding, especially for bass and catfish. Runoff points where tributary creeks enter the lake are prime — fish congregate where fresh, oxygenated water flows in.");
  }

  // ── TIME OF DAY ──
  if (isDawn || isEvening) {
    bite = Math.min(5, bite+0.5);
    tips.push((isDawn?"Dawn":"Evening")+" hour: topwater is the move right now. Work a Whopper Plopper, buzzbait, or popper along timber edges and points in 2–6 ft. This is your best window of the day.");
  } else if (isMidDay && airTempF>78 && !isRaining) {
    tips.push("Midday sun — go deep or go slow. Drop shot or Carolina rig at 20+ ft, or target shaded dock areas. The bite will slow significantly until evening.");
  } else if (isNight && !isStormy) {
    tips.push("Night fishing on Truman: catfish are your primary target — set up on a creek channel bend with cut shad on circle hooks. Largemouth bass also feed actively on surface lures and big swimbaits after dark near lighted docks.");
  }

  bite = Math.round(Math.max(1, Math.min(5, bite)));
  return { bite, tips, topSpecies, baits, hotspots, season };
}

async function fetchTextThroughProxies(targetUrl) {
  let lastErr;
  for (const proxy of CORS_PROXIES) {
    try {
      const res=await fetchWithTimeout(proxy.url(targetUrl), FEED_TIMEOUT_MS);
      if (!res.ok) { lastErr=new Error(proxy.name+" HTTP "+res.status); continue; }
      const text=await res.text();
      if (!text||text.length<10) { lastErr=new Error(proxy.name+" empty"); continue; }
      return text;
    } catch(err) { lastErr=err; }
  }
  throw lastErr||new Error("all stock proxies failed");
}

async function fetchQuoteYahoo(ticker) {
  const yahooUrl="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(ticker)+"?interval=1d&range=1mo";
  const text=await fetchTextThroughProxies(yahooUrl);
  const data=JSON.parse(text);
  const result=data&&data.chart&&data.chart.result&&data.chart.result[0];
  if (!result) throw new Error("no chart data");
  const meta=result.meta||{};
  const closesRaw=(result.indicators&&result.indicators.quote&&result.indicators.quote[0]&&result.indicators.quote[0].close)||[];
  const closes=closesRaw.filter(x=>x!==null&&x!==undefined);
  const price=(meta.regularMarketPrice!==undefined&&meta.regularMarketPrice!==null)?meta.regularMarketPrice:closes[closes.length-1];
  const prevClose=(meta.chartPreviousClose!==undefined&&meta.chartPreviousClose!==null)?meta.chartPreviousClose:(meta.previousClose||closes[closes.length-2]);
  const change=price-prevClose;
  return { ticker, name:meta.shortName||meta.longName||ticker, price, change, changePct:(change/prevClose)*100, currency:meta.currency||"USD", closes:closes.slice(-30), source:"Yahoo" };
}
async function fetchQuoteStooq(ticker) {
  const sym=ticker.toLowerCase()+(ticker.indexOf(".")===-1?".us":"");
  const csv=await fetchTextThroughProxies("https://stooq.com/q/d/l/?s="+encodeURIComponent(sym)+"&i=d");
  if (!csv||csv.indexOf("Date")===-1) throw new Error("no stooq data");
  const rows=csv.trim().split(/\r?\n/).slice(1).map(l=>l.split(",")).filter(r=>r.length>=5);
  if (rows.length<2) throw new Error("not enough rows");
  const closes=rows.slice(-30).map(r=>parseFloat(r[4])).filter(x=>!isNaN(x));
  if (closes.length<2) throw new Error("bad closes");
  const price=closes[closes.length-1], prev=closes[closes.length-2], change=price-prev;
  return { ticker, name:ticker, price, change, changePct:(change/prev)*100, currency:"USD", closes, source:"Stooq" };
}
async function fetchQuote(ticker, force) {
  const cacheKey="news.quote."+ticker;
  if (!force) {
    const cached=localStorage.getItem(cacheKey);
    if (cached) { try { const p=JSON.parse(cached); if(Date.now()-p.ts<STOCKS_CACHE_TTL_MS) return p.data; } catch {} }
  }
  for (const fn of [fetchQuoteYahoo, fetchQuoteStooq]) {
    try {
      const info=await fn(ticker);
      if (info&&isFinite(info.price)&&isFinite(info.change)) {
        try { localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data:info})); } catch {}
        return info;
      }
    } catch(err) { console.warn("["+ticker+"] "+fn.name+":", (err&&err.message)||err); }
  }
  return null;
}
function sparklineSvg(closes) {
  if (!closes||closes.length<2) return '<div class="stock-spark"></div>';
  const w=70,h=30,pad=2,min=Math.min(...closes),max=Math.max(...closes),range=max-min||1;
  const points=closes.map((c,i)=>{
    const x=pad+(i/(closes.length-1))*(w-2*pad);
    const y=h-pad-((c-min)/range)*(h-2*pad);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  const up=closes[closes.length-1]>=closes[0];
  return '<svg class="stock-spark" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg"><polyline fill="none" stroke="'+(up?"#22c55e":"#ef4444")+'" stroke-width="1.5" points="'+points+'"/></svg>';
}
function fmtMoney(n,currency) {
  if (n===null||n===undefined||!isFinite(n)) return "—";
  return (currency==="USD"?"$":"")+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtChange(abs,pct) {
  if (abs===null||abs===undefined||!isFinite(abs)) return "—";
  const sign=abs>=0?"+":"";
  return sign+abs.toFixed(2)+" ("+sign+pct.toFixed(2)+"%)";
}

}

async function loadStocks(force) {
  listEl.innerHTML=""; statusEl.style.display="none";
  const watchlist=getWatchlist();
  const inputRow=document.createElement("div");
  inputRow.className="stock-input-row";
  inputRow.innerHTML='<input class="stock-input" id="stockInput" placeholder="Add ticker (e.g. NVDA)" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"><button class="stock-add-btn" id="stockAddBtn">Add</button>';
  listEl.appendChild(inputRow);
  const rowsContainer=document.createElement("div");
  rowsContainer.id="stockRows";
  listEl.appendChild(rowsContainer);
  if (!watchlist.length) {
    rowsContainer.innerHTML='<div class="status">Your watchlist is empty. Add a ticker above.</div>';
  } else {
    watchlist.forEach(t=>{
      const row=document.createElement("div");
      row.className="stock-row stock-loading"; row.id="stock-row-"+t;
      const displayTicker=TICKER_DISPLAY[t]||t;
      row.innerHTML='<div class="stock-main"><div class="stock-ticker">'+escapeHtml(displayTicker)+'</div><div class="stock-name">Loading…</div></div>'+
        '<div class="stock-spark"></div>'+
        '<div class="stock-price"><div class="price">—</div><div class="change">—</div></div>'+
        '<button class="stock-remove" data-ticker="'+escapeHtml(t)+'" title="Remove">×</button>';
      rowsContainer.appendChild(row);
    });
  }
  const newsSection=document.createElement("div"); newsSection.id="stockNewsSection";
  listEl.appendChild(newsSection);
  const input=document.getElementById("stockInput"), addBtn=document.getElementById("stockAddBtn");
  const addTicker=()=>{
    const v=(input.value||"").trim().toUpperCase().replace(/[^A-Z0-9.\-=]/g,"");
    if (!v) return;
    const wl=getWatchlist();
    if (wl.includes(v)) { input.value=""; return; }
    wl.push(v); setWatchlist(wl); input.value=""; loadStocks();
  };
  addBtn.addEventListener("click",addTicker);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") addTicker(); });
  rowsContainer.querySelectorAll(".stock-remove").forEach(btn=>{
    btn.addEventListener("click",()=>{ setWatchlist(getWatchlist().filter(x=>x!==btn.getAttribute("data-ticker"))); loadStocks(); });
  });
  await Promise.all([
    Promise.all(watchlist.map(async t=>{
      const q=await fetchQuote(t,force);
      const row=document.getElementById("stock-row-"+t);
      if (!row) return;
      row.classList.remove("stock-loading");
      if (!q) { row.querySelector(".stock-name").textContent="Couldn't load — proxies rate-limited"; return; }
      const up=q.change>=0;
      row.querySelector(".stock-name").textContent=q.name+(q.source?" · "+q.source:"");
      const oldSpark=row.querySelector(".stock-spark");
      if (oldSpark) oldSpark.outerHTML=sparklineSvg(q.closes);
      row.querySelector(".stock-price").innerHTML=
        '<div class="price">'+fmtMoney(q.price,q.currency)+'</div>'+
        '<div class="change '+(up?"up":"down")+'">'+fmtChange(q.change,q.changePct)+'</div>';
    })),
    loadStockNews(force)
  ]);
}

// ========== ARTICLE BUILDER ==========
function buildArticle(item, isHero) {
  const a = document.createElement("a");
  a.className = "item" + (isHero?" hero":"") + (isRead(item.link)?" read":"") + (isSaved(item.link)?" bookmarked":"");
  a.href = item.link;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("role","article");
  a.dataset.link = item.link;

  const hasImg = item.thumbnail && /^https?:\/\//.test(item.thumbnail);
  const breaking = isBreaking(item.title);
  const badgeHtml =
    (breaking || item.trending || item.isNew)
    ? '<div class="badge-row">' +
        (breaking ? '<span class="badge badge-breaking">Breaking</span>' : '') +
        (item.trending ? '<span class="badge badge-trending">Trending</span>' : '') +
        (item.isNew ? '<span class="badge badge-new">New</span>' : '') +
      '</div>'
    : '';

  a.innerHTML =
    '<div class="item-text">' +
      '<div class="meta">' +
        '<span class="source-chip">'+escapeHtml(item.source)+'</span>' +
        '<span class="meta-dot">·</span>' +
        '<span class="meta-age">'+relativeTime(item.pubDate)+'</span>' +
      '</div>' +
      badgeHtml +
      '<div class="title">'+escapeHtml(item.title)+'</div>' +
      (item.description?'<div class="desc">'+escapeHtml(item.description)+'</div>':'') +
    '</div>' +
    (hasImg?'<img class="thumb" src="'+escapeHtml(item.thumbnail)+'" alt="" loading="lazy" onerror="this.remove()">':'') +
    '<button class="bkmk-btn" title="'+(isSaved(item.link)?"Remove bookmark":"Bookmark")+'">'+(isSaved(item.link)?"🔖":"🏷️")+'</button>';

  // Mark read on click
  a.addEventListener("click", e => {
    if (e.target.classList.contains("bkmk-btn")) { e.preventDefault(); return; }
    markRead(item.link);
    a.classList.add("read");
  });

  // Bookmark button
  const bkmkBtn = a.querySelector(".bkmk-btn");
  bkmkBtn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const nowSaved = toggleSave(item);
    a.classList.toggle("bookmarked", nowSaved);
    bkmkBtn.textContent = nowSaved ? "🔖" : "🏷️";
    bkmkBtn.title = nowSaved ? "Remove bookmark" : "Bookmark";
  });

  return a;
}

// ========== RENDER NEWS ==========
function renderNews(items) {
  kbIndex = -1;
  const frag = document.createDocumentFragment();
  items.forEach((item, i) => {
    frag.appendChild(buildArticle(item, i === 0));
  });
  listEl.innerHTML = "";
  listEl.appendChild(frag);
}

// ========== SKELETON ==========
function showSkeleton(n) {
  listEl.innerHTML = Array.from({length:n}, () =>
    '<div class="skel">' +
      '<div class="skel-body">' +
        '<div class="skel-line s1"></div>' +
        '<div class="skel-line s2"></div>' +
        '<div class="skel-line s3"></div>' +
        '<div class="skel-line s4"></div>' +
        '<div class="skel-line s5"></div>' +
      '</div>' +
      '<div class="skel-img"></div>' +
    '</div>'
  ).join("");
}

// ========== LOAD CATEGORY ==========
async function loadCategory(force) {
  const cat = CATEGORIES.find(c => c.id === activeCat);

  if (cat.isStocks)  return loadStocks(force);
  if (cat.isOutdoor) return loadOutdoor(force);

  if (cat.isSaved) {
    statusEl.style.display = "none";
    const saved = getSaved();
    if (!saved.length) {
      listEl.innerHTML = '<div class="status">No saved stories yet. Hover any article and tap 🏷️ to save it.</div>';
    } else {
      currentItems = saved;
      renderNews(saved);
    }
    return;
  }

  showSkeleton(7);
  statusEl.style.display = "none";
  newPillEl.style.display = "none";

  if (force) cat.feeds.forEach(f => localStorage.removeItem("news.cache." + f.url));

  const lastVisit = parseInt(localStorage.getItem("news.lastVisit."+cat.id) || "0");
  localStorage.setItem("news.lastVisit."+cat.id, String(Date.now()));
  const cutoffMs = cat.maxAgeHours ? Date.now() - cat.maxAgeHours * 3600000 : 0;

  // Fetch all feeds in parallel, catch individual failures so one bad feed doesn't break everything
  const results = await Promise.all(cat.feeds.map(f => fetchFeed(f).catch(() => [])));
  const all = results.flat();

  // Deduplicate, apply recency window, sort by heat score
  const seen = new Set();
  const deduped = all.filter(item => {
    if (cutoffMs && item.pubDate < cutoffMs) return false;
    const key = item.title.toLowerCase().slice(0, 60);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).sort((a, b) => heatScore(b) - heatScore(a));

  if (deduped.length === 0) {
    listEl.innerHTML = "";
    statusEl.style.display = "block";
    statusEl.innerHTML = "Couldn't load any stories. The RSS proxies may be slow or down.<br>" +
      '<span style="opacity:.6">Tried: '+cat.feeds.map(f=>f.source).join(", ")+'</span><br>' +
      '<button class="retry-btn" onclick="loadCategory(true)">Try again</button>';
    return;
  }

  markTrending(deduped);
  deduped.forEach(i => { i.isNew = lastVisit > 0 && i.pubDate > lastVisit; });
  currentItems = deduped;
  renderNews(deduped);

  const newCount = deduped.filter(i => i.isNew).length;
  if (newCount > 0 && lastVisit > 0) {
    newPillEl.textContent = newCount + " new";
    newPillEl.style.display = "";
  }
}

window.loadCategory = loadCategory;

// ========== KEYBOARD NAVIGATION ==========
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { closeDrawer(); if(searchOpen){searchBtn.click();} return; }
  const articles = [...listEl.querySelectorAll("article.item")];
  if (!articles.length) return;
  if (e.key === "j" || e.key === "ArrowDown") {
    e.preventDefault();
    articles[kbIndex]?.classList.remove("kb-focus");
    kbIndex = Math.min(kbIndex + 1, articles.length - 1);
    articles[kbIndex].classList.add("kb-focus");
    articles[kbIndex].scrollIntoView({ block:"nearest", behavior:"smooth" });
  } else if (e.key === "k" || e.key === "ArrowUp") {
    e.preventDefault();
    articles[kbIndex]?.classList.remove("kb-focus");
    kbIndex = Math.max(kbIndex - 1, 0);
    articles[kbIndex].classList.add("kb-focus");
    articles[kbIndex].scrollIntoView({ block:"nearest", behavior:"smooth" });
  } else if (e.key === "Enter" && kbIndex >= 0) {
    const link = articles[kbIndex]?.href;
    if (link) window.open(link, "_blank", "noopener");
  } else if (e.key === "b" && kbIndex >= 0) {
    const bkmkBtn = articles[kbIndex]?.querySelector(".bkmk-btn");
    if (bkmkBtn) bkmkBtn.click();
  }
});

// ========== INIT ==========
document.getElementById("refreshBtn").addEventListener("click", () => {
  localStorage.removeItem("news.nws.alerts");
  fetchNWSAlerts(); loadWeather(true); loadCategory(true);
});

// Pull-to-refresh
let startY=0, pulling=false;
document.addEventListener("touchstart", e=>{ if(window.scrollY===0){startY=e.touches[0].clientY;pulling=true;} },{passive:true});
document.addEventListener("touchend", e=>{
  if (!pulling) return;
  if (e.changedTouches[0].clientY - startY > 80) { fetchNWSAlerts(); loadWeather(true); loadCategory(true); }
  pulling=false;
});

renderQuoteOfDay();
renderDrawer();
renderQuickTabs();
updateSectionLabel();
fetchNWSAlerts();
loadWeather();
loadCategory();

setInterval(()=>{ localStorage.removeItem("news.nws.alerts"); fetchNWSAlerts(); }, ALERTS_CACHE_TTL_MS);
</script>
