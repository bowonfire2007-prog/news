      const species = [...panel.querySelectorAll("#tl-species-chips .trip-chip.selected")].map(c => c.dataset.val);
      const baits   = [...panel.querySelectorAll("#tl-bait-chips .trip-chip.selected")].map(c => c.dataset.val);
      const entry = {
        date:       panel.querySelector("#tl-date")?.value  || new Date().toISOString().slice(0,10),
        timeOfDay:  panel.querySelector("#tl-time")?.value  || "",
        species,
        baits,
        spot:       panel.querySelector("#tl-spot")?.value.trim()  || "",
        depth:      panel.querySelector("#tl-depth")?.value || "",
        count:      panel.querySelector("#tl-count")?.value || "",
        notes:      panel.querySelector("#tl-notes")?.value.trim()  || "",
        moonPhase:  moon.emoji + " " + moon.phaseName,
        lakeElev:   lake?.stage ?? null,
        waterTempF: waterTempF ?? null
      };
      addTripEntry(entry);
      renderTripLogPanel(panel, lake, waterTempF);
    });
  }
}

function generateFishingAdvice(lake, weather) {
  // Tailored to Matt's targets at Sparrowfoot / Grand River arm:
  //   Blue Catfish, Flathead Catfish, Crappie, Shad (cast netting), Farm Pond Bluegill
  const now = new Date();
  const month = now.getMonth(); // 0-11
  const hour = now.getHours();
  const c = weather?.current || {};
  const airTempF = isFinite(c.temperature_2m) ? c.temperature_2m : 68;
  const windMph  = isFinite(c.wind_speed_10m) ? c.wind_speed_10m : 5;
  const windDir  = isFinite(c.wind_direction_10m) ? c.wind_direction_10m : null;
  const sustainedHours = windDir !== null ? computeSustainedWindHours(weather?.hourly, windDir) : 0;
  const windBankAdvice = shadBankAdvice(windDir, windMph, sustainedHours);
  const weatherCode = c.weather_code ?? 0;

  const season = (month<=1||month===11)?"winter":(month<=4)?"spring":(month<=7)?"summer":"fall";
  const isRaining = weatherCode >= 51 && weatherCode < 95;
  const isStormy  = weatherCode >= 95;
  const isDawn    = hour>=5 && hour<8;
  const isEvening = hour>=17 && hour<20;
  const isMidDay  = hour>=11 && hour<16;
  const isNight   = hour>=20 || hour<5;

  let bite = 3;
  let tips = [], topSpecies = [], baits = [], hotspots = [];
  let shadTip = "", pondTip = "";

  // ── SEASON BASE ──
  if (season === "spring") {
    bite = 4;
    topSpecies = ["Crappie","Blue Catfish","Flathead Catfish","Shad (bait)"];
    tips.push("Spring on the Grand River arm: crappie are pushing up shallow into flooded timber and brush (3–8 ft) to spawn. Blue cats are running up the Grand chasing shad — drift cut shad through the channel from Sparrowfoot up. Flatheads are waking from winter and staging near deep current breaks; live bluegill is the move.");
    baits = ["1/16 oz chartreuse/white jig (crappie)","Live minnow on a slip float (crappie)","Fresh-cut shad on circle hooks 5/0 (blue cats)","Live bluegill 6–10 in (flatheads)"];
    hotspots = ["Sparrowfoot brushy coves — flooded timber for crappie","Grand River channel below Sparrowfoot (blues drifting cut shad)","Tebo Creek inlet at the mouth","Big laydowns 12–20 ft for staging flatheads"];
    shadTip = "Shad spawn April–May. At dawn watch shorelines for surface splashes that look like raindrops — that's spawning shad on gravel. Throw the cast net on those rings. Creek mouths and runoff points after a warm rain are also stacked.";
    pondTip = "Bluegill aren't bedding yet but are moving shallow as water hits 60°F. Hit any cover (docks, brush, fallen wood) in 3–6 ft. Small piece of worm under a tiny bobber is all you need.";
  } else if (season === "summer") {
    bite = airTempF > 88 ? 2 : 3;
    topSpecies = ["Blue Catfish","Flathead Catfish","Crappie","Shad (bait)"];
    if (airTempF > 86) {
      tips.push("Heat is on. Blue cats and flatheads are the smart play — they thrive in deep, oxygenated water on the Grand channel edges (25–40 ft). Crappie are deep on brush piles in 18–25 ft, requiring a slow vertical presentation. Best windows: 5–9 AM and 7 PM through the night.");
    } else {
      tips.push("Pre-bake summer: blues are stacked on the old riverbed channel — drift fresh-cut shad on a Santee Cooper rig through 25–35 ft. Flatheads are nocturnal — set live bluegill on slip-sinker rigs near big timber and laydowns after dark. Crappie holding deep on brush piles, 1/8 oz hair jig is hard to beat.");
    }
    baits = ["Cut shad or skipjack on Santee rig (blues)","Live bluegill 6–10 in on circle hook (flatheads)","1/8 oz hair jig in 18–25 ft (crappie)","Drop shot with minnow (deep crappie)"];
    hotspots = ["Grand River channel ledges 25–40 ft (blues)","Big standing timber and laydowns 15–25 ft (flatheads, after dark)","Submerged brush piles 18–25 ft (crappie)","Tailwater current breaks below the dam — trophy blues"];
    shadTip = "Best cast netting is at night under marina/dock lights — shad pile up tight under any light source. Throw the net 5–10 ft to the side, not directly under, so they don't spook. At dawn, hit creek mouths before the sun pushes them deep.";
    pondTip = "Bluegill are bedding (June) or post-spawn (July). Bedding gills concentrate in 2–4 ft on sandy or gravel bottoms — accuracy matters, drop a small piece of worm right on the bed. Post-spawn, fish under shaded cover in 4–8 ft midday.";
  } else if (season === "fall") {
    bite = 4;
    topSpecies = ["Blue Catfish","Crappie","Flathead Catfish","Shad (bait)"];
    tips.push("Fall is gold on Truman. Cold fronts push shad into the back of creek arms and blue cats follow in numbers — drift cut shad through 15–25 ft over creek channels. Crappie are gorging before winter, stacked on transitional brush in 12–20 ft. Flatheads feeding heavily before dormancy — last big window for a trophy fish on live bluegill.");
    baits = ["Fresh-cut shad on Santee Cooper rig (drift, blues)","Live skipjack or large shad (trophy blues)","Live bluegill on slip rig (flatheads)","Shad-colored 1/16 oz jig (crappie)"];
    hotspots = ["Creek channel mouths in the Grand River arm","Wind-blown shad-loaded points","Brush on transition banks 12–20 ft (crappie)","Big laydowns deep in creek arms after dark (flatheads)"];
    shadTip = "Cold fronts push shad into creek arms — follow them. Cast net the back third of any creek arm, especially on cloudy windy days when they're less spooky. Watch for surface dimples at dawn.";
    pondTip = "Bluegill move shallow chasing bugs again as water cools through the 60s. Hit any wood or weed cover in 3–6 ft — fly rod, ultralight jig, or a worm under a slip bobber all work.";
  } else {
    // winter
    bite = 2;
    topSpecies = ["Blue Catfish","Crappie"];
    tips.push("Winter Truman: blues are the best bite if you slow way down. They stack in deep wintering holes on the main lake (35–55 ft) — fresh cut shad on a tight-line, virtually no movement. Crappie are deep on brush piles and treetops in 25–40 ft, requiring patience and a soft touch. A bite often takes 30 seconds of no movement.");
    tips.push("Flatheads are mostly dormant — they'll bite occasionally on warm stable days but it's a low-percentage hunt this time of year.");
    baits = ["Fresh-cut shad on tight-line rig (blues)","1/32 oz tube jig pink/white (deep crappie)","Live minnow on long-line slip rig","Blade bait worked very slowly"];
    hotspots = ["Deep main-lake wintering holes 35–55 ft","Standing timber tops in 25–40 ft (crappie)","Channel bends in the Grand near Sparrowfoot","Heat-discharge or warm-water inflow areas"];
    shadTip = "Shad are deep and tightly schooled — cast netting is tough. Best chance: warm-water discharge or deep creek channel ledges where shad concentrate. Most folks fish frozen shad bought from a bait shop in winter.";
    pondTip = "Bluegill go deep and slow. Tiny ice jig tipped with a wax worm or red worm, very slow vertical presentation in 8–15 ft. Best on warming sunny afternoons when surface temp climbs a few degrees.";
  }

  // ── LAKE LEVEL MODIFIER ──
  if (lake?.trend === "rising") {
    bite = Math.min(5, bite + 1);
    tips.push("Rising water — fish are pushing into newly flooded timber and brush. Blues and crappie work the freshest flooded cover in 4–10 ft. Flatheads slide into newly submerged laydowns. Bait gets disoriented on a rise, which makes shad easier to net for a day or two.");
  } else if (lake?.trend === "falling") {
    tips.push("Falling water pulls fish off the flats and back to the channel edges. Blue cats are EXCELLENT right now on channel breaks — they follow disoriented shad pulled out by the drop. Crappie slide deeper to the next structural piece. Flatheads sit tight in their cover.");
  }

  // 24-hour change context — tells how big the swing was and warns of a delayed bite
  if (lake?.dailyChange !== null && lake?.dailyChange !== undefined && isFinite(lake.dailyChange)) {
    const dc = parseFloat(lake.dailyChange);
    if (Math.abs(dc) >= 0.3) {
      const dir = dc >= 0 ? "rose" : "dropped";
      tips.push("Pool "+dir+" "+Math.abs(dc).toFixed(2)+" ft over the last 24 hours — that's a meaningful swing. Give the bite 12–24 hours to settle after the change. Cats fire up first, crappie take longest to settle into a new pattern.");
    }
  }

  // Inflow vs outflow context from USACE — tells you what the dam is actually doing
  if (lake && Number.isFinite(lake.inflow) && Number.isFinite(lake.outflow)) {
    const net = lake.inflow - lake.outflow;
    if (lake.outflow > 5000 && net < -2000) {
      tips.push("Dam is releasing hard ("+lake.outflow.toLocaleString()+" cfs out vs "+lake.inflow.toLocaleString()+" cfs in) — strong current below the dam. Trophy blue cats stack in tailwater current breaks; cut shad on a heavy weight is the move. On the lake itself, blues will be on the channel edges following pulled-out shad.");
    } else if (net > 2000) {
      tips.push("More water coming in than going out ("+lake.inflow.toLocaleString()+" cfs in vs "+lake.outflow.toLocaleString()+" cfs out) — pool is filling. Fish are moving into freshly flooded cover. The runoff bringing fresh water in is also bringing food — hit creek mouths and inflow points.");
    } else if (lake.outflow > 0 && lake.inflow < 200) {
      tips.push("Steady release with low natural inflow — pool will keep dropping until flows balance. Plan for the falling-water bite: blues on channel breaks, crappie sliding deeper.");
    }
  }

  if (lake?.isElevation && lake?.aboveBelow !== null) {
    const diff = parseFloat(lake.aboveBelow);
    if (diff > 2) {
      tips.push("Pool is "+Math.abs(diff).toFixed(1)+" ft above normal — flooded shoreline brush and timber are prime ambush spots for blues and crappie. Bank access is limited but the flooded cover is fresh.");
    } else if (diff < -2) {
      tips.push("Pool is "+Math.abs(diff).toFixed(1)+" ft below normal — fish are concentrated in the remaining deep water. Main lake channel structure is your best bet for blues and crappie. Shad are easier to find since they have less water to spread out in.");
    }
  }

  // ── WIND MODIFIER ──
  if (windMph > 20) {
    bite = Math.max(1, bite - 1);
    tips.push("High winds ("+Math.round(windMph)+" mph) — protected coves and the back of creek arms only. Wind-blown rocky points still produce blues since wave action concentrates baitfish, but bank access on the windward side gets ugly fast.");
  } else if (windMph >= 7 && windMph <= 18) {
    bite = Math.min(5, bite + 0.5);
    tips.push("The "+Math.round(windMph)+" mph breeze is your friend — wind-blown banks load up with shad and blues stack up on the windward side to feed. Anchor or drift cut shad along the windward bank. Watch where the wind is hitting and head there.");
  }

  // ── RAIN / STORM ──
  if (isStormy) {
    bite = 1;
    tips = ["⚠️ Storm conditions — stay off the water. Lightning + open water + tall fishing rods is a deadly combination. Wait it out."];
    baits = []; hotspots = []; shadTip = ""; pondTip = "";
  } else if (isRaining) {
    bite = Math.min(5, bite + 0.5);
    tips.push("Light rain reduces surface glare and triggers feeding. Runoff points where creeks dump fresh muddy water into the lake are prime — blue cats and shad stack right where the colored and clear water meet.");
  }

  // ── TIME OF DAY ──
  if (isDawn || isEvening) {
    bite = Math.min(5, bite + 0.5);
    if (isDawn) {
      tips.push("Dawn — cast net window for shad is wide open right now. After you've got bait, drift cut shad along channel edges for blues. Crappie bite hardest in low light.");
    } else {
      tips.push("Evening — best window of the day for crappie and pre-dark blues. Set up before dark and stay through the first hour after — that's when flatheads start prowling.");
    }
  } else if (isMidDay && airTempF > 78 && !isRaining) {
    tips.push("Midday heat — go deep or wait. Blues on deep channel breaks (30–40 ft) tight-line. Crappie on shaded structure or deep brush. Don't waste time in shallow water until evening.");
  } else if (isNight && !isStormy) {
    tips.push("Night fishing on Truman is prime: flatheads are actively prowling timber, blues feed heavily on deep channels. Live bluegill set near big laydowns for flatheads, fresh-cut shad on the channel for blues.");
  }

  // ── BAROMETRIC PRESSURE ──
  const baro = getBaroTrend();
  if (baro) {
    if (baro.trend === "falling fast") {
      bite = Math.max(1, bite - 1.5);
      tips.push(`⬙ Barometer dropping fast (${baro.change} hPa / 6h) — this is a bite-killer. Fish are moving to deeper water and tightening up. Slow way down, downsize your presentation, and work the deepest structure you can reach. Blues may still eat but crappie will nearly shut off.`);
    } else if (baro.trend === "falling") {
      bite = Math.max(1, bite - 0.5);
      tips.push(`⬙ Pressure easing down — bite may slow over the next few hours, especially for crappie. Blues are more tolerant; keep working cut shad on channel edges but don't expect fast action.`);
    } else if (baro.trend === "rising fast") {
      bite = Math.min(5, bite + 1);
      tips.push(`⬆ Barometer climbing hard (${baro.change} hPa / 6h) — classic post-front feed-up window. Fish that went deep during the pressure drop are moving back to feeding zones. Blues especially will be aggressive on channel edges and current seams right now.`);
    } else if (baro.trend === "rising") {
      bite = Math.min(5, bite + 0.5);
      tips.push(`⬆ Pressure building — conditions improving. Fish are becoming more active and predictable. Work shallow-to-mid structure and expect better response on reaction presentations.`);
    }
    // steady = no adjustment, no extra tip needed
  }

  // ── MOON PHASE & SOLUNAR ──
  const moon = getMoonPhase(now);
  const sol  = getSolunarTimes(now);

  // Determine if we're currently in a major or minor solunar window
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const moonTransitMin = (12 * 60 + moon.age * 50) % 1440;
  const windows = [
    { name: "MAJOR",  center: moonTransitMin,        half: 60 },
    { name: "MAJOR",  center: moonTransitMin + 720,  half: 60 },
    { name: "minor",  center: moonTransitMin - 360,  half: 30 },
    { name: "minor",  center: moonTransitMin + 360,  half: 30 }
  ];
  let activeWindow = null;
  for (const w of windows) {
    const center = ((w.center % 1440) + 1440) % 1440;
    let diff = Math.abs(nowMin - center);
    if (diff > 720) diff = 1440 - diff; // wrap around midnight
    if (diff <= w.half) { activeWindow = w; break; }
  }

  // Moon phase bite adjustment
  if (moon.age < 1.5 || moon.age > 28) {
    // New moon — dark nights, flatheads and blues feed aggressively all night
    bite = Math.min(5, bite + 0.5);
    if (isNight) tips.push(`🌑 New moon tonight — dark water means flatheads and blues are on the prowl hard. Best night of the lunar cycle for big cats. Keep bait in the water as long as you can.`);
    else tips.push(`🌑 New moon phase — night fishing this week will be exceptional for flatheads and blues. Plan an overnight trip if you can.`);
  } else if (moon.age > 13.5 && moon.age < 16) {
    // Full moon — night fishing disrupted; daytime bite often better
    if (isNight) {
      bite = Math.max(1, bite - 0.5);
      tips.push(`🌕 Full moon — bright water tends to scatter baitfish and makes night fishing tougher than usual. Blues and flatheads may be less aggressive. Try mid-depth structure away from bright shallows, or focus on the pre-dawn hour when moon is low.`);
    } else {
      tips.push(`🌕 Full moon phase — daytime bite is often stronger than night this week since fish feed more in moonlit hours overnight and rest during the day. Hit them hard at dawn.`);
    }
  } else if (moon.age > 6.5 && moon.age < 8.5) {
    tips.push(`🌓 First quarter moon — evening bite window is excellent. Fish feed actively as the moon rises around sunset. Plan to be on the water from 5 PM through dark.`);
  } else if (moon.age > 21 && moon.age < 23.5) {
    tips.push(`🌗 Last quarter moon — early morning bite window is your best bet. Moon rises near midnight and sets around noon; pre-dawn feeding is strong.`);
  }

  // Active solunar window — bump bite and call it out
  if (activeWindow) {
    bite = Math.min(5, bite + (activeWindow.name === "MAJOR" ? 1 : 0.5));
    tips.push(`🌙 You're inside a solunar ${activeWindow.name} feed window right now — get your lines in the water. This is when fish are most likely moving and actively feeding. ${activeWindow.name === "MAJOR" ? "Major windows are the prime windows of the day." : "Minor windows are shorter but still worth fishing."}`);
  } else {
    // Find next window
    let nextWin = null, nextDiff = Infinity;
    for (const w of windows) {
      const center = ((w.center % 1440) + 1440) % 1440;
      let diff = center - nowMin;
      if (diff < 0) diff += 1440;
      if (diff < nextDiff) { nextDiff = diff; nextWin = { ...w, minsAway: diff }; }
    }
    if (nextWin && nextWin.minsAway < 180) {
      const h = Math.floor(nextWin.minsAway / 60), m = nextWin.minsAway % 60;
      const timeStr = h > 0 ? `${h}h ${m}m` : `${m} min`;
      tips.push(`🌙 Next solunar ${nextWin.name} window in ${timeStr} — worth timing your best spots around it.`);
    }
  }

  bite = Math.round(Math.max(1, Math.min(5, bite)));
  return { bite, tips, topSpecies, baits, hotspots, season, shadTip, pondTip, windBankAdvice };
}

// ──────────────────────────────────────────────────────────────────────────────
// Smart MUSHROOM HUNTING tips — Missouri season-aware. Tuned for Henry/Benton Co.
// Uses month + recent weather to nudge advice (cool spring slows morels, warm
// rain triggers chanterelles, etc).
// ──────────────────────────────────────────────────────────────────────────────
function getMushroomTips(weather) {
  const now      = new Date();
  const month    = now.getMonth() + 1; // 1-12
  const day      = now.getDate();
  const c        = weather?.current || {};
  const temp     = isFinite(c.temperature_2m) ? c.temperature_2m : null;
  const rain     = isFinite(c.precipitation) ? c.precipitation : 0;
  const recentMm = isFinite(c.rain) ? c.rain : 0;

  let phase = "off-season", banner = "🍄", headline = "Off-Season", sub = "";
  let species = [], spots = [], tips = [], idTip = "", warnTip = "";

  if (month === 3 && day < 25) {
    phase = "pre-morel"; banner = "⏳"; headline = "Just Before Morels";
    sub = "Soil temps still climbing — watch the next two weeks.";
    species = ["Morels (any day now)","Pheasant Back (early)"];
    spots = ["South-facing river bottom slopes warm first","Dying elms along the Grand & Tebo"];
    tips.push("Soil temp is the trigger — when 4-inch soil hits 50°F and stays there, the first greys pop within days. Until then, scout terrain and mark dying elms so you're ready.");
    tips.push("First flush is almost always grey morels on south-facing slopes near water. Big yellows follow 1–2 weeks later on flatter ground.");
  } else if (month === 4 || (month === 3 && day >= 25)) {
    phase = "morel"; banner = "🍄"; headline = "Morel Season — Prime Window";
    sub = "Hunt mornings after a warm rain. Move slow.";
    species = ["Grey Morels","Yellow Morels","Pheasant Back","Half-Frees"];
    spots = ["River-bottom timber along the Osage, Grand, Tebo, Sac","Dying or recently-dead American elms (the #1 producer)","Old apple orchards & fence rows","South-facing slopes early; flat bottoms peak"];
    tips.push("Look for dying elms with the bark just starting to slip — that's the magic tree in Missouri. Yellow morels set up around them on flat ground in the days after a 60°F+ rain.");
    tips.push("Mornings are best — dew makes the honeycomb cap glisten and your eye picks them out. Once you find one, kneel down and look in slow circles — they almost always come in patches of 3–20.");
    tips.push("Carry a mesh onion bag, not plastic. Spores fall through as you walk and reseed your honey holes for next year.");
    if (temp !== null && temp < 45) tips.push("Cold snap right now ("+Math.round(temp)+"°F) — morels pause. They'll resume within a few days of nights staying above 45°F.");
    if (recentMm > 0.1 || rain > 0.1) tips.push("Rain just hit — wait 24–48 hours. Morels swell visibly after a warm rain, and that's when they're easiest to spot.");
    idTip = "TRUE morels have a hollow stem and the cap is fully attached and pitted like a honeycomb. FALSE morels (Gyromitra / 'big reds') have a chambered, brain-like cap and are toxic. When in doubt, slice top-to-bottom: true morels are completely hollow.";
    warnTip = "Never eat any wild mushroom you haven't 100% positively ID'd — get a second opinion the first few times. Cook all morels thoroughly; raw morels can make you sick even when correctly ID'd.";
  } else if (month === 5 && day <= 12) {
    phase = "post-morel"; banner = "🌿"; headline = "Morels Are Done — Pivot to Summer Crew";
    sub = "Season is over for morels. Pheasant back still going; chanterelles 4–6 weeks out.";
    species = ["Pheasant Back (Dryad's Saddle)","Oyster (on dead hardwoods)","Wine Cap (in mulched areas)","Wood Ear (on elder)"];
    spots = ["Dead standing cottonwood, box elder, sweet gum (oysters)","Large dying elm or ash with shelf fungi (pheasant back)","Mulched garden beds or wood chip piles (wine cap)","Dead elderberry stems (wood ear)"];
    tips.push("Morel season is finished for Henry County — soil temps are too high and any remaining fruitings are old, degraded, or slimy. Don't waste time chasing them.");
    tips.push("Pheasant Back (Dryad's Saddle) is often still going through mid-May on large dying elms, ash, and cottonwood. Pick the young, tender growth at the outer edge — the middle gets tough fast. It smells like watermelon rind.");
    tips.push("Oyster mushrooms can appear on dead standing hardwoods during warm, humid stretches right now. Look up — they often grow 6–15 ft high on box elder, cottonwood, and sweet gum.");
    tips.push("This is a good time to scout your summer spots. Walk oak-hickory ridges and note where deer trails cross mossy ground — those areas will push chanterelles in 4–6 weeks after warm rains.");
    if (temp !== null && temp >= 70 && (rain > 0.1 || recentMm > 0.1)) tips.push("Warm and wet right now — check dead hardwoods for oysters and pheasant back. The conditions are right.");
    idTip = "Pheasant Back has a distinctive watermelon-rind smell, pore surface underneath (not gills), and grows in overlapping shelves from living or recently dead wood. No dangerous lookalikes in Missouri.";
    warnTip = "Never eat any wild mushroom you haven't 100% positively ID'd. When in doubt, leave it out.";
  } else if ((month === 5 && day > 12) || month === 6) {
    phase = "early-summer"; banner = "🌾"; headline = "Morels Done — Summer Crew Coming";
    sub = "Switch focus to oak/hickory ridges after warm rains.";
    species = ["Chanterelles (golden)","Chicken-of-the-Woods","Black Trumpets","Oyster (on dead hardwoods)","Indigo Milky","Wood Ear (on elder)"];
    spots = ["Oak-hickory ridges (chanterelles, indigo milky)","Old standing oaks — dead branches with sulfur shelves (CoW)","Beech/oak slopes (trumpets)","Standing dead box elder, cottonwood, sweet gum (oysters)","Dead elderberry stems (wood ear)"];
    tips.push("Chanterelles want 3+ days after a 1\"+ rain when overnight lows stay in the 60s. Look on oak-hickory ridges with mossy ground — they grow from soil, not on wood.");
    tips.push("Chicken-of-the-Woods (sulfur shelf) is the easiest summer ID — bright orange, no gills, soft & spongy. Always on oak in our area. Pick the young, tender outer edge.");
    tips.push("Indigo Milky (Lactarius indigo) is unmistakable — bright blue all over, bleeds blue 'milk' when cut. Common in mixed oak-hickory woods around Henry County after warm June rains. Mild flavor, beautiful in eggs.");
    if (temp !== null && temp >= 75 && (rain > 0.1 || recentMm > 0.1)) tips.push("Warm + just rained = chanterelle window opening. Walk oak-hickory ridges in the next 3–5 days.");
    idTip = "Chanterelles have FALSE gills (forked ridges, not real blade gills) and smell faintly of apricot. Lookalike: Jack-O'-Lantern (Omphalotus) — toxic, has true gills and grows in clusters from buried wood. Always check the gills.";
  } else if (month === 7 || month === 8) {
    phase = "summer"; banner = "🌳"; headline = "Summer Forest Shrooms";
    sub = "Hot & humid = chanterelle and chicken weather.";
    species = ["Chanterelles","Black Trumpets","Chicken-of-the-Woods","Lobster Mushroom","Hedgehog (late summer)","Indigo Milky","Bolete (porcini cousins)","Giant Puffball (late Aug)","Meadow Mushroom"];
    spots = ["Oak-hickory ridges","Mossy stream banks (trumpets)","Dead/dying oak boles (chicken)","Open pastures & fence lines (puffballs, meadow mushrooms)","Mixed hardwoods (boletes, milkies)"];
    tips.push("Walk slow on shaded ridges 2–4 days after any 1\"+ summer storm. The flush comes fast and disappears in a week. Bring water — Missouri summer woods are no joke.");
    tips.push("Giant Puffball (Calvatia gigantea) starts showing in late August in old pastures and along fence lines around Clinton — looks like a soccer ball in the grass. Edible only when pure white inside (slice top to bottom). Once it yellows or browns, it's done.");

  return { phase, banner, headline, sub, species, spots, tips, idTip, warnTip };
}

    chores.push("Top-dress garlic beds with compost. They're waking up.");

    plantNow = ["Potatoes","Onion sets","Leeks","Shallots","Peas (snap, snow, shelling)","Spinach","Lettuce","Arugula","Mustard greens","Swiss chard","Kale","Collards","Bok choy","Kohlrabi","Radish","Beets","Carrots","Parsnips","Turnips","Cabbage/Broccoli/Cauliflower starts","Brussels sprouts starts","Strawberry crowns","Asparagus crowns","Rhubarb crowns","Horseradish root","Raspberry/Blackberry canes","Blueberry bushes","Parsley","Cilantro","Dill","Chives"];
    chores.push("Last frost in Henry County averages around April 15–25. Don't put tomatoes/peppers out yet unless you can cover.");
    chores.push("Asparagus is up — cut spears at soil level for the first 4–6 weeks, then let them fern out to feed the crowns. Year-3+ beds only; let new beds grow untouched the first two seasons.");
    chores.push("Prune fruit trees before bud break if you haven't already.");
    chores.push("Plant new bramble canes (raspberry/blackberry) and blueberry bushes now while dormant — soak roots an hour before planting.");

    chores.push("Mulch tomato beds with straw once soil hits 65°F — locks in moisture and prevents soil-splash blight.");
    chores.push("Strawberries are flowering/fruiting — net for birds, water deeply 1–2× weekly. Pinch first runners back to fatten this year's berries.");
    chores.push("Watch for flea beetles on eggplant — row cover until plants are 12\" or apply diatomaceous earth.");
    chores.push("Sow herb seeds direct: dill, cilantro (every 2–3 weeks for steady supply), and basil after the soil hits 65°F.");
    chores.push("Plant marigolds and nasturtiums around tomatoes & cucumbers — they pull aphids off your veggies and look great doing it.");

    chores.push("Mulch deeply — Missouri June can flip from wet to drought fast. Straw or grass clippings 3\" deep around tomatoes & peppers.");
    chores.push("Side-dress corn and tomatoes with compost or balanced fertilizer when they hit knee-high.");

    chores.push("Pull bolting spring lettuce and spinach — they're done. Compost or feed to chickens.");

    chores.push("Tomato hornworms — handpick at dawn or look for white parasitic-wasp cocoons (leave those — they kill the next round of hornworms for you).");
    chores.push("Harvest tomatoes, peppers, beans every 2–3 days — leaving overripe fruit on the plant tells it to stop producing.");
    chores.push("Start fall brassica seeds indoors mid-July; transplant out late August.");
    if (temp !== null && temp >= 95) warnings.push("Extreme heat — water deeply early morning. Shade cloth on peppers helps fruit set during the worst weeks.");

    chores.push("Pull spent summer plants; turn in compost. Sow fall greens in the freed-up space.");
    chores.push("Plant garlic cloves point-up, 2\" deep, 6\" apart. Mulch heavily — they'll root in fall and burst out next April.");
    chores.push("Save tomato seeds from your best heirlooms — ferment in water 3 days, rinse, dry on a paper plate.");
  } else if (month === 10) {
    banner = "🍂"; headline = "Fall Wind-Down"; sub = "Last harvests, garlic in, beds put to bed.";
    plantNow = ["Garlic (until ground freezes)","Cover crops (cereal rye, crimson clover)"];

    chores.push("Clean & oil tools, sharpen pruners. Empty terra cotta pots so they don't crack.");
  }
  return { banner, headline, sub, plantNow, chores, warnings };
}

// ZONE 6b WEEKLY PLANTING CALENDAR — Clinton, MO (USDA Zone 6b)
//   • Average last spring frost:  ~April 15–20
//   • Average first fall frost:   ~October 15–20
//   • Frost-free growing season:  ~180 days
// Keyed off ISO week so the same week returns the same guidance year-over-year.
// Each phase covers a band of weeks and returns direct-sow / transplant /
// indoor-start chips plus tips tailored to four crop focuses: tomatoes & peppers,
// sweet corn & beans, cool-season greens, and perennials/fruit.
// ══════════════════════════════════════════════════════════════════════════════

function isoWeekNumber(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayN = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - dayN + 3);
  const week1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - week1) / 86400000 - 3 + ((week1.getUTCDay() + 6) % 7)) / 7);
}

function getWeeklyPlanner(weather, dateObj) {
  const d = dateObj || new Date();
  const week = isoWeekNumber(d);
  const phase = PLANTING_PHASES.find(p => p.weeks.includes(week)) || PLANTING_PHASES[PLANTING_PHASES.length - 1];
  const c = weather && weather.current ? weather.current : {};
  const tempNow = isFinite(c.temperature_2m) ? c.temperature_2m : null;
  const month = d.getMonth() + 1;
  const weatherWarnings = [];
  if (tempNow !== null) {
    if (tempNow >= 95) weatherWarnings.push("Extreme heat ("+Math.round(tempNow)+"°F) — water deeply at dawn. Tomato pollen sterilizes above 90°F; expect a fruit-set pause.");
    else if (tempNow >= 90 && (month >= 6 && month <= 8)) weatherWarnings.push("Heat above 90°F slows fruit set on tomatoes. Mulch deeply, water early, hold off on fertilizer.");
    else if (tempNow < 33 && (month >= 3 && month <= 5)) weatherWarnings.push("Hard freeze tonight ("+Math.round(tempNow)+"°F). Cover any tender transplants. Uncover by 9 AM.");
    else if (tempNow < 36 && (month >= 9 && month <= 10)) weatherWarnings.push("Frost likely tonight ("+Math.round(tempNow)+"°F). Pick remaining tomatoes/peppers; cover tender herbs.");
    else if (tempNow < 40 && month === 5 && d.getDate() < 15) weatherWarnings.push("Cool night ("+Math.round(tempNow)+"°F) — peppers and sweet potatoes sulk below 55°F. Wait a few days to transplant if you can.");
  }
  return Object.assign({}, phase, { week, weatherWarnings });
}

// MISSOURI WEEKLY MARKET SUMMARY
// Data is stored in Cloudflare KV via /weeklyupload (POST, PIN-gated) so ALL
// devices and users see the same numbers — no localStorage, no per-device drift.
// Matt uploads the MDA weekly PDF each Monday; friends on iOS/Android auto-see it.
// ──────────────────────────────────────────────────────────────────────────────

let _weeklyRecords = null; // module-level cache so we don't re-fetch on re-render

async function fetchWeeklyData() {
  if (_weeklyRecords !== null) return _weeklyRecords;
  try {
    const res = await fetch(CF_WORKER.replace(/\/$/, "") + "/weeklydata?limit=300");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    _weeklyRecords = Array.isArray(data.records) ? data.records : [];
  } catch (e) {
    console.warn("[weekly] fetch failed:", e);
    _weeklyRecords = [];
  }
  return _weeklyRecords;
}

function weeklyFmt(v, dec) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  return Number(v).toFixed(dec !== undefined ? dec : 2);
}

function weeklyBuildChart(records, seriesConfig, chartH) {
  // seriesConfig = [{ key, color, label }]
  // Returns SVG string for a multi-line chart with date x-axis ticks
  if (!records || records.length < 2) {
    return '<div class="weekly-chart-empty">Upload a few weekly PDFs to start building your multi-year price chart.</div>';
  }
  const W = 600, H = chartH || 160;
  const padL = 44, padR = 10, padT = 12, padB = 28;
  const cW = W - padL - padR, cH = H - padT - padB;

  // Collect all values across all series to compute shared y scale
  let allVals = [];
  seriesConfig.forEach(s => {
    records.forEach(r => { const v = r[s.key]; if (v !== null && isFinite(v)) allVals.push(v); });
  });
  if (!allVals.length) return '<div class="weekly-chart-empty">No numeric data to plot yet.</div>';
  const minV = Math.min.apply(null, allVals);
  const maxV = Math.max.apply(null, allVals);
  const span = (maxV - minV) || 1;
  // Add 8% padding top/bottom
  const lo = minV - span * 0.08, hi = maxV + span * 0.08, rng = hi - lo;

  const xOf = (i) => padL + i * cW / Math.max(records.length - 1, 1);
  const yOf = (v) => padT + cH * (1 - (v - lo) / rng);

  // Y grid lines (4 ticks)
  const ticks = 4;
  let gridSvg = "", yLabelSvg = "";
  for (let t = 0; t <= ticks; t++) {
    const v = lo + rng * (t / ticks);
    const y = yOf(v);
    gridSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>`;
    yLabelSvg += `<text x="${(padL - 4).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-soft)">${v >= 1000 ? (v/100).toFixed(0)+"h" : v.toFixed(0)}</text>`;
  }

  // X axis date ticks — show up to 6
  let xTickSvg = "";
  const tickCount = Math.min(6, records.length);
  const step = Math.max(1, Math.round(records.length / tickCount));
  for (let i = 0; i < records.length; i += step) {
    const r = records[i];
    const x = xOf(i);
    const d = r.report_date ? r.report_date.slice(5) : ""; // MM-DD
    xTickSvg += `<text x="${x.toFixed(1)}" y="${(H - 6).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="var(--text-soft)">${d}</text>`;
    xTickSvg += `<line x1="${x.toFixed(1)}" y1="${(H - padB).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(H - padB + 3).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
  }

  // Series lines + dots
  let linesSvg = "";
  seriesConfig.forEach(s => {
    const pts = records.map((r, i) => ({ x: xOf(i), y: r[s.key] !== null && isFinite(r[s.key]) ? yOf(r[s.key]) : null }));
    let d = ""; let first = true;
    pts.forEach(p => {
      if (p.y === null) { first = true; return; }
      d += (first ? "M" : "L") + p.x.toFixed(1) + " " + p.y.toFixed(1) + " ";
      first = false;
    });
    if (d) linesSvg += `<path d="${d.trim()}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>`;
    // Dots only if ≤20 records (gets crowded otherwise)
    if (records.length <= 20) {
      pts.forEach(p => {
        if (p.y !== null) linesSvg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.8" fill="${s.color}" opacity="0.85"/>`;
      });
    }
  });

  // Most-recent value callouts
  let calloutSvg = "";
  seriesConfig.forEach(s => {
    for (let i = records.length - 1; i >= 0; i--) {
      const v = records[i][s.key];
      if (v !== null && isFinite(v)) {
        const x = xOf(i), y = yOf(v);
        calloutSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${s.color}" stroke="var(--bg)" stroke-width="2"/>`;
        break;
      }
    }
  });

  return `<svg class="weekly-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${gridSvg}${yLabelSvg}${xTickSvg}${linesSvg}${calloutSvg}</svg>`;
}

function wireWeeklyMarket() {
  const card = document.getElementById("weeklyMarketCard");
  if (!card) return;
  const uploadBtn = card.querySelector("#weeklyUploadBtn");
  if (!uploadBtn) return;

  uploadBtn.addEventListener("click", () => {
    // Build modal
    const backdrop = document.createElement("div");
    backdrop.className = "weekly-modal-backdrop";
    backdrop.innerHTML = `<div class="weekly-modal">
      <div class="weekly-modal-title">📤 Upload Weekly PDF</div>
      <div class="weekly-modal-sub">Upload the Missouri MDA Weekly Market Summary PDF. Claude will extract prices and make them visible to all users instantly.</div>
      <label>Upload PIN</label>
      <input type="password" id="wUploadPin" placeholder="Enter your admin PIN" autocomplete="off">
      <label>PDF File</label>
      <div class="weekly-modal-file-area" id="wFileArea">Tap to select the weekly PDF<br><small style="opacity:.6">Missouri MDA Weekly Market Summary</small></div>
      <input type="file" id="wFileInput" accept="application/pdf" style="display:none">
      <div class="weekly-modal-result" id="wUploadResult" style="display:none"></div>
      <div class="weekly-modal-actions">
        <button class="weekly-modal-cancel" id="wCancelBtn">Cancel</button>
        <button class="weekly-modal-submit" id="wSubmitBtn" disabled>Upload &amp; Parse</button>
      </div>
    </div>`;
    document.body.appendChild(backdrop);

    const pinInput    = backdrop.querySelector("#wUploadPin");
    const fileArea    = backdrop.querySelector("#wFileArea");
    const fileInput   = backdrop.querySelector("#wFileInput");
    const submitBtn   = backdrop.querySelector("#wSubmitBtn");
    const cancelBtn   = backdrop.querySelector("#wCancelBtn");
    const resultEl    = backdrop.querySelector("#wUploadResult");
    let selectedFile  = null;

    const checkReady = () => { submitBtn.disabled = !(selectedFile && pinInput.value.trim()); };
    pinInput.addEventListener("input", checkReady);

    fileArea.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", e => {
      selectedFile = e.target.files && e.target.files[0];
      if (selectedFile) {
        fileArea.textContent = "✓ " + selectedFile.name + " (" + (selectedFile.size / 1024).toFixed(0) + " KB)";
        fileArea.classList.add("has-file");
      }
      checkReady();
    });

    const close = () => document.body.removeChild(backdrop);
    cancelBtn.addEventListener("click", close);
    backdrop.addEventListener("click", e => { if (e.target === backdrop) close(); });

    submitBtn.addEventListener("click", async () => {
      if (!selectedFile || !pinInput.value.trim()) return;
      if (selectedFile.size > 25 * 1024 * 1024) {
        resultEl.style.display = "block";
        resultEl.className = "weekly-modal-result error";
        resultEl.innerHTML = "⚠ File too large (max 25 MB). Please use a smaller PDF.";
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ Uploading…";
      resultEl.style.display = "block";
      resultEl.className = "weekly-modal-result";
      resultEl.innerHTML = '<span style="color:var(--text-muted)">Sending PDF to Claude for parsing… this takes 10-20 seconds.</span>';

      try {
        // Read PDF → base64
        const base64 = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => { const s = r.result || ""; const i = s.indexOf(","); resolve(i >= 0 ? s.slice(i+1) : s); };
          r.onerror = () => reject(new Error("FileReader failed"));
          r.readAsDataURL(selectedFile);
        });

        const res = await fetch(CF_WORKER.replace(/\/$/, "") + "/weeklyupload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pdf_base64: base64, upload_pin: pinInput.value.trim() })
        });
        const ct = res.headers.get("content-type") || "";
        let data;
        if (ct.includes("application/json")) data = await res.json();
        else { const t = await res.text(); throw new Error("Worker returned non-JSON: " + t.slice(0, 100)); }

        if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));

        resultEl.className = "weekly-modal-result success";
        resultEl.innerHTML = `✅ Saved week of <strong>${escapeHtml(data.date)}</strong>! Stocker formula: <strong>$${weeklyFmt(data.data && data.data.stocker_formula_cwt)}/cwt</strong>. Refreshing…`;

        // Invalidate cache and re-render the card
        _weeklyRecords = null;
        setTimeout(async () => {
          const fresh = await fetchWeeklyData();
          const newHtml = renderWeeklyMarketCard(fresh);
          const tmp = document.createElement("div"); tmp.innerHTML = newHtml;
          card.replaceWith(tmp.firstElementChild);
          wireWeeklyMarket();
          close();
        }, 1800);

      } catch (err) {
        resultEl.className = "weekly-modal-result error";
        resultEl.innerHTML = "⚠ Upload failed: " + escapeHtml(String(err.message || err));
        submitBtn.disabled = false;
        submitBtn.textContent = "Upload & Parse";
      }
    });
  });
}

// ──────────────────────────────────────────────────────────────────────────────
// CATTLE MARKET — Wheeler Livestock (Osceola, MO — Matt's buddy's barn)
// Auto-fetches latest sale via Cloudflare Worker /cattleprice (Claude vision OCR
// of Wheeler's scanned market report). Builds a 1-year price chart in
// localStorage as fetches accumulate. Other MO barns dropped 2026-05 per user.
// ──────────────────────────────────────────────────────────────────────────────
const CATTLE_BARNS = [
  { id:"wheeler", name:"Wheeler Livestock", location:"Osceola, MO · St. Clair Co.", isBuddy:true, reportUrl:"https://www.wheelerlivestock.com/market-report-1", saleDay:"Tuesdays" }
];

const CATTLE_HISTORY_KEY = "news.cattle.history.v1";
const CATTLE_HISTORY_DAYS = 365;

function loadCattleHistory() {
  try { const raw = localStorage.getItem(CATTLE_HISTORY_KEY); if (!raw) return {}; return JSON.parse(raw) || {}; } catch { return {}; }
}
function saveCattleHistory(h) { try { localStorage.setItem(CATTLE_HISTORY_KEY, JSON.stringify(h)); } catch {} }

// Pull cattle history from KV (same backing store as Missouri weekly report) and
// merge into localStorage so every browser sees every entry — not just the one
// that tapped "Auto-Fetch".  Called once per page load (non-blocking).
let _cattleKvSynced = false;
async function syncCattleHistoryFromKV() {
  if (_cattleKvSynced) return;
  _cattleKvSynced = true;
  try {
    const res = await fetch(CF_WORKER.replace(/\/$/, "") + "/cattlehistory");
    if (!res.ok) return;
    const data = await res.json();
    if (!data.history) return;
    const local = loadCattleHistory();
    let changed = false;
    for (const [barn, entries] of Object.entries(data.history)) {
      if (!Array.isArray(entries)) continue;
      if (!local[barn]) local[barn] = [];
      for (const e of entries) {
        const day = e.date, price = parseFloat(e.price);
        if (!day || !isFinite(price) || price <= 0) continue;
        if (!local[barn].some(x => x.d === day)) {
          local[barn].push({ d: day, p: price });
          changed = true;
        }
      }
      if (changed) {
        local[barn].sort((a, b) => a.d.localeCompare(b.d));
        const cutoff = new Date(Date.now() - CATTLE_HISTORY_DAYS * 86400000).toISOString().slice(0, 10);
        local[barn] = local[barn].filter(e => e.d >= cutoff);
      }
    }
    if (changed) {
      saveCattleHistory(local);
      // Re-render the cattle card with the merged data
      const card = document.querySelector(".outdoor-card.cattle");
      if (card) {
        const tmp = document.createElement("div"); tmp.innerHTML = renderCattleMarketCard();
        card.replaceWith(tmp.firstElementChild);
        wireCattleMarket();
      }
    }
  } catch (_) {}
}

function recordCattlePrice(barnId, dollarsPerCwt, dateStr, extraFields) {
  if (!barnId || !isFinite(dollarsPerCwt) || dollarsPerCwt <= 0) return;
  const hist = loadCattleHistory();
  const arr  = hist[barnId] || [];
  const day  = dateStr || new Date().toISOString().slice(0,10);
  const i = arr.findIndex(e => e.d === day);
  if (i >= 0) arr[i] = { d:day, p:dollarsPerCwt }; else arr.push({ d:day, p:dollarsPerCwt });
  arr.sort((a,b) => a.d.localeCompare(b.d));
  const cutoff = new Date(Date.now() - CATTLE_HISTORY_DAYS*86400000).toISOString().slice(0,10);
  hist[barnId] = arr.filter(e => e.d >= cutoff);
  saveCattleHistory(hist);
  // Push to KV in background so all browsers see it (best-effort, non-blocking)
  const kvBody = Object.assign({ barn: barnId, price: dollarsPerCwt, date: day }, extraFields || {});
  fetch(CF_WORKER.replace(/\/$/, "") + "/cattlerecord", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(kvBody)
  }).catch(() => {});
  return hist[barnId];
}

function renderCattleSparkline(series) {
  if (!series || series.length < 2) return "";
  const w = 200, h = 32, pad = 2;
  const ps = series.map(e => e.p);
  const min = Math.min.apply(null, ps), max = Math.max.apply(null, ps);
  const span = (max - min) || 1;
  const xs = (i) => pad + i * (w - 2*pad) / (series.length - 1);
  const ys = (v) => pad + (h - 2*pad) * (1 - (v - min)/span);
  const d = series.map((e,i) => (i===0?"M":"L") + xs(i).toFixed(1) + " " + ys(e.p).toFixed(1)).join(" ");
  const last = series[series.length-1].p, first = series[0].p;
  const color = last >= first ? "#15803d" : "#b91c1c";
  return '<svg class="cattle-spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

// 1-year price chart — full SVG with month axis and $/cwt grid
function renderCattleYearChart(series) {
  const w = 380, h = 170, padL = 38, padR = 12, padT = 12, padB = 26;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const now = Date.now();
  const startMs = now - 365 * 86400000;

  const filtered = (series || []).filter(e => new Date(e.d).getTime() >= startMs);
  if (filtered.length === 0) {
    return '<div class="cattle-year-chart-wrap"><div class="cattle-chart-empty">No price history yet — tap <em>✦ Auto-Fetch Wheeler</em> to record this week\'s sale. The 1-year chart fills in as new sales post.</div></div>';
  }

  const sorted = filtered.slice().sort((a,b) => a.d.localeCompare(b.d));
  const ps = sorted.map(e => e.p);
  let minP = Math.min.apply(null, ps);
  let maxP = Math.max.apply(null, ps);
  const range = (maxP - minP) || 1;
  // Round axis bounds to nearest $5 with padding so the line never hugs the edges
  const padVal = Math.max(5, range * 0.18);
  minP = Math.floor((minP - padVal) / 5) * 5;
  maxP = Math.ceil((maxP + padVal) / 5) * 5;
  if (maxP - minP < 10) maxP = minP + 10;

  const xOf = (dStr) => padL + ((new Date(dStr).getTime() - startMs) / (now - startMs)) * innerW;
  const yOf = (p) => padT + (1 - (p - minP) / (maxP - minP)) * innerH;

  // Y-axis grid + labels (5 lines)
  let yGrid = '';
  for (let i = 0; i <= 4; i++) {
    const v = minP + (maxP - minP) * i / 4;
    const yy = yOf(v).toFixed(1);
    yGrid += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w - padR) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.55"/>';
    yGrid += '<text x="' + (padL - 5) + '" y="' + (parseFloat(yy) + 3.2).toFixed(1) + '" text-anchor="end" fill="var(--text-muted)" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">$' + Math.round(v) + '</text>';
  }

  // X-axis month labels — every 2 months
  let xLabels = '';
  const monthFmt = new Intl.DateTimeFormat('en-US', { month: 'short' });
  for (let i = 0; i <= 12; i += 2) {
    const t = startMs + (now - startMs) * i / 12;
    const xx = (padL + (i / 12) * innerW).toFixed(1);
    xLabels += '<text x="' + xx + '" y="' + (h - padB + 14) + '" text-anchor="middle" fill="var(--text-muted)" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + monthFmt.format(new Date(t)) + '</text>';
  }

  const last = sorted[sorted.length - 1];
  const first = sorted[0];
  const trend = last.p >= first.p ? "#15803d" : "#b91c1c";

  // Path + dots
  const pathD = sorted.map((e, i) => (i === 0 ? 'M' : 'L') + xOf(e.d).toFixed(1) + ' ' + yOf(e.p).toFixed(1)).join(' ');
  const dots = sorted.map(e => '<circle cx="' + xOf(e.d).toFixed(1) + '" cy="' + yOf(e.p).toFixed(1) + '" r="2.2" fill="' + trend + '"><title>' + e.d + ': $' + e.p.toFixed(2) + '/cwt</title></circle>').join('');

  // Highlight latest with bigger dot
  const latestX = xOf(last.d).toFixed(1);
  const latestY = yOf(last.p).toFixed(1);
  const latestDot = '<circle cx="' + latestX + '" cy="' + latestY + '" r="4" fill="' + trend + '" stroke="var(--bg)" stroke-width="1.6"/>';

  const high = Math.max.apply(null, ps);
  const low  = Math.min.apply(null, ps);
  const headerStats = '<div class="cattle-year-chart-stats">' +
    sorted.length + ' sale' + (sorted.length === 1 ? '' : 's') + ' · ' +
    'high <strong>$' + high.toFixed(2) + '</strong> · low <strong>$' + low.toFixed(2) + '</strong> · latest <strong>$' + last.p.toFixed(2) + '</strong>' +
  '</div>';

  return '<div class="cattle-year-chart-wrap">' +
    '<div class="cattle-year-chart-header"><div class="cattle-year-chart-title">📈 1-Year Price History · $/cwt</div>' + headerStats + '</div>' +
    '<svg class="cattle-year-chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Wheeler Livestock 1-year price chart">' +
      yGrid + xLabels +
      '<path d="' + pathD + '" fill="none" stroke="' + trend + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + latestDot +
    '</svg>' +
  '</div>';
}
function fmtCwt(v) { return isFinite(v) ? "$" + v.toFixed(2) : ""; }
function pctDelta(latest, prev) { if (!isFinite(latest) || !isFinite(prev) || prev <= 0) return null; return ((latest - prev) / prev) * 100; }
function fmtDelta(d) { if (d === null) return "—"; return (d >= 0 ? "+" : "") + d.toFixed(1) + "%"; }
function deltaCls(d) { if (d === null || Math.abs(d) < 0.05) return "flat"; return d > 0 ? "up" : "down"; }

function renderBarnTile(barn, history) {
  const series = history && history.length ? history : [];
  const latest = series.length ? series[series.length - 1] : null;
  let prevWeek = null;
  if (latest) {
    const target = new Date(latest.d); target.setDate(target.getDate() - 7);
    const cutoff = target.toISOString().slice(0,10);
    for (let i = series.length - 2; i >= 0; i--) { if (series[i].d <= cutoff) { prevWeek = series[i]; break; } }
    if (!prevWeek && series.length > 1) prevWeek = series[0];
  }
  const delta = (latest && prevWeek && prevWeek !== latest) ? pctDelta(latest.p, prevWeek.p) : null;
  const priceHtml = latest ? '<div class="barn-price">' + fmtCwt(latest.p) + '<span class="unit">/cwt</span></div>' : '<div class="barn-price placeholder">No price logged yet</div>';
  const deltaHtml = (latest && delta !== null) ? '<span class="barn-delta ' + deltaCls(delta) + '">' + fmtDelta(delta) + ' wk</span>' : '';
  const dateHtml = latest ? '<span>' + new Date(latest.d).toLocaleDateString("en-US",{month:"short",day:"numeric"}) + '</span>' : '<span style="opacity:.6">tap auto-fetch to start tracking</span>';
  const buddyTag = barn.isBuddy ? '<span class="barn-buddy-tag">🤝 buddy\'s barn</span>' : '';
  return '<div class="barn-tile' + (barn.isBuddy ? ' buddy' : '') + '" data-barn="' + barn.id + '">' +
    '<div class="barn-name">' + escapeHtml(barn.name) + buddyTag + '</div>' +
    '<div class="barn-loc">' + escapeHtml(barn.location) + ' · ' + escapeHtml(barn.saleDay) + '</div>' +
    priceHtml +
    '<div class="barn-meta">' + dateHtml + ' ' + deltaHtml + '</div>' +

async function fetchWheelerLatestImage() {
  const wheelerUrl = "https://www.wheelerlivestock.com/market-report-1";
  const proxyUrl = CF_WORKER + "?url=" + encodeURIComponent(wheelerUrl);
  try {
    const res = await fetch(proxyUrl, { method:"GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const html = await res.text();
    const re  = /https:\/\/static\.wixstatic\.com\/media\/[^"'\s)]+market[^"'\s)]*\.(jpe?g|png)/ig;
    let matches = Array.from(new Set(html.match(re) || []));
    if (matches.length === 0) {
      const re2 = /https:\/\/static\.wixstatic\.com\/media\/[^"'\s)]+\.(jpe?g|png)/ig;
      matches = Array.from(new Set(html.match(re2) || [])).slice(0, 2);
    } else {
      matches = matches.slice(0, 4);
    }
    // Wix has hotlink protection — route through wsrv.nl image proxy so the <img> can load
    return matches.map(u => "https://wsrv.nl/?url=" + encodeURIComponent(u.replace(/^https?:\/\//, "")) + "&output=jpg&q=85");
  } catch (e) { return null; }
}

function wireCattleMarket() {
  const card = document.querySelector(".outdoor-card.cattle");
  if (!card) return;
  card.querySelectorAll("[data-log]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.preventDefault();
      const barnId = btn.getAttribute("data-log");
      const barn   = CATTLE_BARNS.find(b => b.id === barnId);
      if (!barn) return;
      const input = window.prompt("Today's average $/cwt for 500–550 lb feeder steers at " + barn.name + ":\n(numbers only — e.g. 312.50)", "");
      if (input === null) return;
      const val = parseFloat(String(input).replace(/[^0-9.\-]/g, ""));
      if (!isFinite(val) || val <= 0 || val > 1000) { alert("Please enter a valid $/cwt number between 1 and 1000."); return; }
      recordCattlePrice(barnId, val);
      const newHtml = renderCattleMarketCard();
      const tmp = document.createElement("div"); tmp.innerHTML = newHtml;
      card.replaceWith(tmp.firstElementChild);
      wireCattleMarket();
    });
  });
  // ── Auto-fetch via worker /cattleprice (Claude vision OCR of Wheeler's scanned report)
  const autoBtn = card.querySelector("#cattleAutoFetch");
  const autoResult = card.querySelector("#cattleAutoResult");
  if (autoBtn && autoResult) {
    autoBtn.addEventListener("click", async () => {
      if (autoBtn.classList.contains("is-loading")) return;
      autoBtn.classList.add("is-loading");
      const origHtml = autoBtn.innerHTML;
      autoBtn.innerHTML = '<span class="spinner"></span> Reading top dollar from Wheeler\'s report…';
      autoResult.style.display = "block";
      autoResult.className = "cattle-fetch-result";
      autoResult.innerHTML = '<div class="cattle-fetch-loading"><span class="spinner"></span> Fetching latest Wheeler report &amp; running Claude vision OCR…</div>';
      try {
        const res = await fetch(CF_WORKER.replace(/\/$/, "") + "/cattleprice?barn=wheeler", { method:"GET" });
        const ct  = res.headers.get("content-type") || "";
        let data;
        if (ct.includes("application/json")) {
          data = await res.json();
        } else {
          const txt = await res.text();
          throw new Error("Worker isn't returning JSON — got: \"" + txt.slice(0,80).trim() + "\". The /cattleprice endpoint may not be deployed yet — push worker.js to Cloudflare and try again.");
        }
        if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
        // We track TOP DOLLAR (high_cwt). Some weeks Claude returns only avg_cwt
        // if a single price is shown — fall back to that.
        const topPrice = isFinite(data.high_cwt) && data.high_cwt > 0 ? +data.high_cwt
                       : (isFinite(data.avg_cwt) && data.avg_cwt > 0 ? +data.avg_cwt : NaN);
        if (!isFinite(topPrice) || topPrice <= 0) throw new Error("Couldn't read a feeder steer price from this report");
        recordCattlePrice("wheeler", topPrice, data.sale_date, {
          weight_class: data.weight_class, head_count: data.head_count,
          avg_cwt: data.avg_cwt, low_cwt: data.low_cwt, high_cwt: data.high_cwt,
          frame_grade: data.frame_grade, notes: data.notes, fetched_via: data.fetched_via
        });
        // Build success message before re-render so we can stash it
        const detail = '✓ Logged top dollar <strong>$' + topPrice.toFixed(2) + '/cwt</strong>' +
          ' for sale on <strong>' + escapeHtml(data.sale_date || 'today') + '</strong>' +
          (data.weight_class ? ' · ' + escapeHtml(data.weight_class) : '') +
          (data.head_count ? ' · ' + data.head_count + ' head' : '') +
          (isFinite(data.low_cwt) && isFinite(data.high_cwt) && data.low_cwt !== data.high_cwt ? ' · range $' + (+data.low_cwt).toFixed(2) + '–$' + (+data.high_cwt).toFixed(2) : '') +
          (data.notes ? '<div style="margin-top:4px;font-size:11.5px;color:var(--text-muted)">' + escapeHtml(data.notes) + '</div>' : '') +
          (data.fetched_via ? '<div style="margin-top:2px;font-size:10.5px;opacity:.55">image fetched via ' + escapeHtml(data.fetched_via) + '</div>' : '') +
          (data.cached ? '<div style="margin-top:4px;font-size:10.5px;opacity:.65">cached · won\'t re-bill until tomorrow</div>' : '');
        // Re-render the whole card (refreshes price, delta, chart)
        const newHtml = renderCattleMarketCard();
        const tmp = document.createElement("div"); tmp.innerHTML = newHtml;
        card.replaceWith(tmp.firstElementChild);
        wireCattleMarket();
        const newCard = document.querySelector(".outdoor-card.cattle");
        const newResult = newCard && newCard.querySelector("#cattleAutoResult");
        if (newResult) {
          newResult.style.display = "block";
          newResult.className = "cattle-fetch-result cattle-fetch-success";
          newResult.innerHTML = detail;
        }
      } catch (err) {
        autoResult.className = "cattle-fetch-result cattle-fetch-error";
        autoResult.innerHTML = '⚠ Auto-fetch failed: ' + escapeHtml(String(err.message || err)) +
          '. <a class="barn-link" href="https://www.wheelerlivestock.com/market-report-1" target="_blank" rel="noopener">Open report ↗</a>' +
          ' — or tap <em>📤 Upload Wheeler Image</em> to send the image directly.';
        autoBtn.classList.remove("is-loading");
        autoBtn.innerHTML = origHtml;
      }
    });
  }
  // ── Manual upload: user saves Wheeler image locally then picks file ──
  const manualBtn  = card.querySelector("#cattleManualUpload");
  const manualFile = card.querySelector("#cattleManualFile");
  if (manualBtn && manualFile && autoResult) {
    manualBtn.addEventListener("click", () => manualFile.click());
    manualFile.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) {
        autoResult.style.display = "block";
        autoResult.className = "cattle-fetch-result cattle-fetch-error";
        autoResult.innerHTML = "⚠ Image too large (>8MB). Try a smaller version.";
        return;
      }
      const origHtml = manualBtn.innerHTML;
      manualBtn.classList.add("is-loading");
      manualBtn.innerHTML = '<span class="spinner"></span> Reading uploaded image…';
      autoResult.style.display = "block";
      autoResult.className = "cattle-fetch-result";
      autoResult.innerHTML = '<div class="cattle-fetch-loading"><span class="spinner"></span> Sending to Claude vision…</div>';
      try {
        // Read file → base64 (without data URL prefix)
        const base64 = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => {
            const s = r.result || "";
            const i = s.indexOf(",");
            resolve(i >= 0 ? s.slice(i + 1) : s);
          };
          r.onerror = () => reject(new Error("FileReader failed"));
          r.readAsDataURL(file);
        });
        const res = await fetch(CF_WORKER.replace(/\/$/, "") + "/cattlemanual", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image_base64: base64, media_type: file.type || "image/jpeg" })
        });
        const ct = res.headers.get("content-type") || "";
        let data;
        if (ct.includes("application/json")) data = await res.json();
        else { const txt = await res.text(); throw new Error("Worker returned non-JSON: " + txt.slice(0, 80)); }
        if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
        const topPrice = isFinite(data.high_cwt) && data.high_cwt > 0 ? +data.high_cwt
                       : (isFinite(data.avg_cwt) && data.avg_cwt > 0 ? +data.avg_cwt : NaN);
        if (!isFinite(topPrice) || topPrice <= 0) throw new Error("Couldn't read a price from this image");
        recordCattlePrice("wheeler", topPrice, data.sale_date, {
          weight_class: data.weight_class, head_count: data.head_count,
          avg_cwt: data.avg_cwt, low_cwt: data.low_cwt, high_cwt: data.high_cwt,
          frame_grade: data.frame_grade, notes: data.notes, fetched_via: "manual-upload"
        });
        const detail = '✓ Logged top dollar <strong>$' + topPrice.toFixed(2) + '/cwt</strong>' +
          ' for sale on <strong>' + escapeHtml(data.sale_date || 'today') + '</strong>' +
          (data.weight_class ? ' · ' + escapeHtml(data.weight_class) : '') +
          (data.head_count ? ' · ' + data.head_count + ' head' : '') +
          (isFinite(data.low_cwt) && isFinite(data.high_cwt) && data.low_cwt !== data.high_cwt ? ' · range $' + (+data.low_cwt).toFixed(2) + '–$' + (+data.high_cwt).toFixed(2) : '') +
          (data.notes ? '<div style="margin-top:4px;font-size:11.5px;color:var(--text-muted)">' + escapeHtml(data.notes) + '</div>' : '') +
          '<div style="margin-top:2px;font-size:10.5px;opacity:.55">via manual upload</div>';
        const newHtml = renderCattleMarketCard();
        const tmp = document.createElement("div"); tmp.innerHTML = newHtml;
        card.replaceWith(tmp.firstElementChild);
        wireCattleMarket();
        const newCard = document.querySelector(".outdoor-card.cattle");
        const newResult = newCard && newCard.querySelector("#cattleAutoResult");
        if (newResult) {
          newResult.style.display = "block";
          newResult.className = "cattle-fetch-result cattle-fetch-success";
          newResult.innerHTML = detail;
        }
      } catch (err) {
        autoResult.className = "cattle-fetch-result cattle-fetch-error";
        autoResult.innerHTML = '⚠ Manual upload failed: ' + escapeHtml(String(err.message || err));
        manualBtn.classList.remove("is-loading");
        manualBtn.innerHTML = origHtml;
      }
      manualFile.value = ""; // allow re-uploading the same file
    });
  }
  const wheelerBtn = card.querySelector("#cattleViewWheeler");
  const embed      = card.querySelector("#wheelerEmbed");
  if (wheelerBtn && embed) {
    wheelerBtn.addEventListener("click", async () => {
      if (embed.style.display !== "none") { embed.style.display = "none"; embed.innerHTML = ""; return; }
      embed.style.display = "block";
      embed.innerHTML = '<div class="wheeler-embed-loading"><span class="spinner"></span> Fetching Wheeler\'s latest market report…</div>';
      const imgs = await fetchWheelerLatestImage();
      if (!imgs || imgs.length === 0) {
        embed.innerHTML = '<div class="wheeler-embed-loading">Could not pull the report automatically. <a class="barn-link" href="https://www.wheelerlivestock.com/market-report-1" target="_blank" rel="noopener">Open on wheelerlivestock.com ↗</a></div>';
        return;
      }
      embed.innerHTML = imgs.map(src => '<img src="' + escapeHtml(src) + '" alt="Wheeler Livestock Market Report" loading="lazy">').join("") +
        '<div class="cattle-history-note" style="margin-top:8px">Read off the 500–550 lb steer average and tap <em>+ Log $/cwt</em> on the Wheeler tile above to add it to your history.</div>';
    });
  }
}


function renderLakeHistoryChart(history) {
  if (!history || history.length < 2) return "";
  // Build a compact SVG sparkline of pool elevation over time
  const pts = history.filter(r => Number.isFinite(r.elevation));
  if (pts.length < 2) return "";

  const W = 460, H = 72, PAD = { l: 38, r: 8, t: 8, b: 22 };
  const innerW = W - PAD.l - PAD.r;
  const innerH = H - PAD.t - PAD.b;

  const elevs = pts.map(p => p.elevation);
  let minE = Math.min(...elevs), maxE = Math.max(...elevs);
  const span = maxE - minE;
  // Add a bit of padding so the line isn't flush with top/bottom
  minE -= span * 0.15 + 0.1;
  maxE += span * 0.15 + 0.1;
  const scaleX = i => PAD.l + (i / (pts.length - 1)) * innerW;
  const scaleY = e => PAD.t + innerH - ((e - minE) / (maxE - minE)) * innerH;

  // Polyline points
  const polyline = pts.map((p, i) => `${scaleX(i).toFixed(1)},${scaleY(p.elevation).toFixed(1)}`).join(" ");

  // Fill path (closed area under the line)
  const fillPath = `M${scaleX(0).toFixed(1)},${(PAD.t + innerH).toFixed(1)} ` +
    pts.map((p, i) => `L${scaleX(i).toFixed(1)},${scaleY(p.elevation).toFixed(1)}`).join(" ") +
    ` L${scaleX(pts.length - 1).toFixed(1)},${(PAD.t + innerH).toFixed(1)} Z`;

  // Y axis ticks — 3 evenly spaced
  const yTicks = [minE + (maxE - minE) * 0.1, minE + (maxE - minE) * 0.5, minE + (maxE - minE) * 0.9];
  const yTickHtml = yTicks.map(e => {
    const y = scaleY(e);
    return `<text x="${PAD.l - 4}" y="${y.toFixed(1)}" fill="var(--text-soft)" font-size="8" text-anchor="end" dominant-baseline="middle">${e.toFixed(0)}</text>
<line x1="${PAD.l}" y1="${y.toFixed(1)}" x2="${W - PAD.r}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2,3"/>`;
  }).join("");

  // X axis labels — first, middle, last dates
  const dateFmt = s => { const d = new Date(s + "T12:00:00"); return d.toLocaleDateString("en-US", {month:"short", day:"numeric"}); };
  const xLabelHtml = [0, Math.floor((pts.length-1)/2), pts.length-1].map(i => {
    const x = scaleX(i);
    return `<text x="${x.toFixed(1)}" y="${(H - 5).toFixed(1)}" fill="var(--text-soft)" font-size="8" text-anchor="middle">${dateFmt(pts[i].date)}</text>`;
  }).join("");

  // Highlight the last point
  const lastX = scaleX(pts.length - 1);
  const lastY = scaleY(pts[pts.length - 1].elevation);

  // Trend summary text
  const first = pts[0], last = pts[pts.length - 1];
  const totalChange = last.elevation - first.elevation;
  const days = Math.round((new Date(last.date) - new Date(first.date)) / 86400000);
  const trendTxt = totalChange < -0.2
    ? `▼ ${Math.abs(totalChange).toFixed(1)} ft over ${days} days`
    : totalChange > 0.2
    ? `▲ +${totalChange.toFixed(1)} ft over ${days} days`
    : `— Stable ±${Math.abs(totalChange).toFixed(1)} ft over ${days} days`;
  const trendColor = totalChange < -0.2 ? "var(--accent-red,#e87)" : totalChange > 0.2 ? "var(--sage,#6a9)" : "var(--text-soft)";

  return `<div class="lake-history-chart">
  <div class="lake-history-label">📈 Pool Elevation History <span style="color:${trendColor};font-weight:600;margin-left:6px">${escapeHtml(trendTxt)}</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible;display:block" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    ${yTickHtml}
    <path d="${fillPath}" fill="url(#lakeGrad)"/>
    <polyline points="${polyline}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="var(--accent)" stroke="var(--bg)" stroke-width="1.5"/>
    ${xLabelHtml}
    <text x="${PAD.l - 4}" y="${PAD.t}" fill="var(--text-soft)" font-size="7" text-anchor="end">ft</text>
  </svg>
</div>`;
}
