// ── AI Smart Plan: POST today's conditions to the worker, show Claude's response ──
const FISHPLAN_ENDPOINT     = CF_WORKER.replace(/\/$/, "") + "/fishplan";
const LAKE_READING_ENDPOINT = CF_WORKER.replace(/\/$/, "") + "/lake-reading";
const LAKE_HISTORY_ENDPOINT = CF_WORKER.replace(/\/$/, "") + "/lake-history";
const FISHPLAN_CACHE_TTL_MS = 6 * 3600 * 1000; // 6h client-side cache too

function fishPlanCacheKey(lake, weather) {
  // Stable key from coarse-rounded conditions — small wobble shouldn't bust cache.
  const c = weather?.current || {};
  const snap = {
    e: lake?.stage    !== undefined && lake?.stage    !== null ? Math.round(lake.stage * 2) / 2 : null,
    d: lake?.dailyChange !== undefined && lake?.dailyChange !== null ? Math.round(lake.dailyChange * 4) / 4 : null,
    i: lake?.inflow   !== undefined && lake?.inflow   !== null ? Math.round((lake.inflow  || 0) / 1000) : null,
    o: lake?.outflow  !== undefined && lake?.outflow  !== null ? Math.round((lake.outflow || 0) / 1000) : null,
    t: isFinite(c.temperature_2m) ? Math.round(c.temperature_2m / 5) * 5 : null,
    w: isFinite(c.wind_direction_10m) ? compassFromDegrees(c.wind_direction_10m) : null,
    m: new Date().getMonth() + 1
  };
  return "news.fishplan." + briefHash(JSON.stringify(snap));
}
function getFishPlanCache(key) {
  try {
    const raw = localStorage.getItem(key); if (!raw) return null;
    const p = JSON.parse(raw);
    if (Date.now() - p.ts < FISHPLAN_CACHE_TTL_MS) return p.data;
  } catch {}
  return null;
}
function setFishPlanCache(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch {}
}

function paragraphifyPlan(text) {
  return text.split(/\n\s*\n/)
    .map(p => p.trim()).filter(Boolean)
    .map(p => '<p>' + escapeHtml(p) + '</p>').join("");
}

function renderFishSmartPanel(panel, plan, fromCache, onRefresh) {
  panel.classList.add("open");
  const meta = '<div class="fish-smart-meta">' +
    '<span>' + (fromCache ? "Cached · " : "") + (plan.model || "Claude") + '</span>' +
    '<button class="fish-smart-refresh" type="button">↻ Re-research</button>' +
  '</div>';
  panel.innerHTML =
    '<div class="fish-smart-header"><span class="spark">✦</span> AI SMART PLAN — TUNED FOR TODAY</div>' +
    '<div class="fish-smart-text">' + paragraphifyPlan(plan.plan || "") + '</div>' +
    meta;
  panel.querySelector(".fish-smart-refresh").addEventListener("click", () => onRefresh());
}

async function fetchAndShowSmartPlan(lake, weather, panel, btn, force, lakeHistory, waterTempF, targetDate) {
  const cacheKey = fishPlanCacheKey(lake, weather);
  if (!force) {
    const cached = getFishPlanCache(cacheKey);
    if (cached) {
      renderFishSmartPanel(panel, cached, true, () => fetchAndShowSmartPlan(lake, weather, panel, btn, true, lakeHistory, waterTempF, targetDate));
      return;
    }
  }
  panel.classList.add("open");
  const target = targetDate instanceof Date && isFinite(targetDate) ? targetDate : new Date();
  const isToday = target.toDateString() === new Date().toDateString();
  const targetLabel = target.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"}) +
    " at " + target.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
  panel.innerHTML =
    `<div class="fish-smart-header"><span class="spark">✦</span> AI SMART PLAN — ${escapeHtml(targetLabel.toUpperCase())}</div>` +
    '<div class="fish-smart-loading"><span class="spinner"></span>Claude is reading the conditions and writing a plan…</div>';
  btn.classList.add("is-loading");
  try {
    // Use forecast weather for the target time if not today
    const forecast = getForecastAtTime(target);
    const c = (isToday && !forecast) ? (weather?.current || {}) : {};
    const wx = forecast || {
      temp:     isFinite(c.temperature_2m)        ? c.temperature_2m        : null,
      feels:    isFinite(c.apparent_temperature)   ? c.apparent_temperature  : null,
      humidity: isFinite(c.relative_humidity_2m)  ? c.relative_humidity_2m  : null,
      windSpeed:isFinite(c.wind_speed_10m)         ? c.wind_speed_10m        : null,
      windDir:  isFinite(c.wind_direction_10m)     ? c.wind_direction_10m    : null,
      code:     c.weather_code ?? null
    };
    const sustained = (weather?.hourly && isFinite(wx.windDir))
      ? computeSustainedWindHours(weather.hourly, wx.windDir) : null;

    // Moon + solunar for target time
    const moonAtTarget = getMoonPhase(target);
    const solAtTarget  = getSolunarTimes(target);

    // Recent trip log entries (last 5)
    const tripLog = getTripLog().slice(-5).map(e =>
      `${e.date} ${e.timeOfDay||""}: ${(e.species||[]).join(", ")||"unspecified"} on ${(e.baits||[]).join(", ")||"unknown bait"}${e.spot?" at "+e.spot:""}${e.notes?" — "+e.notes:""}`.trim()
    );

    const payload = {
      targetDateTime: target.toISOString(),
      targetLabel,
      lake: {
        stage:       lake?.stage       ?? null,
        dailyChange: lake?.dailyChange ?? null,
        inflow:      lake?.inflow      ?? null,
        outflow:     lake?.outflow     ?? null,
        trend:       lake?.trend       || null
      },
      waterTempF: waterTempF ?? null,
      weather: {
        temp:      isFinite(wx.temp)     ? wx.temp     : null,
        feels:     isFinite(wx.feels)    ? wx.feels    : null,
        humidity:  isFinite(wx.humidity) ? wx.humidity : null,
        condition: (WEATHER_CODE_MAP[wx.code] || ["",""])[0]
      },
      wind: {
        dir:            isFinite(wx.windDir)   ? compassFromDegrees(wx.windDir) : null,
        speed:          isFinite(wx.windSpeed) ? wx.windSpeed                   : null,
        sustainedHours: sustained
      },
      moon: {
        phaseName:    moonAtTarget.phaseName,
        emoji:        moonAtTarget.emoji,
        illumination: moonAtTarget.illumination,
        age:          Math.round(moonAtTarget.age * 10) / 10
      },
      solunar: {
        major1: solAtTarget.major1.window,
        major2: solAtTarget.major2.window,
        minor1: solAtTarget.minor1.window,
        minor2: solAtTarget.minor2.window
      },
      baro: getBaroTrend() ? { pressure: getBaroTrend().pressure, trend: getBaroTrend().trend, change: getBaroTrend().change } : null,
      lakeHistory:  Array.isArray(lakeHistory) ? lakeHistory.slice(-30) : [],
      recentCatches: tripLog
    };
    const res = await fetch(FISHPLAN_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const errText = await res.text();
      panel.innerHTML =
        '<div class="fish-smart-header"><span class="spark">✦</span> AI SMART PLAN</div>' +
        '<div class="fish-smart-error">Couldn\'t generate plan: HTTP ' + res.status + '<br><span style="opacity:.7">' + escapeHtml(errText.slice(0, 240)) + '</span></div>';
      return;
    }
    const data = await res.json();
    setFishPlanCache(cacheKey, data);
    renderFishSmartPanel(panel, data, false, () => fetchAndShowSmartPlan(lake, weather, panel, btn, true, lakeHistory, waterTempF, targetDate));
  } catch (err) {
    panel.innerHTML =
      '<div class="fish-smart-header"><span class="spark">✦</span> AI SMART PLAN</div>' +
      '<div class="fish-smart-error">' + escapeHtml(err.message || "Network error") + '</div>';
  } finally {
    btn.classList.remove("is-loading");
  }
}

function wireFishSmartPlan(lake, weather, advice, lakeHistory, waterTempF) {
  const btn = document.getElementById("fishSmartBtn");
  const panel = document.getElementById("fishSmartPanel");
  if (!btn || !panel) return;

  const getTargetDate = () => {
    const dateEl = document.getElementById("fishPlanDate");
    const timeEl = document.getElementById("fishPlanTime");
    const dateStr = dateEl?.value || new Date().toISOString().slice(0, 10);
    const timeStr = timeEl?.value || "12:00";
    return new Date(`${dateStr}T${timeStr}:00`);
  };

  const getManualWaterTemp = () => {
    const el = document.getElementById("fishWaterTemp");
    const v = el ? parseFloat(el.value) : NaN;
    if (isFinite(v) && v > 32 && v < 95) {
      try { localStorage.setItem("news.fishing.watertemp", JSON.stringify({ temp: v, ts: Date.now() })); } catch {}
      return v;
    }
    return waterTempF; // fall back to stored value
  };

  const doGenerate = () => {
    const targetDate = getTargetDate();
    const currentWaterTemp = getManualWaterTemp();
    panel.classList.add("open");
    btn.classList.add("is-open");
    fetchAndShowSmartPlan(lake, weather, panel, btn, false, lakeHistory, currentWaterTemp, targetDate);
  };

  btn.addEventListener("click", () => {
    if (panel.classList.contains("open")) {
      panel.classList.remove("open");
      btn.classList.remove("is-open");
      setTimeout(() => { panel.innerHTML = ""; }, 250);
      return;
    }
    doGenerate();
  });

  // Wire up the trip log button
  const logBtn = document.getElementById("fishLogBtn");
  const logPanel = document.getElementById("fishLogPanel");
  if (logBtn && logPanel) {
    logBtn.addEventListener("click", () => {
      if (logPanel.classList.contains("open")) {
        logPanel.classList.remove("open");
        setTimeout(() => { logPanel.innerHTML = ""; }, 250);
        return;
      }
      logPanel.classList.add("open");
      renderTripLogPanel(logPanel, lake, waterTempF);
    });
  }
}

async function loadOutdoor(force) {
  listEl.innerHTML = "";
  statusEl.style.display = "none";
  newPillEl.style.display = "none";

  const advisorDiv = document.createElement("div");
  // Garden/mushroom/cattle/weekly cards moved to the new `garden` and `market` tabs.
  // Outdoor tab is now Fishing Advisor + News only.
  advisorDiv.innerHTML = '<div class="fish-advisor"><div class="fish-header"><div class="fish-title">🎣 Truman Lake Fishing Report</div></div><div class="fish-loading"><span class="spinner"></span> Loading live conditions…</div></div>' + '<div class="outdoor-news-header">🗞️ MO Outdoor News</div>';
  listEl.appendChild(advisorDiv);

  const newsDiv = document.createElement("div");
  newsDiv.innerHTML = Array.from({length:5}, ()=>
    '<div class="skel"><div class="skel-body"><div class="skel-line s1"></div><div class="skel-line s2"></div><div class="skel-line s3"></div><div class="skel-line s4"></div></div><div class="skel-img"></div></div>'
  ).join("");
  listEl.appendChild(newsDiv);

  const cat = CATEGORIES.find(c => c.id==="outdoor");
  if (force) cat.feeds.forEach(f => localStorage.removeItem("news.cache."+f.url));

  const [lakeData, weeklyRecords, lakeHistoryResult, waterTempF, newsResults] = await Promise.all([
    fetchTrumanLake(),
    fetchWeeklyData(),
    fetch(LAKE_HISTORY_ENDPOINT).then(r => r.ok ? r.json() : { readings: [] }).catch(() => ({ readings: [] })),
    fetchWaterTemp(),
    Promise.all(cat.feeds.map(f => fetchFeed(f).catch(()=>[])))
  ]);

  // Store today's reading in KV (fire-and-forget)
  if (lakeData && Number.isFinite(lakeData.stage)) {
    fetch(LAKE_READING_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ elevation: lakeData.stage, inflow: lakeData.inflow ?? null, outflow: lakeData.outflow ?? null })
    }).catch(() => {});
  }

  const lakeHistory = lakeHistoryResult?.readings || [];

  const weatherData = getCachedWeather();
  const advice = generateFishingAdvice(lakeData, weatherData);
  advisorDiv.innerHTML = renderFishingAdvisor(lakeData, weatherData, advice, weeklyRecords, lakeHistory, waterTempF);
  // Wire up the AI Smart Plan button now that the advisor markup is in the DOM
  wireFishSmartPlan(lakeData, weatherData, advice, lakeHistory, waterTempF);
  wireCattleMarket();
  wireWeeklyMarket();

  const all = newsResults.flat();
  const seen = new Set();
  let deduped = all.filter(item => {
    const key = item.title.toLowerCase().slice(0,60);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  // MO-first relevance pass. Top-tier MO sources get 240-hour half-life so a
  // 5-day MDC release still beats a fresh national wire piece.
  const outdoorScore = ({it, rel}) => {
    const ageH = (Date.now() - it.pubDate) / 3600000;
    const halfLife = rel >= 7 ? 240 : rel >= 5 ? 96 : 24;
    const decay = Math.exp(-ageH / halfLife);
    const w = SOURCE_WEIGHT[it.source] || SOURCE_WEIGHT["default"];
    return decay * w * Math.max(0.15, 1 + 0.5 * rel);
  };
  deduped = deduped
    .map(it => ({ it, rel: outdoorRelevance(it) }))
    .sort((a, b) => outdoorScore(b) - outdoorScore(a))
    .map(x => x.it);

  newsDiv.innerHTML = "";
  if (deduped.length) {
    currentItems = deduped;
    const frag = document.createDocumentFragment();
    deduped.forEach((item,i) => frag.appendChild(buildArticle(item, false)));
    newsDiv.appendChild(frag);
  } else {
    newsDiv.innerHTML = '<div class="status">No outdoor news loaded. Tap ↺ to retry.</div>';
  }
}

async function fetchTextThroughProxies(targetUrl) {
  let lastErr;
  for (const proxy of CORS_PROXIES) {
    try {
      const res=await fetchWithTimeout(proxy.url(targetUrl), FEED_TIMEOUT_MS);
      if (!res.ok) { lastErr=new Error(proxy.name+" HTTP "+res.status); continue; }
      const text=await res.text();
      if (!text||text.length<10) { lastErr=new Error(proxy.name+" empty"); continue; }
      return text;
    } catch(err) { lastErr=err; }
  }
  throw lastErr||new Error("all stock proxies failed");
}

async function fetchQuoteYahoo(ticker) {
  const yahooUrl="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(ticker)+"?interval=1d&range=1mo";
  const text=await fetchTextThroughProxies(yahooUrl);
  const data=JSON.parse(text);
  const result=data&&data.chart&&data.chart.result&&data.chart.result[0];
  if (!result) throw new Error("no chart data");
  const meta=result.meta||{};
  const closesRaw=(result.indicators&&result.indicators.quote&&result.indicators.quote[0]&&result.indicators.quote[0].close)||[];
  const closes=closesRaw.filter(x=>x!==null&&x!==undefined);
  const price=(meta.regularMarketPrice!==undefined&&meta.regularMarketPrice!==null)?meta.regularMarketPrice:closes[closes.length-1];

  // BUG FIX: use meta.previousClose (yesterday's close) — NOT meta.chartPreviousClose,
  // which is the close 1 month ago because the chart range is "1mo". Using the wrong
  // field made INTC, AMC, NVDA, etc. show monthly-change instead of daily-change.
  // If meta.previousClose is missing, fall back to the second-to-last close in the
  // chart array (which is yesterday's close when the latest is today's intraday price).
  let prevClose;
  if (meta.previousClose !== undefined && meta.previousClose !== null) {
    prevClose = meta.previousClose;
  } else if (closes.length >= 2) {
    // If price === last close, the chart's last bar IS today and prev is closes[-2].
    // If price !== last close, the chart's last bar is yesterday and IS the prev close.
    prevClose = (Math.abs(price - closes[closes.length-1]) < 0.005)
      ? closes[closes.length-2]
      : closes[closes.length-1];
  } else {
    prevClose = price; // can't compute change — show flat rather than nonsense
  }

  const change=price-prevClose;
  return { ticker, name:meta.shortName||meta.longName||ticker, price, change, changePct:prevClose?(change/prevClose)*100:0, currency:meta.currency||"USD", closes:closes.slice(-30), source:"Yahoo" };
}
async function fetchQuoteStooq(ticker) {
  const sym=ticker.toLowerCase()+(ticker.indexOf(".")===-1?".us":"");
  const csv=await fetchTextThroughProxies("https://stooq.com/q/d/l/?s="+encodeURIComponent(sym)+"&i=d");
  if (!csv||csv.indexOf("Date")===-1) throw new Error("no stooq data");
  const rows=csv.trim().split(/\r?\n/).slice(1).map(l=>l.split(",")).filter(r=>r.length>=5);
  if (rows.length<2) throw new Error("not enough rows");
  const closes=rows.slice(-30).map(r=>parseFloat(r[4])).filter(x=>!isNaN(x));
  if (closes.length<2) throw new Error("bad closes");
  const price=closes[closes.length-1], prev=closes[closes.length-2], change=price-prev;
  return { ticker, name:ticker, price, change, changePct:(change/prev)*100, currency:"USD", closes, source:"Stooq" };
}
async function fetchQuote(ticker, force) {
  const cacheKey="news.quote."+ticker;
  if (!force) {
    const cached=localStorage.getItem(cacheKey);
    if (cached) { try { const p=JSON.parse(cached); if(Date.now()-p.ts<STOCKS_CACHE_TTL_MS) return p.data; } catch {} }
  }
  for (const fn of [fetchQuoteYahoo, fetchQuoteStooq]) {
    try {
      const info=await fn(ticker);
      if (info&&isFinite(info.price)&&isFinite(info.change)) {
        try { localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data:info})); } catch {}
        return info;
      }
    } catch(err) { console.warn("["+ticker+"] "+fn.name+":", (err&&err.message)||err); }
  }
  return null;
}
function sparklineSvg(closes) {
  if (!closes||closes.length<2) return '<div class="stock-spark"></div>';
  const w=70,h=30,pad=2,min=Math.min(...closes),max=Math.max(...closes),range=max-min||1;
  const points=closes.map((c,i)=>{
    const x=pad+(i/(closes.length-1))*(w-2*pad);
    const y=h-pad-((c-min)/range)*(h-2*pad);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  const up=closes[closes.length-1]>=closes[0];
  return '<svg class="stock-spark" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg"><polyline fill="none" stroke="'+(up?"#22c55e":"#ef4444")+'" stroke-width="1.5" points="'+points+'"/></svg>';
}
function fmtMoney(n,currency) {
  if (n===null||n===undefined||!isFinite(n)) return "—";
  return (currency==="USD"?"$":"")+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtChange(abs,pct) {
  if (abs===null||abs===undefined||!isFinite(abs)) return "—";
  const sign=abs>=0?"+":"";
  return sign+abs.toFixed(2)+" ("+sign+pct.toFixed(2)+"%)";
}

async function loadStockNews(force) {
  const newsSection=document.getElementById("stockNewsSection");
  if (!newsSection) return;
  const watchlist = getWatchlist();
  if (!watchlist.length) { newsSection.innerHTML = ""; return; }
  const feeds = buildStockNewsFeeds(watchlist);
  newsSection.innerHTML=
    '<div class="stock-news-header">'+
      '<div class="stock-news-title">📰 News for your watchlist</div>'+
      '<div class="stock-news-sub">'+watchlist.length+' tickers · headlines per stock</div>'+
    '</div>'+
    '<div class="stock-news-loading"><span class="spinner"></span>Loading stock news…</div>';
  if (force) feeds.forEach(f=>localStorage.removeItem("news.cache."+f.url));

  // Per-ticker fetch — tag each item with which ticker it came from so we can show
  // a "TICKER" chip on the headline. We keep PER_FEED_LIMIT small so big watchlists
  // don't drown the user; sort + dedupe across all tickers afterwards.
  const results = await Promise.all(feeds.map(async f => {
    try {
      const items = await fetchFeed(f);
      return items.map(item => ({ ...item, _ticker: f.ticker, source: f.source + " · News" }));
    } catch { return []; }
  }));

  const all = results.flat();
  const seen = new Set();
  const deduped = all.filter(item => {
    const k = item.title.toLowerCase().slice(0, 60);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  }).sort((a, b) => heatScore(b) - heatScore(a));

  if (!deduped.length) { newsSection.querySelector(".stock-news-loading").textContent="No stock news loaded."; return; }
  newsSection.querySelector(".stock-news-loading").remove();
  const frag=document.createDocumentFragment();
  deduped.slice(0, 50).forEach(item=>{ frag.appendChild(buildArticle(item, false)); });
  newsSection.appendChild(frag);
}

  inputRow.className="stock-input-row";

  listEl.appendChild(inputRow);
  const rowsContainer=document.createElement("div");
  rowsContainer.id="stockRows";
  listEl.appendChild(rowsContainer);
  if (!watchlist.length) {
    rowsContainer.innerHTML='<div class="status">Your watchlist is empty. Add a ticker above.</div>';
  } else {
    watchlist.forEach(t=>{
      const row=document.createElement("div");
      row.className="stock-row stock-loading"; row.id="stock-row-"+t;
      const displayTicker=TICKER_DISPLAY[t]||t;
      row.innerHTML='<div class="stock-main"><div class="stock-ticker">'+escapeHtml(displayTicker)+'</div><div class="stock-name">Loading…</div></div>'+
        '<div class="stock-spark"></div>'+
        '<div class="stock-price"><div class="price">—</div><div class="change">—</div></div>'+
        '<button class="stock-remove" data-ticker="'+escapeHtml(t)+'" title="Remove">×</button>';
      rowsContainer.appendChild(row);
    });
  }
  const newsSection=document.createElement("div"); newsSection.id="stockNewsSection";
  listEl.appendChild(newsSection);
  const input=document.getElementById("stockInput"), addBtn=document.getElementById("stockAddBtn");
  const addTicker=()=>{
    const v=(input.value||"").trim().toUpperCase().replace(/[^A-Z0-9.\-=]/g,"");
    if (!v) return;
    const wl=getWatchlist();
    if (wl.includes(v)) { input.value=""; return; }
    wl.push(v); setWatchlist(wl); input.value=""; loadStocks();
  };
  addBtn.addEventListener("click",addTicker);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") addTicker(); });
  rowsContainer.querySelectorAll(".stock-remove").forEach(btn=>{
    btn.addEventListener("click",()=>{ setWatchlist(getWatchlist().filter(x=>x!==btn.getAttribute("data-ticker"))); loadStocks(); });
  });
  await Promise.all([
    Promise.all(watchlist.map(async t=>{
      const q=await fetchQuote(t,force);
      const row=document.getElementById("stock-row-"+t);
      if (!row) return;
      row.classList.remove("stock-loading");
      if (!q) { row.querySelector(".stock-name").textContent="Couldn't load — proxies rate-limited"; return; }
      const up=q.change>=0;
      row.querySelector(".stock-name").textContent=q.name+(q.source?" · "+q.source:"");
      const oldSpark=row.querySelector(".stock-spark");
      if (oldSpark) oldSpark.outerHTML=sparklineSvg(q.closes);
      row.querySelector(".stock-price").innerHTML=
        '<div class="price">'+fmtMoney(q.price,q.currency)+'</div>'+
        '<div class="change '+(up?"up":"down")+'">'+fmtChange(q.change,q.changePct)+'</div>';
    })),
    loadStockNews(force)
  ]);
}

// ========== AI BRIEF ==========
const BRIEF_ENDPOINT     = CF_WORKER.replace(/\/$/, "") + "/brief";
const FOLLOWUP_ENDPOINT  = CF_WORKER.replace(/\/$/, "") + "/followup";
const BRIEF_CACHE_TTL_MS = 7 * 24 * 3600000; // 7 days (ignored for saved entries)

function briefHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return Math.abs(h).toString(36);
}
function getBriefCache(url) {
  try {
    const raw = localStorage.getItem("news.brief." + briefHash(url));
    if (!raw) return null;
    const obj = JSON.parse(raw);
    // Saved entries never expire; unsaved entries expire after 7 days
    if (!obj.saved && Date.now() - obj.ts > BRIEF_CACHE_TTL_MS) {
      localStorage.removeItem("news.brief." + briefHash(url));
      return null;
    }
    return obj; // { ts, data, messages, saved }
  } catch { return null; }
}
function setBriefCache(url, data, messages, saved) {
  try {
    const existing = getBriefCache(url);
    localStorage.setItem("news.brief." + briefHash(url), JSON.stringify({
      ts: existing ? existing.ts : Date.now(), // keep original research date
      data,
      messages: messages !== undefined ? messages : (existing ? existing.messages || [] : []),
      saved: saved !== undefined ? saved : (existing ? existing.saved || false : false)
    }));
  } catch {}
}

async function handleBriefClick(item, btn, panel) {
  // Toggle close if already open and not loading
  if (panel.classList.contains("open") && !btn.classList.contains("is-loading")) {
    panel.classList.remove("open");
    btn.classList.remove("is-open");
    return;
  }
  const cached = getBriefCache(item.link);
  if (cached && cached.data && cached.data.brief) {
    renderBriefPanel(panel, { ...cached.data, cached: true }, item, btn, cached.messages || [], cached.saved || false);
    panel.classList.add("open");
    btn.classList.add("is-open");
    return;
  }
  await fetchAndShowBrief(item, btn, panel);
}

async function fetchAndShowBrief(item, btn, panel) {
  btn.classList.add("is-loading");
  btn.classList.add("is-open");
  panel.innerHTML =
    '<div class="brief-header"><span>✦</span> AI Brief</div>' +
    '<div class="brief-loading"><span class="spinner"></span><span>Researching the story…</span></div>';
  panel.classList.add("open");

  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(BRIEF_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        url: item.link,
        title: item.title,
        description: item.description || "",
        source: item.source || ""
      })
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { throw new Error("Bad JSON: " + text.slice(0, 200)); }
    if (!res.ok || !data.brief) {
      throw new Error(data.error || ("HTTP " + res.status));
    }
    setBriefCache(item.link, data, [], false);
    renderBriefPanel(panel, data, item, btn, [], false);
  } catch (err) {
    const msg = err.name === "AbortError" ? "Research timed out — try again" : (err.message || String(err));
    panel.innerHTML =
      '<div class="brief-header"><span>✦</span> AI Brief</div>' +
      '<div class="brief-error">Couldn\'t generate a brief: ' + escapeHtml(msg) + '</div>';
  } finally {
    clearTimeout(timer);
    btn.classList.remove("is-loading");
  }
}

function renderBriefPanel(panel, data, item, btn, initMessages, initSaved) {
  const paras = String(data.brief)
    .split(/\n\n+/)
    .filter(p => p.trim())
    .map(p => "<p>" + escapeHtml(p.trim()) + "</p>")
    .join("");
  const ts = data.generated_at ? new Date(data.generated_at) : null;
  const tsStr = ts && isFinite(ts) ? ts.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";

  // Mutable state for this panel instance
  let messages = initMessages ? [...initMessages] : [];
  let isSaved  = initSaved || false;

  function buildChatHtml() {
    if (!messages.length) return "";
    return '<div class="brief-chat">' +
      messages.map(m =>
        "<div>" +
          '<div class="brief-chat-msg-q">You asked: ' + escapeHtml(m.q) + "</div>" +
          '<div class="brief-chat-msg-a">' + escapeHtml(m.a) + "</div>" +
        "</div>"
      ).join("") +
    "</div>";
  }

  panel.innerHTML =
    '<div class="brief-header"><span>✦</span> AI Brief</div>' +
    '<div class="brief-text">' + paras + "</div>" +
    buildChatHtml() +
    '<div class="brief-followup-row">' +
      '<input class="brief-followup-input" type="text" placeholder="Ask a follow-up question…" />' +
      '<button class="brief-ask-btn" type="button">Ask</button>' +
    "</div>" +
    '<div class="brief-meta">' +
      "<span>" + (data.cached ? "Researched earlier" : "Researched just now") + (tsStr ? " · " + tsStr : "") + "</span>" +
      '<div style="display:flex;gap:12px;align-items:center;">' +
        (isSaved
          ? '<span class="brief-saved-badge">✓ Saved</span>'
          : '<button class="brief-save-btn" type="button">Save</button>') +
        '<button class="brief-refresh" type="button">Refresh</button>' +
      "</div>" +
    "</div>";

  // ── Follow-up Q&A ──
  const input  = panel.querySelector(".brief-followup-input");
  const askBtn = panel.querySelector(".brief-ask-btn");

  async function submitFollowUp() {
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    askBtn.disabled = true;
    askBtn.textContent = "…";

    // Ensure chat container exists
    let chat = panel.querySelector(".brief-chat");
    if (!chat) {
      chat = document.createElement("div");
      chat.className = "brief-chat";
      panel.querySelector(".brief-followup-row").insertAdjacentElement("beforebegin", chat);
    }

    // Append question + thinking placeholder immediately
    const msgDiv = document.createElement("div");
    msgDiv.innerHTML =
      '<div class="brief-chat-msg-q">You asked: ' + escapeHtml(question) + "</div>" +
      '<div class="brief-chat-msg-a brief-chat-thinking"><span class="spinner"></span><span>Thinking…</span></div>';
    chat.appendChild(msgDiv);

    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      let res;
      try {
        res = await fetch(FOLLOWUP_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: item.title, url: item.link, brief: data.brief, question, history: messages }),
          signal: ctrl.signal
        });
      } finally { clearTimeout(timer); }

      const result = await res.json();
      if (!res.ok || !result.answer) throw new Error(result.error || "No answer returned");

      msgDiv.querySelector(".brief-chat-msg-a").innerHTML = escapeHtml(result.answer);
      messages = [...messages, { q: question, a: result.answer }];
      setBriefCache(item.link, data, messages); // auto-persist follow-ups

    } catch (err) {
      const msg = err.name === "AbortError" ? "Timed out — try again" : (err.message || String(err));
      msgDiv.querySelector(".brief-chat-msg-a").innerHTML =
        '<span style="color:#b91c1c">' + escapeHtml(msg) + "</span>";
    } finally {
      askBtn.disabled = false;
      askBtn.textContent = "Ask";
    }
  }

  askBtn.addEventListener("click",  e => { e.preventDefault(); e.stopPropagation(); submitFollowUp(); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); submitFollowUp(); } });
  input.addEventListener("click",   e => e.stopPropagation()); // prevent opening article

  // ── Save button ──
  const saveBtn = panel.querySelector(".brief-save-btn");
  if (saveBtn) {
    saveBtn.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      // Mark brief as permanent
      setBriefCache(item.link, data, messages, true);
      isSaved = true;
      // Also bookmark the article so it shows up in the Saved tab
      if (!getSaved().some(s => s.link === item.link)) toggleSave(item);
      // Update the bookmark button on the article card if present
      const articleEl = panel.closest(".item-wrap")?.querySelector("a.item");
      if (articleEl) {
        articleEl.classList.add("bookmarked");
        const bkmk = articleEl.querySelector(".bkmk-btn");
        if (bkmk) bkmk.innerHTML = '<span class="bk-icon">🔖</span>Saved';
      }
      const badge = document.createElement("span");
      badge.className = "brief-saved-badge";
      badge.textContent = "✓ Saved";
      saveBtn.replaceWith(badge);
    });
  }

  // ── Refresh button ──
  panel.querySelector(".brief-refresh").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    try { localStorage.removeItem("news.brief." + briefHash(item.link)); } catch {}
    fetchAndShowBrief(item, btn, panel);
  });
}

// ========== ARTICLE BUILDER ==========
function buildArticle(item, isHero) {
  const wrap = document.createElement("div");
  wrap.className = "item-wrap";

  const a = document.createElement("a");
  a.className = "item" + (isHero?" hero":"") + (isRead(item.link)?" read":"") + (isSaved(item.link)?" bookmarked":"");
  a.href = item.link;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("role","article");
  a.dataset.link = item.link;

  const hasImg = item.thumbnail && /^https?:\/\//.test(item.thumbnail);
  const breaking = isBreaking(item.title);
  const badgeHtml =
    (breaking || item.trending || item.isNew)
    ? '<div class="badge-row">' +
        (breaking ? '<span class="badge badge-breaking">Breaking</span>' : '') +
        (item.trending ? '<span class="badge badge-trending">Trending</span>' : '') +
        (item.isNew ? '<span class="badge badge-new">New</span>' : '') +
      '</div>'
    : '';

  const savedNow = isSaved(item.link);
  a.innerHTML =
    '<div class="item-text">' +
      '<div class="kicker">'+escapeHtml(item.source)+'</div>' +
      badgeHtml +
      '<div class="title">'+escapeHtml(item.title)+'</div>' +
      (item.description?'<div class="desc">'+escapeHtml(item.description)+'</div>':'') +
      '<div class="meta">' +
        '<span class="meta-age">'+relativeTime(item.pubDate)+'</span>' +
        '<span class="meta-dot">·</span>' +
        '<button class="brief-btn" type="button" title="Research this story with AI"><span class="spark">✦</span> AI Brief</button>' +
        '<button class="bkmk-btn" type="button" title="'+(savedNow?"Remove bookmark":"Save this article")+'">' +
          '<span class="bk-icon">'+(savedNow?"🔖":"☆")+'</span>'+(savedNow?"Saved":"Save")+
        '</button>' +
      '</div>' +
    '</div>' +
    (hasImg?'<img class="thumb" src="'+escapeHtml(item.thumbnail)+'" alt="" loading="lazy" onerror="this.remove()">':'');

  // Brief panel is a sibling of the article inside the wrapper
  const panel = document.createElement("div");
  panel.className = "brief-panel";

  wrap.appendChild(a);
  wrap.appendChild(panel);

  // Mark read on click — but ignore clicks on action buttons
  a.addEventListener("click", e => {
    if (e.target.closest(".bkmk-btn") || e.target.closest(".brief-btn")) {
      e.preventDefault();
      return;
    }
    markRead(item.link);
    a.classList.add("read");
  });

  // Bookmark button (lives in the meta row now)
  const bkmkBtn = a.querySelector(".bkmk-btn");
  if (savedNow) a.classList.add("bookmarked");
  bkmkBtn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const nowSaved = toggleSave(item);
    a.classList.toggle("bookmarked", nowSaved);
    bkmkBtn.innerHTML = '<span class="bk-icon">'+(nowSaved?"🔖":"☆")+'</span>'+(nowSaved?"Saved":"Save");
    bkmkBtn.title = nowSaved ? "Remove bookmark" : "Save this article";
  });

  // AI Brief button
  const briefBtn = a.querySelector(".brief-btn");
  briefBtn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    handleBriefClick(item, briefBtn, panel);
  });

  return wrap;
}

// ========== RENDER NEWS ==========
function renderNews(items) {
  kbIndex = -1;
  const frag = document.createDocumentFragment();
  items.forEach((item, i) => {
    frag.appendChild(buildArticle(item, i === 0));
  });
  listEl.innerHTML = "";
  listEl.appendChild(frag);
}

}

// ========== LOAD CATEGORY ==========
async function loadCategory(force) {
  const cat = CATEGORIES.find(c => c.id === activeCat);

  if (cat.isStocks)  return loadStocks(force);
  if (cat.isOutdoor) return loadOutdoor(force);
  if (cat.isGarden)  return loadGarden(force);
  if (cat.isMarket)  return loadMarket(force);

  if (cat.isSaved) {
    statusEl.style.display = "none";
    const saved = getSaved();
    if (!saved.length) {
      listEl.innerHTML = '<div class="status">No saved stories yet. Hover any article and tap 🏷️ to save it.</div>';
    } else {
      currentItems = saved;
      renderNews(saved);
      // Auto-expand brief panels for any saved article that has a saved AI brief
      requestAnimationFrame(() => {
        const wraps = listEl.querySelectorAll(".item-wrap");
        saved.forEach((item, i) => {
          const cached = getBriefCache(item.link);
          if (!cached || !cached.saved || !cached.data || !cached.data.brief) return;
          const wrap = wraps[i];
          if (!wrap) return;
          const panel = wrap.querySelector(".brief-panel");
          const btn   = wrap.querySelector(".brief-btn");
          if (panel && btn) {
            renderBriefPanel(panel, { ...cached.data, cached: true }, item, btn, cached.messages || [], true);
            panel.classList.add("open");
            btn.classList.add("is-open");
          }
        });
      });
    }
    return;
  }

  showSkeleton(7);
  statusEl.style.display = "none";
  newPillEl.style.display = "none";

  if (force) cat.feeds.forEach(f => localStorage.removeItem("news.cache." + f.url));

  const lastVisit = parseInt(localStorage.getItem("news.lastVisit."+cat.id) || "0");
  localStorage.setItem("news.lastVisit."+cat.id, String(Date.now()));
  const cutoffMs = cat.maxAgeHours ? Date.now() - cat.maxAgeHours * 3600000 : 0;

  // Fetch all feeds in parallel, catch individual failures so one bad feed doesn't break everything
  const results = await Promise.all(cat.feeds.map(f => fetchFeed(f).catch(() => [])));
  const all = results.flat();

  // Deduplicate, apply recency window, sort by heat score
  const seen = new Set();
  let deduped = all.filter(item => {
    if (cutoffMs && item.pubDate < cutoffMs) return false;
    const key = item.title.toLowerCase().slice(0, 60);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).sort((a, b) => heatScore(b) - heatScore(a));

  // Local-news relevance pass: drop big-city-only stories with no rural/regional
  // angle, and reorder so Clinton/Henry/Truman headlines float to the top.
  if (cat.id === "local") {
    // For ultralocal sources use a 168-hour half-life instead of the global 12-hour one,
    // so a week-old Henry County Sheriff report still floats above a fresh NC wire story.
    const localScore = ({it, rel}) => {
      const ageH = (Date.now() - it.pubDate) / 3600000;
      const halfLife = rel >= 8 ? 168 : 12;
      const decay = Math.exp(-ageH / halfLife);
      const w = SOURCE_WEIGHT[it.source] || SOURCE_WEIGHT["default"];
      return decay * w * Math.max(0.1, 1 + 0.6 * rel);
    };
    deduped = deduped
      .map(it => ({ it, rel: localRelevance(it) }))
      .filter(x => x.rel >= 0)
      .sort((a, b) => localScore(b) - localScore(a))
      .map(x => x.it);
  }

  if (deduped.length === 0) {
    listEl.innerHTML = "";
    statusEl.style.display = "block";
      '<span style="opacity:.6">Tried: '+cat.feeds.map(f=>f.source).join(", ")+'</span><br>' +
      '<button class="retry-btn" onclick="loadCategory(true)">Try again</button>';
    return;
  }

  markTrending(deduped);
  deduped.forEach(i => { i.isNew = lastVisit > 0 && i.pubDate > lastVisit; });
  currentItems = deduped;
  renderNews(deduped);

  const newCount = deduped.filter(i => i.isNew).length;
  if (newCount > 0 && lastVisit > 0) {
    newPillEl.textContent = newCount + " new";
    newPillEl.style.display = "";
  }
}

// ========== KEYBOARD NAVIGATION ==========
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { closeDrawer(); if(searchOpen){searchBtn.click();} return; }
  const articles = [...listEl.querySelectorAll("article.item")];
  if (!articles.length) return;
  if (e.key === "j" || e.key === "ArrowDown") {
    e.preventDefault();
    articles[kbIndex]?.classList.remove("kb-focus");
    kbIndex = Math.min(kbIndex + 1, articles.length - 1);
    articles[kbIndex].classList.add("kb-focus");
    articles[kbIndex].scrollIntoView({ block:"nearest", behavior:"smooth" });
  } else if (e.key === "k" || e.key === "ArrowUp") {
    e.preventDefault();
    articles[kbIndex]?.classList.remove("kb-focus");
    kbIndex = Math.max(kbIndex - 1, 0);
    articles[kbIndex].classList.add("kb-focus");
    articles[kbIndex].scrollIntoView({ block:"nearest", behavior:"smooth" });
  } else if (e.key === "Enter" && kbIndex >= 0) {
    const link = articles[kbIndex]?.href;
    if (link) window.open(link, "_blank", "noopener");
  } else if (e.key === "b" && kbIndex >= 0) {
    const bkmkBtn = articles[kbIndex]?.querySelector(".bkmk-btn");
    if (bkmkBtn) bkmkBtn.click();
  }
});

// ========== INIT ==========
document.getElementById("refreshBtn").addEventListener("click", () => {
  localStorage.removeItem("news.nws.alerts");
  fetchNWSAlerts(); loadWeather(true); loadCategory(true);
});

// Pull-to-refresh
let startY=0, pulling=false;
document.addEventListener("touchstart", e=>{ if(window.scrollY===0){startY=e.touches[0].clientY;pulling=true;} },{passive:true});
document.addEventListener("touchend", e=>{
  if (!pulling) return;
  if (e.changedTouches[0].clientY - startY > 80) { fetchNWSAlerts(); loadWeather(true); loadCategory(true); }
  pulling=false;
});

renderQuoteOfDay();
renderDrawer();
renderQuickTabs();
updateSectionLabel();
fetchNWSAlerts();
loadWeather();
loadCategory();

setInterval(()=>{ localStorage.removeItem("news.nws.alerts"); fetchNWSAlerts(); }, ALERTS_CACHE_TTL_MS);
// ─── Auto-hide header on scroll down, reveal on scroll up (iOS news-app pattern)
(function setupHeaderAutoHide(){
  const headerEl = document.querySelector("header");
  const reveal   = document.getElementById("headerReveal");
  if (!headerEl) return;
  let lastY    = window.scrollY || 0;
  let ticking  = false;
  let hidden   = false;
  const SHOW_NEAR_TOP = 80;
  const DOWN_DELTA    = 6;
  const UP_DELTA      = 6;
  function setHidden(yes){
    if (yes === hidden) return;
    hidden = yes;
    headerEl.classList.toggle("header-hidden", yes);
    if (reveal) reveal.classList.toggle("visible", yes);
  }
  function onScroll(){
    const y = window.scrollY || 0;
    const delta = y - lastY;
    if (y < SHOW_NEAR_TOP) setHidden(false);
    else if (delta > DOWN_DELTA) setHidden(true);
    else if (delta < -UP_DELTA) setHidden(false);
    lastY = y;
    ticking = false;
  }
  window.addEventListener("scroll", () => {
    if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
  }, { passive: true });
  if (reveal) {
    reveal.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
      setHidden(false);
    });
  }
})();
</script>
