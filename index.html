<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<title>Matt's Daily Read</title>
<style>
  :root { --bg:#f8f4ec; --text:#1a1410; --text-muted:#6b6258; --text-soft:#9a9286; --border:#e3ddcf; --accent:#b8331a; --sage:#7a8b6f; --mustard:#c49b3f; --card-hover:#ede8dc; }
  [data-theme="dark"] { --bg:#0f0e0d; --text:#f5f1e8; --text-muted:#a39c8f; --text-soft:#6b6258; --border:#2a2825; --accent:#ff6b4a; --sage:#9ab18d; --mustard:#e0b552; --card-hover:#1c1b19; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { background-color:var(--bg); background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 500' preserveAspectRatio='xMidYMax slice'><path fill='%23a8b89a' fill-opacity='.4' d='M0 250c200-30 380-10 580 10s420-15 620-5 280 20 400 5v240H0z'/><path fill='%237a8b6f' fill-opacity='.55' d='M0 340c220-30 420-10 640 5s440 0 640-10 220 5 320 5v160H0z'/><g fill='%235e6e54' fill-opacity='.55'><ellipse cx='180' cy='335' rx='8' ry='14'/><ellipse cx='200' cy='328' rx='10' ry='18'/><ellipse cx='220' cy='335' rx='8' ry='13'/><ellipse cx='560' cy='328' rx='9' ry='15'/><ellipse cx='580' cy='322' rx='11' ry='19'/><ellipse cx='600' cy='328' rx='9' ry='14'/><ellipse cx='980' cy='328' rx='9' ry='15'/><ellipse cx='1000' cy='322' rx='11' ry='19'/><ellipse cx='1020' cy='328' rx='9' ry='14'/><ellipse cx='1320' cy='332' rx='9' ry='15'/><ellipse cx='1340' cy='326' rx='11' ry='19'/></g><path fill='%235e6e54' fill-opacity='.72' d='M0 430c240-25 460 5 680 0s420 15 660 5 200 5 260 5v60H0z'/><g transform='translate(1100 408)' fill='%23472e1e' fill-opacity='.72'><polygon points='0,8 17,-2 34,8'/><rect y='8' width='34' height='16'/><rect x='13' y='14' width='6' height='10' fill='%23000' fill-opacity='.6'/></g><g stroke='%234a3924' stroke-width='1.2' stroke-opacity='.55' fill='none'><path d='M1138 426h140M1138 432h140'/></g></svg>"); background-attachment:fixed; background-position:center bottom; background-repeat:no-repeat; background-size:100% auto; transition:background-color .25s ease; }
  html,body { color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background-color .25s ease,color .25s ease; }
  body { background:transparent; min-height:100vh; }
  [data-theme="dark"] html { background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 500' preserveAspectRatio='xMidYMax slice'><path fill='%231f2a1c' fill-opacity='.55' d='M0 250c200-30 380-10 580 10s420-15 620-5 280 20 400 5v240H0z'/><path fill='%23121810' fill-opacity='.7' d='M0 340c220-30 420-10 640 5s440 0 640-10 220 5 320 5v160H0z'/><g fill='%2308100a' fill-opacity='.7'><ellipse cx='180' cy='335' rx='8' ry='14'/><ellipse cx='200' cy='328' rx='10' ry='18'/><ellipse cx='220' cy='335' rx='8' ry='13'/><ellipse cx='560' cy='328' rx='9' ry='15'/><ellipse cx='580' cy='322' rx='11' ry='19'/><ellipse cx='600' cy='328' rx='9' ry='14'/><ellipse cx='980' cy='328' rx='9' ry='15'/><ellipse cx='1000' cy='322' rx='11' ry='19'/><ellipse cx='1020' cy='328' rx='9' ry='14'/><ellipse cx='1320' cy='332' rx='9' ry='15'/><ellipse cx='1340' cy='326' rx='11' ry='19'/></g><path fill='%23070a06' fill-opacity='.85' d='M0 430c240-25 460 5 680 0s420 15 660 5 200 5 260 5v60H0z'/><g transform='translate(1100 408)' fill='%23000' fill-opacity='.7'><polygon points='0,8 17,-2 34,8'/><rect y='8' width='34' height='16'/><rect x='13' y='14' width='6' height='10' fill='%23ffd97a' fill-opacity='.5'/></g></svg>"); }
  a { color:inherit; text-decoration:none; }

  /* ── ALERT BANNER ── */
  #alertBanner { width:100%; display:none; flex-direction:column; gap:0; }
  #alertBanner.has-alerts { display:flex; }
  .alert-item { padding:10px 20px; display:flex; align-items:flex-start; gap:10px; font-size:13px; line-height:1.4; color:#fff; }
  .alert-item.extreme  { background:#7f1d1d; }
  .alert-item.severe   { background:#92400e; }
  .alert-item.moderate { background:#1e3a5f; }
  .alert-item.minor    { background:#374151; }
  .alert-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
  .alert-body { flex:1; min-width:0; }
  .alert-event { font-weight:700; letter-spacing:0.02em; }
  .alert-headline { opacity:.9; margin-top:2px; }
  .alert-link { color:#fff; text-decoration:underline; white-space:nowrap; font-weight:600; margin-left:8px; flex-shrink:0; }

  /* ── DRAWER ── */
  .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .drawer-overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; left:0; bottom:0; width:min(300px,85vw); background:var(--bg); border-right:1px solid var(--border); z-index:60; transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; overflow:hidden; }
  .drawer.open { transform:translateX(0); }
  .drawer-header { padding:20px 20px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); flex-shrink:0; }
  .drawer-brand { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; letter-spacing:-0.01em; }
  .drawer-brand span { color:var(--accent); }
  .drawer-close { width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .drawer-close:hover { background:var(--card-hover); color:var(--text); }
  .drawer-list { flex:1; overflow-y:auto; padding:10px 0; }
  .drawer-item { display:flex; align-items:center; gap:12px; padding:12px 20px; cursor:pointer; font-size:15px; font-weight:500; color:var(--text-muted); border-left:3px solid transparent; transition:background .15s,color .15s; }
  .drawer-item:hover { background:var(--card-hover); color:var(--text); }
  .drawer-item.active { color:var(--accent); border-left-color:var(--accent); background:var(--card-hover); font-weight:700; }
  .drawer-item-icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }

  /* ── HEADER (NYT-style masthead — bigger, bolder, more print-newspaper) ── */
  header { position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--bg) 95%,transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:3px double var(--text); padding:max(env(safe-area-inset-top),8px) 20px 0; transition:transform .25s cubic-bezier(.4,0,.2,1); will-change:transform; }
  header.header-hidden { transform:translateY(-100%); }
  /* Floating reveal pill — appears bottom-right when header is hidden so user can still reach it */
  .header-reveal { position:fixed; right:14px; bottom:max(env(safe-area-inset-bottom),18px); z-index:9; width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:color-mix(in srgb,var(--bg) 92%,transparent); -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px); color:var(--text); display:none; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.18); transition:opacity .2s ease, transform .2s ease; }
  .header-reveal.visible { display:flex; }
  .header-reveal svg { width:18px; height:18px; }
  .header-reveal:active { transform:scale(.94); }
  .header-row { max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:4px; }
  /* Masthead-style brand: large serif with real newspaper presence. */
  .brand { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:34px; font-weight:900; letter-spacing:-0.025em; line-height:0.95; color:var(--text); }
  .brand span { color:var(--accent); }
  /* Dateline strap under the masthead — NYT's most recognizable line. */
  .dateline { max-width:760px; margin:0 auto; padding:6px 0 8px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); font-weight:700; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .dateline-volume { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-style:italic; letter-spacing:0.02em; text-transform:none; color:var(--text); font-weight:500; font-size:13px; flex:1; text-align:center; padding:0 8px; }
  .header-actions { display:flex; align-items:center; gap:5px; }
  @media (max-width:520px) {
    .brand { font-size:26px; }
    .dateline { font-size:9px; letter-spacing:0.12em; }
    .dateline-volume { font-size:11px; padding:0 4px; }
  }
  .icon-btn { width:36px; height:36px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--border); color:var(--text); cursor:pointer; flex-shrink:0; }
  .icon-btn:hover { background:var(--card-hover); }
  .icon-btn svg { width:17px; height:17px; }
  .font-btn { height:28px; padding:0 9px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:11px; font-weight:700; font-family:inherit; line-height:1; }
  .font-btn:hover { background:var(--card-hover); color:var(--text); }

  /* ── SEARCH ── */
  .search-wrap { max-width:760px; margin:0 auto; overflow:hidden; max-height:0; opacity:0; transition:max-height .2s ease,opacity .2s ease; }
  .search-wrap.open { max-height:52px; opacity:1; }
  .search-inner { display:flex; gap:8px; padding-bottom:10px; }
  .search-input { flex:1; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card-hover); color:var(--text); font-size:14px; outline:none; font-family:inherit; }
  .search-input:focus { border-color:var(--accent); }
  .search-clear { width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  /* ── WEATHER ── */
  .weather { max-width:760px; margin:0 auto 2px; padding:10px 0; display:flex; flex-direction:column; gap:8px; font-size:14px; }
  .weather.loading { opacity:0.5; }
  .w-current { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .w-temp { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .w-icon { font-size:22px; }
  .w-cond { color:var(--text); font-weight:500; }
  .w-sep { color:var(--text-soft); }
  .w-meta { color:var(--text-muted); font-size:12px; margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .w-meta span { white-space:nowrap; }
  .w-forecast { display:flex; align-items:center; gap:10px; padding-top:6px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted); flex-wrap:wrap; }
  .w-day { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .w-day-name { color:var(--text); font-weight:600; }
  .w-radar { margin-left:auto; color:var(--accent); font-weight:600; white-space:nowrap; text-decoration:none; }
  .w-radar:hover { text-decoration:underline; }
  .w-lake { display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 8px; background:color-mix(in srgb,var(--accent) 12%,transparent); border-radius:999px; font-weight:700; color:var(--accent); font-size:13px; white-space:nowrap; text-decoration:none; }
  .w-lake:hover { text-decoration:underline; }

  /* ── QUOTE OF DAY ── */
  .quote-bar { max-width:760px; margin:0 auto; padding:12px 0 12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:6px; position:relative; }
  .quote-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.16em; color:var(--accent); margin-bottom:5px; display:flex; align-items:center; gap:8px; }
  .quote-label::before, .quote-label::after { content:""; flex:1; height:1px; background:color-mix(in srgb,var(--accent) 30%,transparent); }
  .quote-text { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:15px; color:var(--text); font-style:italic; line-height:1.55; text-align:center; padding:0 8px; }
  .quote-author { font-size:10px; color:var(--text-soft); margin-top:7px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; text-align:center; }
  @media (max-width:520px) { .quote-text { font-size:14px; } }

  /* ── SECTION BAR (full newspaper section break with double rules top + bottom) ── */
  .section-bar { max-width:760px; margin:14px auto 0; display:flex; align-items:center; justify-content:space-between; padding:10px 0 8px; border-top:3px double var(--text); border-bottom:1px solid var(--text); }
  .section-left { display:flex; align-items:center; gap:8px; }
  .section-label { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:17px; font-weight:900; color:var(--text); letter-spacing:0.20em; text-transform:uppercase; font-style:normal; }
  .new-pill { font-size:10px; font-weight:700; color:var(--accent); background:color-mix(in srgb,var(--accent) 13%,transparent); padding:2px 7px; border-radius:999px; white-space:nowrap; }
  .section-menu-btn { font-size:13px; font-weight:600; color:var(--accent); background:transparent; border:none; cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:5px; }
  .section-menu-btn svg { width:14px; height:14px; }

  /* ── QUICK TABS ── */
  .quick-tabs { max-width:760px; margin:0 auto; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; display:flex; gap:7px; padding:5px 0 10px; }
  .quick-tabs::-webkit-scrollbar { display:none; }
  .qtab { flex-shrink:0; padding:5px 13px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .12s,color .12s,border-color .12s; }
  .qtab:hover { background:var(--card-hover); color:var(--text); }
  .qtab.active { background:var(--text); color:var(--bg); border-color:var(--text); font-weight:600; }

  /* ── MAIN ── */
  main { max-width:760px; margin:0 auto; padding:8px 20px max(env(safe-area-inset-bottom),40px); background:color-mix(in srgb,var(--bg) 92%,transparent); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); position:relative; }
  footer { background:color-mix(in srgb,var(--bg) 88%,transparent); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  .status { padding:40px 20px; text-align:center; color:var(--text-muted); font-size:14px; line-height:1.6; }
  .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes shimmer { 0%{opacity:.35} 50%{opacity:.7} 100%{opacity:.35} }

  /* ── SKELETON ── */
  .skel { display:flex; gap:16px; padding:20px 0; border-bottom:1px solid var(--border); }
  .skel-body { flex:1; display:flex; flex-direction:column; gap:7px; padding-top:4px; }
  .skel-line { background:var(--card-hover); border-radius:4px; animation:shimmer 1.5s ease-in-out infinite; }
  .skel-line.s1 { height:11px; width:38%; }
  .skel-line.s2 { height:19px; width:94%; }
  .skel-line.s3 { height:19px; width:72%; }
  .skel-line.s4 { height:13px; width:88%; }
  .skel-line.s5 { height:13px; width:60%; }
  .skel-img { width:110px; height:110px; flex-shrink:0; border-radius:8px; background:var(--card-hover); animation:shimmer 1.5s ease-in-out infinite; }

  /* ── NEWS ITEMS (NYT-style with kicker, deck, fine rules) ── */
  .item-wrap { border-bottom:1px solid var(--border); }
  .item-wrap:last-child { border-bottom:none; }
  article.item { display:flex; gap:18px; padding:22px 0 16px; cursor:pointer; position:relative; }
  article.item:hover .title { color:var(--accent); }
  article.item.read { opacity:0.52; }
  article.item.read:hover { opacity:0.82; }
  article.item.kb-focus { outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
  /* Kicker — bold italic mini-caps section label above the headline, like NYT print. */
  .kicker { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:11px; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; font-style:italic; }
  .kicker::after { content:""; display:inline-block; width:24px; height:1px; background:var(--accent); margin-left:10px; vertical-align:middle; opacity:0.7; }

  /* ── AI BRIEF ── */
  .brief-btn { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border)); background:color-mix(in srgb,var(--accent) 7%,transparent); color:var(--accent); font-size:11px; font-weight:700; letter-spacing:0.04em; cursor:pointer; font-family:inherit; text-transform:uppercase; transition:background .12s,color .12s; }
  .brief-btn:hover { background:var(--accent); color:#fff; }
  .brief-btn.is-loading { pointer-events:none; opacity:0.7; }
  .brief-btn.is-open { background:var(--accent); color:#fff; }
  .brief-btn .spark { font-size:10px; line-height:1; }
  .brief-panel { margin:0 0 14px; padding:0 16px; max-height:0; overflow:hidden; transition:max-height .35s ease, padding .2s ease; background:color-mix(in srgb,var(--accent) 4%,var(--card-hover)); border-left:3px solid var(--accent); border-radius:0 6px 6px 0; }
  .brief-panel.open { max-height:2400px; padding:14px 16px; margin:0 0 18px; }
  .brief-header { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); margin-bottom:8px; }
  .brief-loading { display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:13px; padding:4px 0; }
  .brief-text { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:14.5px; line-height:1.65; color:var(--text); }
  .brief-text p { margin-bottom:8px; }
  .brief-text p:last-child { margin-bottom:0; }
  .brief-meta { margin-top:10px; padding-top:8px; border-top:1px solid color-mix(in srgb,var(--accent) 18%,var(--border)); display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--text-soft); letter-spacing:0.04em; text-transform:uppercase; }
  .brief-refresh { background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:10px; font-family:inherit; letter-spacing:0.04em; text-transform:uppercase; padding:0; }
  .brief-refresh:hover { text-decoration:underline; }
  .brief-error { color:#b91c1c; font-size:13px; line-height:1.5; }
  [data-theme="dark"] .brief-error { color:#f87171; }
  /* ── Follow-up chat ── */
  .brief-chat { margin-top:14px; padding-top:12px; border-top:1px solid color-mix(in srgb,var(--accent) 18%,var(--border)); display:flex; flex-direction:column; gap:14px; }
  .brief-chat-msg-q { font-size:11.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px; }
  .brief-chat-msg-a { font-size:14px; line-height:1.65; color:var(--text); font-family:"Iowan Old Style","Palatino","Georgia",serif; }
  .brief-chat-thinking { display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:13px; }
  .brief-followup-row { display:flex; gap:7px; margin-top:14px; padding-top:10px; border-top:1px solid color-mix(in srgb,var(--accent) 18%,var(--border)); }
  .brief-followup-input { flex:1; padding:7px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:13px; font-family:inherit; outline:none; }
  .brief-followup-input:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent); }
  .brief-ask-btn { padding:7px 14px; border:none; border-radius:6px; background:var(--accent); color:#fff; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; letter-spacing:0.03em; }
  .brief-ask-btn:hover { filter:brightness(1.1); }
  .brief-ask-btn:disabled { opacity:0.5; pointer-events:none; }
  .brief-save-btn { background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:10px; font-family:inherit; letter-spacing:0.04em; text-transform:uppercase; padding:0; }
  .brief-save-btn:hover { text-decoration:underline; }
  .brief-saved-badge { font-size:10px; color:var(--text-soft); letter-spacing:0.04em; text-transform:uppercase; }
  .item-text { flex:1; min-width:0; }
  .meta { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:9px; flex-wrap:wrap; color:var(--text-soft); }
  .source-chip { background:var(--card-hover); color:var(--text-muted); font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; letter-spacing:0.04em; text-transform:uppercase; }
  .meta-dot { color:var(--text-soft); opacity:0.4; }
  .meta-age { font-size:11px; color:var(--text-soft); font-style:italic; letter-spacing:0.02em; }
  .badge-row { display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; align-items:center; }
  .badge { font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; letter-spacing:0.04em; text-transform:uppercase; }
  .badge-breaking { background:#7f1d1d; color:#fecaca; }
  .badge-trending { background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 28%,transparent); }
  .badge-new { background:#14532d; color:#bbf7d0; }
  .title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:20px; font-weight:700; line-height:1.22; letter-spacing:-0.015em; color:var(--text); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .desc { margin-top:7px; font-size:14.5px; color:var(--text-muted); line-height:1.45; font-family:"Iowan Old Style","Palatino","Georgia",serif; font-style:italic; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .thumb { width:110px; height:110px; flex-shrink:0; border-radius:2px; background:var(--card-hover); object-fit:cover; }
  /* Bookmark — always visible. Sits in the meta row alongside AI Brief. */
  .bkmk-btn { display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; font-family:inherit; transition:background .12s,color .12s,border-color .12s; }
  .bkmk-btn:hover { background:var(--card-hover); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 35%,var(--border)); }
  .bkmk-btn .bk-icon { font-size:12px; line-height:1; }
  article.item.bookmarked .bkmk-btn { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 35%,var(--border)); background:color-mix(in srgb,var(--accent) 7%,transparent); }

  /* ── HERO (lead story — newspaper above-the-fold treatment) ── */
  article.item.hero { flex-direction:column; gap:14px; padding:18px 0 30px; border-bottom:3px double var(--text); position:relative; }
  article.item.hero::before { content:"LEAD STORY"; display:block; font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:10px; font-weight:900; letter-spacing:0.32em; color:var(--accent); text-align:center; padding:6px 0; border-bottom:1px solid var(--border); margin-bottom:6px; }
  article.item.hero .thumb { width:100%; height:280px; border-radius:0; }
  article.item.hero .kicker { font-size:13px; text-align:center; letter-spacing:0.22em; }
  article.item.hero .kicker::after { display:none; }
  article.item.hero .title { font-size:38px; line-height:1.05; letter-spacing:-0.025em; -webkit-line-clamp:5; text-align:center; font-weight:900; padding:0 4px; }
  article.item.hero .desc { -webkit-line-clamp:3; font-size:17px; line-height:1.55; margin-top:10px; text-align:center; padding:0 12px; }
  article.item.hero .meta { justify-content:center; }
  @media (max-width:520px) {
    article.item.hero .title { font-size:26px; }
    article.item.hero .thumb { height:200px; }
    article.item.hero .desc { font-size:15px; padding:0 4px; }
  }

  /* ── STOCKS ── */
  .stock-input-row { display:flex; gap:8px; padding:20px 0 12px; border-bottom:1px solid var(--border); }
  .stock-input { flex:1; padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card-hover); color:var(--text); font-size:14px; outline:none; font-family:inherit; text-transform:uppercase; letter-spacing:0.03em; }
  .stock-input:focus { border-color:var(--accent); }
  .stock-add-btn { padding:0 18px; border-radius:999px; border:none; background:var(--text); color:var(--bg); font-weight:600; font-size:14px; cursor:pointer; }
  .stock-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
  .stock-main { flex:1; min-width:0; }
  .stock-ticker { font-weight:700; font-size:15px; letter-spacing:0.02em; }
  .stock-name { font-size:12px; color:var(--text-soft); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stock-spark { width:70px; height:30px; flex-shrink:0; opacity:0.9; }
  .stock-price { text-align:right; min-width:92px; }
  .stock-price .price { font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; }
  .stock-price .change { font-size:12px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .up { color:#15803d; } [data-theme="dark"] .up { color:#4ade80; }
  .down { color:#b91c1c; } [data-theme="dark"] .down { color:#f87171; }
  .stock-remove { width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--text-soft); cursor:pointer; font-size:18px; line-height:1; padding:0; flex-shrink:0; }
  .stock-remove:hover { background:var(--card-hover); color:var(--accent); }
  .stock-loading { opacity:0.5; }
  .stock-news-header { display:flex; align-items:center; gap:8px; padding:24px 0 4px; border-top:2px solid var(--border); margin-top:8px; }
  .stock-news-title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; color:var(--text); }
  .stock-news-sub { font-size:12px; color:var(--text-muted); margin-left:auto; }
  .stock-news-loading { padding:20px 0; text-align:center; color:var(--text-muted); font-size:13px; }

  /* ── FOOTER ── */
  footer { max-width:760px; margin:40px auto 0; padding:20px; text-align:center; color:var(--text-soft); font-size:12px; border-top:1px solid var(--border); }
  .retry-btn { margin-top:14px; padding:8px 18px; border-radius:999px; background:var(--accent); color:white; border:none; font-size:14px; font-weight:500; cursor:pointer; }

  /* ── RESPONSIVE (compact mobile — see more articles per screen) ── */
  @media (max-width:520px) {
    .brand { font-size:21px; }
    .dateline { font-size:9.5px; letter-spacing:0.14em; padding:4px 0 5px; }
    .title { font-size:15.5px; line-height:1.2; -webkit-line-clamp:3; }
    .desc { font-size:12.5px; line-height:1.35; -webkit-line-clamp:2; margin-top:4px; }
    .thumb { width:72px; height:72px; }
    article.item { padding:9px 0 9px; gap:11px; }
    .meta { margin-top:5px; font-size:11px; gap:6px; }
    .source-chip { font-size:9px; padding:1.5px 5px; }
    .meta-age { font-size:10px; }
    .badge { font-size:9px; padding:1.5px 5px; }
    .badge-row { margin-bottom:3px; gap:4px; }
    .kicker { font-size:9.5px; margin-bottom:3px; letter-spacing:0.14em; }
    .brief-btn, .bkmk-btn { font-size:10px; padding:2px 7px; }
    article.item.hero { padding:12px 0 16px; gap:10px; }
    article.item.hero .thumb { height:170px; }
    article.item.hero .title { font-size:22px; -webkit-line-clamp:4; }
    article.item.hero .desc { font-size:14px; margin-top:6px; -webkit-line-clamp:2; }
    article.item.hero::before { padding:4px 0; margin-bottom:4px; font-size:9px; letter-spacing:0.28em; }
    main { padding:4px 16px max(env(safe-area-inset-bottom),24px); }
    header { padding-top:max(env(safe-area-inset-top),4px); }
    header .header-row { padding-bottom:2px; }
    /* ── Compact mobile header — save ~130px of sticky chrome ── */
    header { padding-top:max(env(safe-area-inset-top),3px); }
    header .header-row { padding-bottom:1px; }
    /* Hide quote of the day in the sticky header — biggest single space-saver */
    .quote-bar { display:none; }
    /* Collapse weather to current-conditions only — hide the multi-day forecast row */
    .weather { padding:4px 0 3px; gap:4px; }
    .w-forecast { display:none; }
    /* Trim meta row to just the essentials (wind + precip) */
    .w-meta { font-size:10.5px; gap:5px; }
    .w-meta span:not(.w-lake) { white-space:nowrap; }
    .w-temp { font-size:19px; }
    .w-icon { font-size:19px; }
    /* Shrink dateline — hide the centre motto, keep date + edition */
    .dateline { padding:3px 0 4px; }
    .dateline-volume { display:none; }
    /* Tighten section bar and tabs */
    .section-bar { margin-top:5px; padding:4px 0 4px; }
    .section-label { font-size:13px; letter-spacing:0.14em; }
    .quick-tabs { padding:2px 0 5px; gap:4px; }
    .qtab { padding:4px 10px; font-size:11.5px; }
    .icon-btn { width:32px; height:32px; }
    .icon-btn svg { width:15px; height:15px; }
    main, .header-row, header, .weather, .section-bar, .quick-tabs, .quote-bar, .search-wrap, .dateline { padding-left:14px; padding-right:14px; }
    .weather, .section-bar, .quick-tabs, .quote-bar, .dateline { padding-left:0; padding-right:0; }
    .skel-img { width:84px; height:84px; }
    .font-btn { display:none; }
  }

  /* ── OUTDOOR / FISHING ADVISOR ── */
  .fish-advisor { background:color-mix(in srgb,var(--accent) 5%,var(--bg)); border:1px solid var(--border); border-radius:12px; padding:20px; margin:8px 0 20px; }
  .fish-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .fish-title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; }
  .fish-date { font-size:12px; color:var(--text-muted); }
  .fish-bite-meter { display:flex; align-items:center; gap:16px; padding:14px; background:var(--card-hover); border-radius:8px; margin-bottom:14px; flex-wrap:wrap; }
  .fish-bite-score { font-size:38px; line-height:1; flex-shrink:0; }
  .fish-bite-info { flex:1; min-width:80px; }
  .fish-bite-label { font-weight:700; font-size:16px; }
  .fish-bite-sub { font-size:13px; color:var(--accent); margin-top:2px; letter-spacing:0.02em; }
  .fish-conditions { display:flex; gap:16px; flex-wrap:wrap; }
  .fish-lake-stat { text-align:center; min-width:48px; }
  .fish-stat-val { font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
  .fish-stat-lbl { font-size:11px; color:var(--text-muted); }
  .fish-stat-trend { font-size:11px; font-weight:700; margin-top:2px; }
  .fish-stat-trend.rising { color:#15803d; } [data-theme="dark"] .fish-stat-trend.rising { color:#4ade80; }
  .fish-stat-trend.falling { color:#b91c1c; } [data-theme="dark"] .fish-stat-trend.falling { color:#f87171; }
  .fish-stat-trend.stable { color:var(--text-muted); }
  .fish-section { margin:12px 0; }
  .fish-section-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-bottom:6px; }
  .fish-chip { display:inline-block; padding:4px 10px; border-radius:999px; background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent); font-size:12px; font-weight:600; margin:2px 3px 2px 0; }
  .fish-chip-bait { background:color-mix(in srgb,#2563eb 10%,transparent); color:#2563eb; }
  [data-theme="dark"] .fish-chip-bait { color:#60a5fa; background:color-mix(in srgb,#60a5fa 13%,transparent); }
  .fish-chip-spot { background:color-mix(in srgb,#059669 10%,transparent); color:#059669; font-size:11px; }
  [data-theme="dark"] .fish-chip-spot { color:#34d399; background:color-mix(in srgb,#34d399 13%,transparent); }
  .fish-tip { font-size:14px; color:var(--text); line-height:1.5; padding:9px 12px; background:var(--card-hover); border-radius:6px; margin:5px 0; }
  .outdoor-news-header { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; padding:16px 0 8px; border-bottom:2px solid var(--border); margin-bottom:4px; }
  .fish-loading { padding:24px 0; text-align:center; color:var(--text-muted); font-size:14px; }
  /* AI Smart Plan button + response panel */
  .lake-history-chart { margin:12px 0 6px; padding:10px 12px 6px; background:color-mix(in srgb,var(--accent) 4%,var(--bg)); border:1px solid var(--border); border-radius:8px; }
  .lake-history-label { font-size:11px; font-weight:600; letter-spacing:0.04em; color:var(--text-soft); text-transform:uppercase; margin-bottom:6px; }

  /* Moon / baro / solunar meta row */
  .fish-meta-row { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 4px; }
  .fish-meta-block { flex:1; min-width:140px; background:color-mix(in srgb,var(--accent) 5%,var(--bg)); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .fish-solunar-block { flex:2; min-width:220px; }
  .fish-meta-label { font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  .fish-meta-val { font-size:15px; font-weight:700; color:var(--text); }
  .fish-meta-sub { font-size:11px; color:var(--text-soft); margin-top:1px; }
  .fish-solunar-grid { display:grid; grid-template-columns:auto 1fr; gap:2px 8px; font-size:11px; }
  .sol-major { color:var(--accent); font-weight:700; }
  .sol-minor { color:var(--text-soft); }
  .fish-baro-note { font-size:12px; color:var(--text-soft); border-left:3px solid; padding-left:10px; margin:6px 0 10px; line-height:1.5; }

  /* Trip planner */
  .fish-trip-planner { background:color-mix(in srgb,var(--accent) 6%,var(--bg)); border:1px solid color-mix(in srgb,var(--accent) 25%,var(--border)); border-radius:10px; padding:14px 16px 10px; margin:14px 0 4px; }
  .fish-trip-label { font-size:12px; font-weight:700; color:var(--text); margin-bottom:10px; letter-spacing:0.02em; }
  .fish-trip-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .fish-trip-input { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:6px 10px; color:var(--text); font-family:inherit; font-size:13px; }
  .fish-trip-go { font-size:12px; padding:7px 14px; }

  /* Trip log */
  .fish-log-row { text-align:center; margin:10px 0 2px; }
  .fish-log-btn { background:transparent; border:1px solid var(--border); border-radius:999px; color:var(--text-soft); font-family:inherit; font-size:12px; padding:5px 14px; cursor:pointer; transition:all .15s; }
  .fish-log-btn:hover { background:var(--card-hover); color:var(--text); }
  .fish-log-panel { max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .fish-log-panel.open { max-height:1600px; }
  .trip-log-form { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:16px; margin:10px 0; }
  .trip-log-form-title { font-weight:700; font-size:14px; margin-bottom:12px; }
  .trip-log-field-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--text-soft); }
  .trip-log-field-row label { min-width:52px; font-weight:600; }
  .trip-log-chips { display:flex; flex-wrap:wrap; gap:5px; }
  .trip-chip { padding:3px 9px; border-radius:999px; border:1px solid var(--border); font-size:11px; cursor:pointer; transition:all .12s; color:var(--text-soft); background:var(--bg); }
  .trip-chip.selected { background:var(--accent); color:#fff; border-color:var(--accent); }
  .trip-log-save-btn { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 18px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; margin-top:4px; }
  .trip-log-history { margin-top:12px; }
  .trip-log-hist-title { font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-soft); margin-bottom:8px; }
  .trip-log-entry { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .trip-log-entry-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .trip-log-date { font-weight:700; font-size:12px; }
  .trip-log-moon { font-size:11px; color:var(--text-soft); }
  .trip-log-del { margin-left:auto; background:transparent; border:none; color:var(--text-soft); cursor:pointer; font-size:12px; padding:0; }
  .trip-log-species { font-size:13px; font-weight:600; color:var(--text); }
  .trip-log-detail { font-size:11px; color:var(--text-soft); margin-top:3px; }
  .trip-log-notes { font-size:11px; color:var(--text-soft); font-style:italic; margin-top:3px; }
  .trip-log-cond { font-size:10px; color:var(--text-soft); margin-top:3px; opacity:0.7; }
  .fish-smart-row { padding:12px 0 4px; text-align:center; }
  .fish-smart-btn { display:inline-flex; align-items:center; gap:7px; padding:9px 18px; border-radius:999px; border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border)); background:color-mix(in srgb,var(--accent) 8%,transparent); color:var(--accent); font-size:13px; font-weight:700; letter-spacing:0.05em; cursor:pointer; font-family:inherit; text-transform:uppercase; transition:background .15s,color .15s,border-color .15s; }
  .fish-smart-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .fish-smart-btn.is-loading { pointer-events:none; opacity:0.7; }
  .fish-smart-btn.is-open { background:var(--accent); color:#fff; }
  .fish-smart-btn .spark { font-size:11px; }
  .fish-smart-sub { font-size:11px; color:var(--text-soft); margin-top:6px; font-style:italic; }
  .fish-smart-panel { max-height:0; overflow:hidden; transition:max-height .25s ease, padding .2s ease; padding:0 16px; background:color-mix(in srgb,var(--accent) 5%,var(--card-hover)); border-left:3px solid var(--accent); border-radius:0 6px 6px 0; margin:0; }
  .fish-smart-panel.open { max-height:1500px; padding:16px 18px; margin:10px 0 8px; }
  .fish-smart-header { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); margin-bottom:10px; }
  .fish-smart-loading { display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:13px; padding:4px 0; }
  .fish-smart-text { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:15px; line-height:1.65; color:var(--text); }
  .fish-smart-text p { margin-bottom:10px; }
  .fish-smart-text p:last-child { margin-bottom:0; }
  .fish-smart-meta { margin-top:12px; padding-top:8px; border-top:1px solid color-mix(in srgb,var(--accent) 18%,var(--border)); display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--text-soft); letter-spacing:0.04em; text-transform:uppercase; }
  .fish-smart-refresh { background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:10px; font-family:inherit; letter-spacing:0.04em; text-transform:uppercase; padding:0; }
  .fish-smart-refresh:hover { text-decoration:underline; }
  .fish-smart-error { color:#b91c1c; font-size:13px; line-height:1.5; }
  [data-theme="dark"] .fish-smart-error { color:#f87171; }

  /* ── MUSHROOM + GARDEN + CATTLE CARDS ── */
  .outdoor-card { border:1px solid var(--border); border-radius:12px; padding:18px; margin:0 0 18px; }
  .outdoor-card.mushroom { background:color-mix(in srgb,var(--mustard) 6%,var(--bg)); }
  .outdoor-card.garden   { background:color-mix(in srgb,var(--sage) 8%,var(--bg)); }
  .outdoor-card.cattle   { background:color-mix(in srgb,#8b4513 5%,var(--bg)); }
  /* Cattle barn tile grid */
  .barn-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-top:8px; }
  .barn-tile { border:1px solid var(--border); border-radius:8px; padding:12px 14px; background:var(--card-hover); display:flex; flex-direction:column; gap:5px; position:relative; }
  .barn-tile.buddy { border-color:color-mix(in srgb,var(--accent) 50%,var(--border)); background:color-mix(in srgb,var(--accent) 7%,var(--card-hover)); }
  .barn-name { font-weight:700; font-size:14px; line-height:1.25; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .barn-buddy-tag { display:inline-flex; align-items:center; gap:3px; padding:1px 7px; border-radius:999px; background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent); font-size:9.5px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; }
  .barn-loc { font-size:11px; color:var(--text-muted); }
  .barn-price { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text); margin-top:3px; }
  .barn-price .unit { font-size:11px; font-weight:500; color:var(--text-muted); margin-left:3px; }
  .barn-price.placeholder { color:var(--text-soft); font-size:13px; font-weight:500; font-style:italic; }

// ========== UTILS ==========
function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
}
function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
}
function extractImg(html) {
  if (!html) return "";
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  return m ? m[1] : "";
}
function relativeTime(ts) {
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  if (diff < 604800) return Math.floor(diff/86400) + "d ago";
  return new Date(ts).toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Heat score: source weight × exponential recency decay (half-life ~12h)
function heatScore(item) {
  const ageHours = (Date.now() - item.pubDate) / 3600000;
  const decay = Math.exp(-ageHours / 12);
  const weight = SOURCE_WEIGHT[item.source] || SOURCE_WEIGHT["default"];
  return decay * weight;
}

// Hillary/Bill Clinton, Clinton (Ontario), Clinton (BC), etc.
const ULTRALOCAL_RE = /\b(clinton(,?\s*mo\b|\s+missouri\b|\s+daily\s+democrat\b)|henry\s+county,?\s*(mo|missouri)\b|truman\s+(lake|reservoir|dam)|kdkd|tightwad|calhoun,?\s*mo\b|deepwater,?\s*mo\b|montrose,?\s*mo\b|blairstown,?\s*mo\b|urich|leesville,?\s*mo\b|grand\s+river\s+arm|osage\s+arm|sparrowfoot|brownington|hartwell,?\s*mo\b|coal,?\s*mo\b)\b/i;
const FOREIGN_CLINTON_RE = /\b((hillary|bill|chelsea|william\s+j\.?|president|secretary)\s+clinton|clinton\s*,?\s*(ontario|on\b|b\.?c\.?|british\s+columbia|canada|iowa|ia\b|illinois|il\b|connecticut|ct\b|new\s+jersey|nj\b|new\s+york|ny\b|tennessee|tn\b|maryland|md\b|mississippi|ms\b|south\s+carolina|sc\b|north\s+carolina|nc\b|oklahoma|ok\b|arkansas|ar\b|kentucky|ky\b|indiana|in\b|utah|ut\b|wisconsin|wi\b|michigan|mi\b|township)|clinton\s+(foundation|administration|global\s+initiative|cards|devon))\b/i;
const HYPERLOCAL_RE = /\b(warsaw\s+missouri|warsaw,?\s*mo|cole\s+camp|lincoln,?\s*mo|benton\s+county\s+missouri|hickory\s+county|hermitage,?\s*mo|cross\s+timbers|st\.?\s*clair\s+county|osceola,?\s*mo|lowry\s+city|appleton\s+city|bates\s+county|butler,?\s*mo|adrian,?\s*mo|rich\s+hill|windsor\s+missouri|knob\s+noster|whiteman\s+(afb|air\s+force))\b/i;
const REGIONAL_RE  = /\b(sedalia|warrensburg|pettis\s+county|johnson\s+county\s+missouri|kingsville|holden,?\s*mo|lake\s+of\s+the\s+ozarks|camden\s+county|state\s+fair\s+community|west[\s-]?central\s+missouri|west\s+missouri|missouri\s+ozarks|harrisonville|raymore|peculiar|belton,?\s*mo|nevada,?\s*mo|vernon\s+county|el\s+dorado\s+springs|bolivar,?\s*mo|polk\s+county\s+missouri|cedar\s+county\s+missouri|stockton,?\s*mo|saline\s+county|marshall,?\s*mo|kmos)\b/i;
const KC_RE        = /\b(kansas\s+city|kcmo|jackson\s+county\s+missouri|kc\s+chiefs|chiefs\s+kingdom|kc\s+royals|sporting\s+kc|kc\s+current|kmbc|kshb|fox\s*4\s*kc)\b/i;
const STATEWIDE_RE = /\b(missouri\s+(governor|legislature|legislator|senator|state\s+senator|house|representative|attorney\s+general|treasurer|supreme\s+court|department|highway\s+patrol|conservation|state\s+park)|kehoe|mike\s+kehoe|mike\s+parson|mdc|modot|state\s+of\s+missouri|missouri\s+farm|missouri\s+agriculture|farm\s+bureau)\b/i;
const BIG_CITY_RE  = /\b(st\.?\s*louis|springfield,?\s*mo|cape\s+girardeau|columbia,?\s*mo|jefferson\s+city|chesterfield|o.fallon|wentzville|st\.?\s*charles|joplin|branson)\b/i;
const ULTRALOCAL_SOURCES = new Set(["Clinton Daily Democrat","KDKD Clinton","USACE Truman Lake"]);
const HYPERLOCAL_SOURCES = new Set(["Knob Noster / Whiteman","Lake of the Ozarks","West Central MO"]);
const ULTRALOCAL_GN_SOURCES = new Set(["Henry County MO","Clinton MO News","Truman Lake"]);
const HYPERLOCAL_GN_SOURCES = new Set(["Benton County MO","St. Clair County MO","Bates County MO","Hickory County MO"]);
const USACE_DISTRICT_SOURCES = new Set(["USACE Kansas City"]);
const USACE_TRUMAN_RE = /\b(truman|stockton\s+lake|pomme\s+de\s+terre|osage\s+river|harry\s+s\.?\s+truman)\b/i;
const KC_SOURCES = new Set(["KCUR","Kansas City Star","KMBC 9 KC","KSHB 41 KC","Fox 4 KC","Kansas City News"]);

function localRelevance(item) {
  const text = (item.title + " " + (item.description || "")).toLowerCase();
  const isForeignClinton = FOREIGN_CLINTON_RE.test(text);
  if (ULTRALOCAL_SOURCES.has(item.source) && !isForeignClinton) return 8;
  if (HYPERLOCAL_SOURCES.has(item.source)) return 5;
  if (USACE_DISTRICT_SOURCES.has(item.source)) return USACE_TRUMAN_RE.test(text) ? 7 : 1;
  if (ULTRALOCAL_GN_SOURCES.has(item.source) && ULTRALOCAL_RE.test(text) && !isForeignClinton) return 8;
  if (HYPERLOCAL_GN_SOURCES.has(item.source) && HYPERLOCAL_RE.test(text)) return 5;
  if (ULTRALOCAL_RE.test(text) && !isForeignClinton) return 8;
  if (HYPERLOCAL_RE.test(text))  return 5;
  if (REGIONAL_RE.test(text))    return 2;
  if (STATEWIDE_RE.test(text))   return 2;
  if (KC_SOURCES.has(item.source) || KC_RE.test(text)) return 1;
  if (BIG_CITY_RE.test(text))    return -2;
  if (isForeignClinton) return -3;
  return 0;
}

// ── OUTDOOR-NEWS RELEVANCE — MO-first, Truman/Henry highest ──
const MO_HOMETURF_RE = /\b(truman\s+(lake|reservoir|dam)|harry\s+s\.?\s+truman|henry\s+county|clinton(,?\s*mo|\s+missouri)|kdkd|tightwad|osage\s+river|grand\s+river\s+arm|lake\s+of\s+the\s+ozarks|bagnell|stockton\s+lake|pomme\s+de\s+terre|mark\s+twain\s+(national\s+)?(forest|lake)|table\s+rock|lake\s+taneycomo|bull\s+shoals|current\s+river|jacks\s+fork|eleven\s+point|niangua|gasconade|meramec|big\s+piney|whitewater)\b/i;
const MO_GENERAL_RE = /\b(missouri|mdc|missouri\s+department\s+of\s+conservation|missouri\s+conservation|bennett\s+spring|roaring\s+river|maramec\s+spring|montauk|trout\s+park|missouri\s+ozarks|ozark\s+(highlands|trail)|ozark\s+(national\s+)?(scenic\s+)?(riverway|forest)|whiteman\s+(afb|air\s+force))\b/i;
const MO_OUTDOOR_AUTH_SOURCES = new Set(["MDC News","MDC Hunting","MDC Fishing","USACE Truman Lake","USACE Stockton Lake","USACE Pomme de Terre"]);
const MO_OUTDOOR_GN_SOURCES = new Set(["Truman Lake Fishing","Missouri Fishing","MO Hunting","MO Trout / Stream","MO Conservation Areas","MO Public Lands","CWD Missouri","Game & Fish MO","Lake of the Ozarks Fishing","Bagnell Dam / Ameren","KRMS Lake News","MO State Parks"]);
const USACE_DISTRICT_OUTDOOR = new Set(["USACE Kansas City","USACE District Lakes","USACE Recreation"]);

function outdoorRelevance(item) {
  const text = (item.title + " " + (item.description || "")).toLowerCase();
  if (MO_OUTDOOR_AUTH_SOURCES.has(item.source)) return 8;
  if (USACE_DISTRICT_OUTDOOR.has(item.source)) return USACE_TRUMAN_RE.test(text) ? 7 : 3;
  if (MO_OUTDOOR_GN_SOURCES.has(item.source)) {
    if (MO_HOMETURF_RE.test(text)) return 7;
    if (MO_GENERAL_RE.test(text))  return 5;
    return 2;
  }
  if (MO_HOMETURF_RE.test(text)) return 6;
  if (MO_GENERAL_RE.test(text))  return 3;
  return 0;
}

// Cross-source trending: count how many distinct sources share overlapping title words
function wordSet(title) {
  const stop = new Set(["the","a","an","in","of","to","and","is","for","on","at","by","with","as","from","are","was","his","her","its","it","says","say","after","over"]);
  return new Set(title.toLowerCase().split(/\W+/).filter(w => w.length > 3 && !stop.has(w)));
}
function markTrending(items) {
  const sets = items.map(i => wordSet(i.title));
  items.forEach((item, i) => {
    let matches = 0;
    const seenSources = new Set([item.source]);
    sets.forEach((s, j) => {
      if (i === j) return;
      if (seenSources.has(items[j].source)) return;
      const inter = [...sets[i]].filter(w => s.has(w));
      if (inter.length / Math.max(sets[i].size, s.size, 1) >= 0.38) {
        matches++;
        seenSources.add(items[j].source);
      }
    });
    item.trending = matches >= 2;
  });
}

// ========== READ / BOOKMARK ==========
const READ_TTL = 48 * 3600000; // dim read items for 48h
function getReads() { try { return JSON.parse(localStorage.getItem("news.reads")||"{}"); } catch { return {}; } }
function markRead(url) {
  const reads = getReads();
  reads[url] = Date.now();
  // Prune old reads
  Object.keys(reads).forEach(k => { if (Date.now() - reads[k] > READ_TTL) delete reads[k]; });
  try { localStorage.setItem("news.reads", JSON.stringify(reads)); } catch {}
}
function isRead(url) { const r = getReads(); return r[url] && (Date.now() - r[url]) < READ_TTL; }

function getSaved() { try { return JSON.parse(localStorage.getItem("news.saved")||"[]"); } catch { return []; } }
function toggleSave(item) {
  let saved = getSaved();
  const idx = saved.findIndex(s => s.link === item.link);
  if (idx >= 0) { saved.splice(idx, 1); }
  else { saved.unshift({ title:item.title, link:item.link, source:item.source, pubDate:item.pubDate, description:item.description, thumbnail:item.thumbnail }); }
  try { localStorage.setItem("news.saved", JSON.stringify(saved.slice(0, 200))); } catch {}
  return idx < 0; // returns true if now saved
}
function isSaved(url) { return getSaved().some(s => s.link === url); }

async function fetchNWSAlerts() {
  const cacheKey = "news.nws.alerts";
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const p = JSON.parse(cached);
      if (Date.now() - p.ts < ALERTS_CACHE_TTL_MS) { renderAlerts(p.data); return; }
    }
  } catch {}
  try {
    const res = await fetchWithTimeout(
      "https://api.weather.gov/alerts/active?point=" + WEATHER_LOCATION.lat + "," + WEATHER_LOCATION.lon, 6000
    );
    if (!res.ok) throw new Error("NWS HTTP " + res.status);
    const data = await res.json();
    const alerts = (data.features||[]).map(f => ({
      event: f.properties.event || "",
      headline: f.properties.headline || f.properties.description || "",
      severity: (f.properties.severity||"").toLowerCase(),
      url: f.properties["@id"] || ""
    }));
    try { localStorage.setItem(cacheKey, JSON.stringify({ ts:Date.now(), data:alerts })); } catch {}
    renderAlerts(alerts);
  } catch(e) { console.warn("NWS alerts:", e); }
}
function severityClass(sev) {
  if (sev==="extreme") return "extreme"; if (sev==="severe") return "severe";
  if (sev==="moderate") return "moderate"; return "minor";
}
function severityIcon(sev) {
  if (sev==="extreme"||sev==="severe") return "🚨";
  if (sev==="moderate") return "⚠️"; return "ℹ️";
}
function renderAlerts(alerts) {
  if (!alerts||!alerts.length) { alertBannerEl.classList.remove("has-alerts"); alertBannerEl.innerHTML=""; return; }
  alertBannerEl.classList.add("has-alerts");
  alertBannerEl.innerHTML = alerts.map(a =>
    '<div class="alert-item '+severityClass(a.severity)+'">' +
      '<span class="alert-icon">'+severityIcon(a.severity)+'</span>' +
      '<div class="alert-body">' +
        '<div class="alert-event">'+escapeHtml(a.event)+' — Clinton, MO</div>' +
        '<div class="alert-headline">'+escapeHtml((a.headline||"").slice(0,180))+'</div>' +
      '</div>' +
      (a.url?'<a class="alert-link" href="'+escapeHtml(a.url)+'" target="_blank" rel="noopener">Details →</a>':'') +
    '</div>'
  ).join("");
}

const WEATHER_CODE_MAP = {
  0:["Clear","☀️"],1:["Mostly Clear","🌤️"],2:["Partly Cloudy","⛅"],3:["Overcast","☁️"],
  45:["Fog","🌫️"],48:["Icy Fog","🌫️"],

  61:["Light Rain","🌧️"],63:["Rain","🌧️"],65:["Heavy Rain","🌧️"],
  66:["Freezing Rain","🌧️"],67:["Freezing Rain","🌧️"],
  71:["Light Snow","🌨️"],73:["Snow","🌨️"],75:["Heavy Snow","❄️"],77:["Snow Grains","🌨️"],
  80:["Rain Showers","🌦️"],81:["Rain Showers","🌧️"],82:["Heavy Showers","⛈️"],
  85:["Snow Showers","🌨️"],86:["Heavy Snow Showers","❄️"],
  95:["Thunderstorm","⛈️"],96:["Thunderstorm + Hail","⛈️"],99:["Severe Thunderstorm","⛈️"]
};
// Normal pool elevation for Truman Lake = 706.0 ft NGVD
const TRUMAN_NORMAL_POOL = 706.0;
// Bumped to v2 so old contaminated readings (raw stage values from before the
// gauge switch — e.g. 28.8 ft instead of 715 ft) get discarded. The trend
// calculation comparing current to those old values produced false "rising" labels.
const TRUMAN_READINGS_KEY = "news.truman.history.v2";

async function fetchTrumanLake() {
  // Truman pool elevation under any conditions: 690-745 ft NGVD.
  // Normal pool = 706.0, flood pool max = 739.6.
  const isValidPoolElevation = v => isFinite(v) && v >= 690 && v <= 745;

  // findHoursAgo: from a {value, time}[] series, return the reading closest to N hours ago,
  // or null if no reading is within ±4 hours of the target.
  const findHoursAgo = (series, hoursAgo) => {
    if (!series || !series.length) return null;
    const target = Date.now() - hoursAgo * 3600000;
    let best = null, bestDelta = Infinity;
    for (const r of series) {
      const t = new Date(r.time).getTime();
      if (!isFinite(t)) continue;
      const d = Math.abs(t - target);
      if (d < bestDelta) { best = r; bestDelta = d; }
    }
    if (!best || bestDelta > 4 * 3600000) return null;
    return best;
  };

  let stage = null, time = null, source = null, dayAgo = null, isElevation = false;
  let inflow = null, outflow = null;

  // 1) PRIMARY: USGS gauge 06922440 = "Harry S. Truman Dam and Res. at Warsaw, MO".
  //    Parameter 00062 = reservoir water surface elevation, NGVD ft (direct, no offset).
  //    Parameter 00060 = discharge (cfs), typically tailwater outflow.
  //    We route this through the Cloudflare worker proxy so it works regardless of origin
  //    (file://, GitHub Pages, anywhere). USGS sometimes returns empty/no-CORS responses
  //    when called directly from non-https origins, which broke direct fetches.
  // 00062 = NGVD elevation, 00065 = gage height (this gauge reports pool elev under 00065),
  // 00060 = discharge in cfs. Request all three so we pick up whichever the site publishes.
  const usgsUrl = "https://waterservices.usgs.gov/nwis/iv/?sites=06922440&parameterCd=00062,00065,00060&format=json&siteStatus=all&period=P2D";
  const usgsViaProxy = CF_WORKER + "?url=" + encodeURIComponent(usgsUrl);
  console.log("[lake] fetching USGS 06922440 via worker proxy");
  try {
    const res = await fetchWithTimeout(usgsViaProxy, 7000);
    if (res.ok) {
      const data = await res.json();
      const seriesList = data?.value?.timeSeries || [];
      console.log("[lake] USGS returned", seriesList.length, "parameter series");

      for (const ts of seriesList) {
        const paramCode = ts.variable?.variableCode?.[0]?.value || "";
        const paramName = ts.variable?.variableName || "";
        const vals = ts.values?.[0]?.value || [];
        if (!vals.length) continue;

        const numeric = vals
          .filter(v => v.value && v.value !== "-999999" && isFinite(parseFloat(v.value)))
          .map(v => ({ value: parseFloat(v.value), time: v.dateTime }));
        if (!numeric.length) continue;
        const last = numeric[numeric.length - 1];

        console.log("[lake] param", paramCode, "(" + paramName.slice(0,60) + "): last value =", last.value);

        // Accept either 00062 (NGVD elevation) or 00065 (gage height) — for the Truman
        // Dam gauge, USGS reports pool elevation under the gage height parameter, but the
        // VALUE is real NGVD pool elevation (verified against the USACE page). The validity
        // range check (690-745 ft) ensures we don't accidentally accept a relative stage.
        if ((paramCode === "00062" || paramCode === "00065") && isValidPoolElevation(last.value)) {
          // Pool elevation in NGVD ft — what the bite meter and weather bar display.
          stage = last.value; time = last.time;
          source = "USGS 06922440 (" + paramCode + ")";
          isElevation = true;
          dayAgo = findHoursAgo(numeric, 24);
        } else if (paramCode === "00060" && isFinite(last.value)) {
          // Discharge (cfs). On a dam gauge this is typically the outflow / release.
          outflow = Math.round(last.value);
        }
      }
    } else {
      console.warn("[lake] USGS HTTP", res.status);
    }
  } catch(e) { console.warn("[lake] USGS error:", e); }

  // 2) ALWAYS try the worker /lake endpoint — it hits the USACE CDA API server-side
  //    and supplies inflow/outflow that USGS doesn't publish. If USGS missed elevation
  //    too, the worker can fill that in. Run in addition to (not instead of) USGS.
  //    The worker chains catalog discovery + 3 timeseries fetches → can take 6-10s on
  //    a cold cache, so use a generous timeout here.
  try {
    const res = await fetchWithTimeout(CF_WORKER.replace(/\/$/, "") + "/lake", 12000);
    if (res.ok) {
      const data = await res.json();
      console.log("[lake] worker /lake returned:", data);
      if (stage === null && data && isValidPoolElevation(data.elevation)) {
        stage = data.elevation;
        source = (data.source || "USACE NWK");
        isElevation = true;
        time = data.fetched_at || data.timestamp || null;
      }
      // Always pull inflow/outflow from the worker — USGS doesn't publish inflow at all,
      // and even when it has discharge it's tailwater (post-dam), not reservoir outflow.
      if (Number.isFinite(data?.inflow))  inflow  = data.inflow;
      if (Number.isFinite(data?.outflow)) outflow = data.outflow;
    }
  } catch(e) { console.warn("[lake] worker /lake error:", e); }

  if (stage === null) return null;

  // Maintain rolling history (48h) for fine-grained 3-hour trend. We filter every
  // reading to the valid pool-elevation range (690-745 ft) so any leftover bad data
  // from older code can't poison the trend calculation.
  let history = [];
  try { history = JSON.parse(localStorage.getItem(TRUMAN_READINGS_KEY) || "[]"); } catch {}
  history = history.filter(r => isValidPoolElevation(r.stage) && Date.now() - r.ts < 48 * 3600000);
  history.push({ stage, ts: Date.now() });
  history = history.slice(-100);
  try { localStorage.setItem(TRUMAN_READINGS_KEY, JSON.stringify(history)); } catch {}

  // 3-hour trend from rolling history. If history is too thin to be trustworthy,
  // we'll override below with the API's 24h direction (more reliable).
  let trend = "stable", trendDiff = 0;
  const threeHoursAgo = Date.now() - 3 * 3600000;
  const old3hr = [...history].reverse().find(r => r.ts <= threeHoursAgo && isValidPoolElevation(r.stage));
  if (old3hr) {
    trendDiff = stage - old3hr.stage;
    if (trendDiff > 0.05) trend = "rising";
    else if (trendDiff < -0.05) trend = "falling";
  }

  // 24-hour change — prefer the API's actual 24h-ago reading; fall back to rolling history
  let dailyChange = null;
  if (dayAgo && isFinite(dayAgo.value) && isValidPoolElevation(dayAgo.value)) {
    dailyChange = stage - dayAgo.value;
  } else {
    const oneDayAgo = Date.now() - 24 * 3600000;
    const old24 = [...history].reverse().find(r => r.ts <= oneDayAgo && isValidPoolElevation(r.stage));
    if (old24) dailyChange = stage - old24.stage;
  }

  // Sanity-check trend against dailyChange. If rolling history says one direction
  // but the API's 24h delta says the opposite, trust the 24h delta — that data comes
  // straight from USGS rather than potentially-stale localStorage.
  if (dailyChange !== null && isFinite(dailyChange)) {
    const apiTrend = dailyChange > 0.1 ? "rising" : dailyChange < -0.1 ? "falling" : null;
    if (apiTrend && trend !== "stable" && trend !== apiTrend) {
      console.log("[lake] trend conflict — rolling history said", trend, "but 24h delta says", apiTrend, "→ using 24h delta");
      trend = apiTrend;
    } else if (!old3hr && apiTrend) {
      // No 3hr history yet — derive trend from 24h direction
      trend = apiTrend;
    }
  }

  const aboveBelow = isElevation ? (stage - TRUMAN_NORMAL_POOL).toFixed(1) : null;

  console.log("[lake] returning stage =", stage, "ft (source: " + source + ")");

  return {
    stage, time, source, trend,
    trendDiff: Math.abs(trendDiff).toFixed(2),
    dailyChange: dailyChange !== null ? parseFloat(dailyChange.toFixed(2)) : null,
    inflow,
    outflow,
    isElevation,
    aboveBelow
  };
}
async function loadWeather(force) {
  // Bumped cache keys to v2 so old cached values (e.g. raw TUMM7 stage 28.8 ft
  // from the pre-datum-offset code) are automatically invalidated.
  const cacheKey="news.weather.v2", lakeCacheKey="news.truman.v2";
  let data, lake;
  if (!force) {
    try { const p=JSON.parse(localStorage.getItem(cacheKey)||"null"); if(p&&Date.now()-p.ts<WEATHER_CACHE_TTL_MS) data=p.data; } catch {}
    try { const p=JSON.parse(localStorage.getItem(lakeCacheKey)||"null"); if(p&&Date.now()-p.ts<WEATHER_CACHE_TTL_MS) lake=p.data; } catch {}
  }
  if (data && lake!==undefined) { renderWeather(data, lake); return; }
  weatherEl.className="weather loading";
  weatherEl.innerHTML='<span class="spinner"></span><span>Loading weather…</span>';
  const url = "https://api.open-meteo.com/v1/forecast?latitude="+WEATHER_LOCATION.lat+"&longitude="+WEATHER_LOCATION.lon+
    "&current=temperature_2m,weather_code,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m" +
    "&hourly=wind_direction_10m,wind_speed_10m" +
    "&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max" +
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone="+encodeURIComponent(WEATHER_LOCATION.tz)+"&forecast_days=3&past_days=1";
  try {
    const [wRes, lakeData] = await Promise.all([fetchWithTimeout(url, FEED_TIMEOUT_MS), fetchTrumanLake()]);
    if (!wRes.ok) throw new Error("HTTP "+wRes.status);
    data = await wRes.json(); lake = lakeData;
    try { localStorage.setItem(cacheKey, JSON.stringify({ts:Date.now(),data})); } catch {}
    try { localStorage.setItem(lakeCacheKey, JSON.stringify({ts:Date.now(),data:lake})); } catch {}
    renderWeather(data, lake);
  } catch(err) {
    console.warn("Weather:", err);
    weatherEl.className="weather";
    weatherEl.innerHTML='<div class="w-current"><span class="w-icon">⚠️</span><span>Weather unavailable · '+WEATHER_LOCATION.name+'</span></div>';
  }
}
function dayLabel(dateStr, displayIdx) {
  // displayIdx is the position in the rendered forecast: 0 = today, 1 = tomorrow, 2 = day after.
  // dateStr is the actual ISO date for that day from Open-Meteo (already shifted to today by the
  // caller, which finds today's index in d.time before iterating). So we can label directly.
  if (displayIdx===0) return "Today";
  if (displayIdx===1) return "Tomorrow";
  try { return new Date(dateStr+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"}); } catch { return ""; }
}

// Find today's index inside the Open-Meteo daily.time array. Because we request past_days=1,
// d.time[0] is yesterday — so we have to skip past it to land on the actual current day.
function findTodayIndex(times, tz) {
  if (!times || !times.length) return 0;
  // en-CA gives YYYY-MM-DD, which matches Open-Meteo's date format.
  const todayStr = new Date().toLocaleDateString("en-CA", { timeZone: tz });
  const idx = times.indexOf(todayStr);
  return idx >= 0 ? idx : 0;
}

// ========== NEWS FEEDS ==========
function parseXmlFeed(xmlText, source) {
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.querySelector("parsererror")) return [];
  const isAtom = doc.documentElement.nodeName.toLowerCase()==="feed";
  const entries = Array.from(doc.querySelectorAll(isAtom?"entry":"item"));
  // Sort newest-first before slicing so PER_FEED_LIMIT keeps the most recent articles,
  // not whatever order the feed happened to use (Google News uses relevance, not date).
  entries.sort((a, b) => {
    const getTs = el => { const n=el.querySelector("pubDate,published,updated"); return n?new Date(n.textContent.trim()).getTime():0; };
    return getTs(b) - getTs(a);
  });
  return entries.slice(0, PER_FEED_LIMIT).map(el => {
    const get = sel => { const n=el.querySelector(sel); return n?n.textContent.trim():""; };
    let link="";
    if (isAtom) {
      const a = el.querySelector("link[rel='alternate']")||el.querySelector("link");
      link = a?(a.getAttribute("href")||a.textContent.trim()):"";
    } else { link=get("link"); }
    const title=get("title"), desc=get("description")||get("summary")||get("content");
    const pubStr=get("pubDate")||get("published")||get("updated");
    const enclosure=el.querySelector("enclosure[url]");
    return {
      title, link,
      description: stripHtml(desc).slice(0,240),
      pubDate: pubStr?new Date(pubStr).getTime():Date.now(),
      thumbnail: (enclosure?enclosure.getAttribute("url"):extractImg(desc))||"",
      source
    };
  }).filter(x=>x.title&&x.link);
}

async function fetchViaProxy(proxy, feed) {
  const res = await fetchWithTimeout(proxy.url(feed.url), FEED_TIMEOUT_MS);
  if (!res.ok) throw new Error(proxy.name+" HTTP "+res.status);
  if (proxy.parse==="json") {
    const data = await res.json();
    if (data.status!=="ok"||!Array.isArray(data.items)) throw new Error("bad rss2json");
    return data.items.slice(0,PER_FEED_LIMIT).map(it=>({
      title:(it.title||"").trim(), link:it.link,
      description: stripHtml(it.description||it.content||"").slice(0,240),
      pubDate: it.pubDate?new Date(it.pubDate).getTime():Date.now(),
      thumbnail: it.thumbnail||(it.enclosure&&it.enclosure.link)||extractImg(it.content||it.description)||"",
      source: feed.source
    })).filter(x=>x.title&&x.link);
  }
  if (proxy.parse==="allorigins") {
    const data = await res.json();
    if (!data.contents) throw new Error("empty allorigins");
    return parseXmlFeed(data.contents, feed.source);
  }
  if (proxy.parse==="xml") {
    const text = await res.text();
    if (!text || text.length < 50) throw new Error("empty xml response");
    return parseXmlFeed(text, feed.source);
  }
  throw new Error("unknown parse mode");
}

// Race both proxies simultaneously — use whichever responds first with valid data
async function fetchFeed(feed) {
  const cacheKey = "news.cache." + feed.url;
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try { const p=JSON.parse(cached); if(Date.now()-p.ts<CACHE_TTL_MS) return p.items; } catch {}
  }
  // Race all proxies — resolve on first success, ignore failures
  const items = await new Promise(resolve => {
    let settled = false, failed = 0;
    PROXIES.forEach(proxy => {
      fetchViaProxy(proxy, feed)
        .then(result => {
          if (!settled && result.length) {
            settled = true;
            try { localStorage.setItem(cacheKey, JSON.stringify({ts:Date.now(), items:result})); } catch {}
            resolve(result);
          } else if (!settled) {
            failed++;
            if (failed === PROXIES.length) resolve([]);
          }
        })
        .catch(() => {
          if (!settled) {
            failed++;
            if (failed === PROXIES.length) resolve([]);
          }
        });
    });
  });
  return items;
}

// ========== OUTDOOR / FISHING ADVISOR ==========
function getCachedWeather() {
  // Read from the v2 cache key so we match what loadWeather() writes — older code
  // looked at "news.weather" which no longer exists, leaving the fishing report
  // bite meter without temp/wind values.
  try { const p=JSON.parse(localStorage.getItem("news.weather.v2")||"null"); return (p&&p.data)?p.data:null; } catch { return null; }
}

// ── WIND HELPERS ──
// Convert wind direction in degrees (0=N, 90=E, 180=S, 270=W) into a 16-point compass label.
function compassFromDegrees(deg) {
  if (!isFinite(deg)) return "—";
  const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return dirs[Math.floor(((deg % 360) / 22.5) + 0.5) % 16];
}

// Walk back through hourly wind direction data and count how many consecutive hours
// the wind has been within ±30° of the current direction. This is "sustained hours".
function computeSustainedWindHours(hourly, currentDir) {
  if (!hourly || !hourly.time || !hourly.wind_direction_10m || !isFinite(currentDir)) return 0;
  const times = hourly.time;
  const dirs  = hourly.wind_direction_10m;
  const now = Date.now();
  // Find the index of the most recent past hour
  let nowIdx = -1;
  for (let i = 0; i < times.length; i++) {
    const t = new Date(times[i]).getTime();
    if (!isFinite(t)) continue;
    if (t <= now) nowIdx = i;
    else break;
  }
  if (nowIdx < 0) return 0;
  // Walk back; stop when direction diverges by more than 30°
  let hours = 0;
  for (let i = nowIdx; i >= 0; i--) {
    const d = dirs[i];
    if (!isFinite(d)) break;
    // Compute angular difference (always 0-180)
    const diff = Math.abs(((d - currentDir + 540) % 360) - 180);
    if (diff > 30) break;
    hours++;
  }
  return hours;
}

// Translate current wind direction + sustained duration + speed into a Grand-arm-specific
// shad bank recommendation. The Grand River arm runs roughly NW–SE; Sparrowfoot Park sits
// on the south shore near the upper (NW) end. So a north wind pushes shad onto Sparrowfoot's
// shore, a south wind pushes them across to the opposite bank, and so on.
function shadBankAdvice(windDir, windMph, sustainedHours) {
  if (!isFinite(windDir) || !isFinite(windMph) || windMph < 5) return null;
  const fromDir = compassFromDegrees(windDir);

  let bankSide, sparrowfootNote;
  if (windDir >= 315 || windDir < 45) {
    bankSide = "south-facing banks of the Grand arm";
    sparrowfootNote = "that's Sparrowfoot's side — walk the south shoreline and look for shad piled tight against the bank.";
  } else if (windDir >= 45 && windDir < 135) {
    bankSide = "west-facing banks (upper Grand arm)";
    sparrowfootNote = "Sparrowfoot's west coves are getting fetch — bait piles up in the back of those coves.";
  } else if (windDir >= 135 && windDir < 225) {
    bankSide = "north-facing banks of the Grand arm";
    sparrowfootNote = "Sparrowfoot's south shore will be slack — by boat, run across to the north bank; from shore, drive around to the opposite shoreline.";
  } else {
    bankSide = "east-facing banks (lower Grand arm)";
    sparrowfootNote = "wind is pushing bait DOWN the arm — head east toward the lower cuts and points by boat.";
  }

  let strength;
  if (sustainedHours >= 6 && windMph >= 12) {
    strength = "stacked tight — best cast-netting window of the day, hit it now";
  } else if (sustainedHours >= 4 && windMph >= 8) {
    strength = "concentrated and tightening";
  } else if (sustainedHours >= 2) {
    strength = "starting to pile up";
  } else {
    strength = "just starting to push — give it another hour or two to fully concentrate";
  }

  return "Wind from "+fromDir+" at "+Math.round(windMph)+" mph for "+sustainedHours+"h — shad "+strength+" on "+bankSide+". "+sparrowfootNote;
}

// MOON PHASE, SOLUNAR, BARO TREND, WATER TEMP, TRIP LOG

function getMoonPhase(date) {
  // Known new moon: Jan 6, 2000 18:14 UTC — accurate enough for fishing purposes
  const knownNewMoon = new Date("2000-01-06T18:14:00Z").getTime();
  const lunarCycle   = 29.530588853 * 86400000; // ms
  const ageMs = ((date.getTime() - knownNewMoon) % lunarCycle + lunarCycle) % lunarCycle;
  const age   = ageMs / 86400000; // days (0 = new moon)
  const phase = age / 29.530588853; // 0–1
  const illumination = Math.round((1 - Math.cos(2 * Math.PI * phase)) / 2 * 100);
  let phaseName, emoji;
  if      (age <  1.85) { phaseName = "New Moon";        emoji = "🌑"; }
  else if (age <  7.38) { phaseName = "Waxing Crescent"; emoji = "🌒"; }
  else if (age <  9.22) { phaseName = "First Quarter";   emoji = "🌓"; }
  else if (age < 14.77) { phaseName = "Waxing Gibbous";  emoji = "🌔"; }
  else if (age < 16.61) { phaseName = "Full Moon";       emoji = "🌕"; }
  else if (age < 22.15) { phaseName = "Waning Gibbous";  emoji = "🌖"; }
  else if (age < 23.99) { phaseName = "Last Quarter";    emoji = "🌗"; }
  else                  { phaseName = "Waning Crescent";  emoji = "🌘"; }
  return { age, phase, illumination, phaseName, emoji };
}

function getSolunarTimes(date) {
  // Moon transits meridian ~50 min later each day vs solar noon.
  // New moon (age 0) ≈ noon local; Full moon (age 14.77) ≈ midnight.
  const { age } = getMoonPhase(date);
  const transitMin = (12 * 60 + age * 50) % 1440; // minutes from midnight local
  const fmt = mins => {
    const m = ((Math.round(mins) % 1440) + 1440) % 1440;
    const h = Math.floor(m / 60), mn = m % 60;
    const ap = h < 12 ? "AM" : "PM";
    return `${h === 0 ? 12 : h > 12 ? h - 12 : h}:${String(mn).padStart(2,"0")} ${ap}`;
  };
  const win = (peak, dur) => `${fmt(peak - dur/2)} – ${fmt(peak + dur/2)}`;
  return {
    major1: { label: "Moon Overhead",   window: win(transitMin,       120), peak: fmt(transitMin) },
    major2: { label: "Moon Underfoot",  window: win(transitMin + 720, 120), peak: fmt(transitMin + 720) },
    minor1: { label: "Moonrise",        window: win(transitMin - 360,  60), peak: fmt(transitMin - 360) },
    minor2: { label: "Moonset",         window: win(transitMin + 360,  60), peak: fmt(transitMin + 360) }
  };
}

function getBaroTrend() {
  const weather = getCachedWeather();
  if (!weather?.hourly?.surface_pressure || !weather?.hourly?.time) return null;
  const times = weather.hourly.time, pressures = weather.hourly.surface_pressure;
  const now = Date.now();
  const recent = [];
  for (let i = 0; i < times.length; i++) {
    const t = new Date(times[i]).getTime();
    const ageH = (now - t) / 3600000;
    if (ageH >= 0 && ageH <= 6 && pressures[i] != null) recent.push({ t, p: pressures[i] });
  }
  if (recent.length < 2) return null;
  recent.sort((a, b) => a.t - b.t);
  const change = recent[recent.length - 1].p - recent[0].p;
  const current = recent[recent.length - 1].p;
  let trend, desc, color;
  if      (change < -2)   { trend = "falling fast"; desc = "Sharp pressure drop — fish often go deep and shut down. Work slower and deeper."; color = "var(--accent-red,#e87)"; }
  else if (change < -0.5) { trend = "falling";      desc = "Pressure easing down — bite may slow, especially for crappie. Keep moving."; color = "#fa3"; }
  else if (change >  2)   { trend = "rising fast";  desc = "Pressure climbing hard — post-frontal feed-up window, often excellent for blues."; color = "var(--sage,#6a9)"; }
  else if (change >  0.5) { trend = "rising";       desc = "Pressure building — fish becoming more active. Good conditions."; color = "var(--sage,#6a9)"; }
  else                    { trend = "steady";        desc = "Stable pressure — normal feeding patterns, no pressure-related disruption."; color = "var(--text-soft)"; }
  return { pressure: current.toFixed(1), change: change.toFixed(1), trend, desc, color };
}

// Get forecast weather values (temp, condition, wind) for a specific target hour from cached hourly data
function getForecastAtTime(targetDate) {
  const weather = getCachedWeather();
  if (!weather?.hourly?.time) return null;
  const target = targetDate.getTime();
  const times  = weather.hourly.time;
  let bestIdx = -1, bestDiff = Infinity;
  for (let i = 0; i < times.length; i++) {
    const diff = Math.abs(new Date(times[i]).getTime() - target);
    if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
  }
  if (bestIdx === -1 || bestDiff > 6 * 3600000) return null;
  const h = weather.hourly;
  return {
    temp:      h.temperature_2m?.[bestIdx] ?? null,
    feels:     h.apparent_temperature?.[bestIdx] ?? null,
    humidity:  h.relative_humidity_2m?.[bestIdx] ?? null,
    windSpeed: h.wind_speed_10m?.[bestIdx] ?? null,
    windDir:   h.wind_direction_10m?.[bestIdx] ?? null,
    pressure:  h.surface_pressure?.[bestIdx] ?? null,
    code:      h.weather_code?.[bestIdx] ?? null
  };
}

const WATERTEMP_ENDPOINT = CF_WORKER.replace(/\/$/, "") + "/watertemp";
const WATERTEMP_CACHE_KEY = "news.fishing.watertemp.v2";

async function fetchWaterTemp() {
  // Try worker scrape of LakeMonster first (cached 3h server-side)
  // Falls back to manually entered value in localStorage
  try {
    const res = await fetch(WATERTEMP_ENDPOINT);
    if (res.ok) {
      const data = await res.json();
      if (isFinite(data.tempF)) {
        // Cache locally too so it survives brief worker hiccups
        try { localStorage.setItem(WATERTEMP_CACHE_KEY, JSON.stringify({ temp: data.tempF, ts: Date.now(), source: "lakemonster" })); } catch {}
        return data.tempF;
      }
    }
  } catch {}
  // Fall back to localStorage (manual entry or last good scrape)
  try {
    const raw = localStorage.getItem(WATERTEMP_CACHE_KEY) || localStorage.getItem("news.fishing.watertemp");
    if (!raw) return null;
    const { temp, ts } = JSON.parse(raw);
    if (Date.now() - ts > 7 * 86400000) return null; // expire after 7 days
    return isFinite(temp) ? temp : null;
  } catch { return null; }
}

const TRIP_LOG_KEY = "news.fishing.log.v1";
function getTripLog() {
  try { return JSON.parse(localStorage.getItem(TRIP_LOG_KEY) || "[]"); } catch { return []; }
}
function saveTripLog(entries) {
  try { localStorage.setItem(TRIP_LOG_KEY, JSON.stringify(entries.slice(-50))); } catch {} // keep last 50
}
function addTripEntry(entry) {
  const log = getTripLog();
  log.push({ ...entry, id: Date.now() });
  saveTripLog(log);
}
function deleteTripEntry(id) {
  saveTripLog(getTripLog().filter(e => e.id !== id));
}
