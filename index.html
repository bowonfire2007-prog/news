<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<title>Matt's Daily Read</title>
<style>
  :root { --bg:#f8f4ec; --text:#1a1410; --text-muted:#6b6258; --text-soft:#9a9286; --border:#e3ddcf; --accent:#b8331a; --sage:#7a8b6f; --mustard:#c49b3f; --card-hover:#ede8dc; }
  [data-theme="dark"] { --bg:#0f0e0d; --text:#f5f1e8; --text-muted:#a39c8f; --text-soft:#6b6258; --border:#2a2825; --accent:#ff6b4a; --sage:#9ab18d; --mustard:#e0b552; --card-hover:#1c1b19; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background-color .25s ease,color .25s ease; }
  a { color:inherit; text-decoration:none; }

  /* ── ALERT BANNER ── */
  #alertBanner { width:100%; display:none; flex-direction:column; gap:0; }
  #alertBanner.has-alerts { display:flex; }
  .alert-item { padding:10px 20px; display:flex; align-items:flex-start; gap:10px; font-size:13px; line-height:1.4; color:#fff; }
  .alert-item.extreme  { background:#7f1d1d; }
  .alert-item.severe   { background:#92400e; }
  .alert-item.moderate { background:#1e3a5f; }
  .alert-item.minor    { background:#374151; }
  .alert-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
  .alert-body { flex:1; min-width:0; }
  .alert-event { font-weight:700; letter-spacing:0.02em; }
  .alert-headline { opacity:.9; margin-top:2px; }
  .alert-link { color:#fff; text-decoration:underline; white-space:nowrap; font-weight:600; margin-left:8px; flex-shrink:0; }

  /* ── DRAWER ── */
  .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .drawer-overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; left:0; bottom:0; width:min(300px,85vw); background:var(--bg); border-right:1px solid var(--border); z-index:60; transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; overflow:hidden; }
  .drawer.open { transform:translateX(0); }
  .drawer-header { padding:20px 20px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); flex-shrink:0; }
  .drawer-brand { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; letter-spacing:-0.01em; }
  .drawer-brand span { color:var(--accent); }
  .drawer-close { width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .drawer-close:hover { background:var(--card-hover); color:var(--text); }
  .drawer-list { flex:1; overflow-y:auto; padding:10px 0; }
  .drawer-item { display:flex; align-items:center; gap:12px; padding:12px 20px; cursor:pointer; font-size:15px; font-weight:500; color:var(--text-muted); border-left:3px solid transparent; transition:background .15s,color .15s; }
  .drawer-item:hover { background:var(--card-hover); color:var(--text); }
  .drawer-item.active { color:var(--accent); border-left-color:var(--accent); background:var(--card-hover); font-weight:700; }
  .drawer-item-icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }

  /* ── HEADER ── */
  header { position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--bg) 90%,transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--border); padding:max(env(safe-area-inset-top),12px) 20px 0; }
  .header-row { max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; }
  .brand { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:22px; font-weight:700; letter-spacing:-0.01em; }
  .brand span { color:var(--accent); }
  .header-actions { display:flex; align-items:center; gap:5px; }
  .icon-btn { width:36px; height:36px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--border); color:var(--text); cursor:pointer; flex-shrink:0; }
  .icon-btn:hover { background:var(--card-hover); }
  .icon-btn svg { width:17px; height:17px; }
  .font-btn { height:28px; padding:0 9px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:11px; font-weight:700; font-family:inherit; line-height:1; }
  .font-btn:hover { background:var(--card-hover); color:var(--text); }

  /* ── SEARCH ── */
  .search-wrap { max-width:760px; margin:0 auto; overflow:hidden; max-height:0; opacity:0; transition:max-height .2s ease,opacity .2s ease; }
  .search-wrap.open { max-height:52px; opacity:1; }
  .search-inner { display:flex; gap:8px; padding-bottom:10px; }
  .search-input { flex:1; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card-hover); color:var(--text); font-size:14px; outline:none; font-family:inherit; }
  .search-input:focus { border-color:var(--accent); }
  .search-clear { width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  /* ── WEATHER ── */
  .weather { max-width:760px; margin:0 auto 2px; padding:10px 0; display:flex; flex-direction:column; gap:8px; font-size:14px; }
  .weather.loading { opacity:0.5; }
  .w-current { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .w-temp { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .w-icon { font-size:22px; }
  .w-cond { color:var(--text); font-weight:500; }
  .w-sep { color:var(--text-soft); }
  .w-meta { color:var(--text-muted); font-size:12px; margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .w-meta span { white-space:nowrap; }
  .w-forecast { display:flex; align-items:center; gap:10px; padding-top:6px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted); flex-wrap:wrap; }
  .w-day { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .w-day-name { color:var(--text); font-weight:600; }
  .w-radar { margin-left:auto; color:var(--accent); font-weight:600; white-space:nowrap; text-decoration:none; }
  .w-radar:hover { text-decoration:underline; }
  .w-lake { display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 8px; background:color-mix(in srgb,var(--accent) 12%,transparent); border-radius:999px; font-weight:700; color:var(--accent); font-size:13px; white-space:nowrap; text-decoration:none; }
  .w-lake:hover { text-decoration:underline; }

  /* ── QUOTE OF DAY ── */
  .quote-bar { max-width:760px; margin:0 auto; padding:12px 0 12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:6px; position:relative; }
  .quote-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.16em; color:var(--accent); margin-bottom:5px; display:flex; align-items:center; gap:8px; }
  .quote-label::before, .quote-label::after { content:""; flex:1; height:1px; background:color-mix(in srgb,var(--accent) 30%,transparent); }
  .quote-text { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:15px; color:var(--text); font-style:italic; line-height:1.55; text-align:center; padding:0 8px; }
  .quote-author { font-size:10px; color:var(--text-soft); margin-top:7px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; text-align:center; }
  @media (max-width:520px) { .quote-text { font-size:14px; } }

  /* ── SECTION BAR ── */
  .section-bar { max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:8px 0 4px; }
  .section-left { display:flex; align-items:center; gap:8px; }
  .section-label { font-size:13px; font-weight:700; color:var(--text); letter-spacing:0.02em; text-transform:uppercase; }
  .new-pill { font-size:10px; font-weight:700; color:var(--accent); background:color-mix(in srgb,var(--accent) 13%,transparent); padding:2px 7px; border-radius:999px; white-space:nowrap; }
  .section-menu-btn { font-size:13px; font-weight:600; color:var(--accent); background:transparent; border:none; cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:5px; }
  .section-menu-btn svg { width:14px; height:14px; }

  /* ── QUICK TABS ── */
  .quick-tabs { max-width:760px; margin:0 auto; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; display:flex; gap:7px; padding:5px 0 10px; }
  .quick-tabs::-webkit-scrollbar { display:none; }
  .qtab { flex-shrink:0; padding:5px 13px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .12s,color .12s,border-color .12s; }
  .qtab:hover { background:var(--card-hover); color:var(--text); }
  .qtab.active { background:var(--text); color:var(--bg); border-color:var(--text); font-weight:600; }

  /* ── MAIN ── */
  main { max-width:760px; margin:0 auto; padding:8px 20px max(env(safe-area-inset-bottom),40px); }
  .status { padding:40px 20px; text-align:center; color:var(--text-muted); font-size:14px; line-height:1.6; }
  .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes shimmer { 0%{opacity:.35} 50%{opacity:.7} 100%{opacity:.35} }

  /* ── SKELETON ── */
  .skel { display:flex; gap:16px; padding:20px 0; border-bottom:1px solid var(--border); }
  .skel-body { flex:1; display:flex; flex-direction:column; gap:7px; padding-top:4px; }
  .skel-line { background:var(--card-hover); border-radius:4px; animation:shimmer 1.5s ease-in-out infinite; }
  .skel-line.s1 { height:11px; width:38%; }
  .skel-line.s2 { height:19px; width:94%; }
  .skel-line.s3 { height:19px; width:72%; }
  .skel-line.s4 { height:13px; width:88%; }
  .skel-line.s5 { height:13px; width:60%; }
  .skel-img { width:110px; height:110px; flex-shrink:0; border-radius:8px; background:var(--card-hover); animation:shimmer 1.5s ease-in-out infinite; }

  /* ── NEWS ITEMS ── */
  .item-wrap { border-bottom:1px solid var(--border); }
  article.item { display:flex; gap:16px; padding:20px 0 14px; cursor:pointer; position:relative; }
  article.item:hover .title { color:var(--accent); }
  article.item.read { opacity:0.52; }
  article.item.read:hover { opacity:0.82; }
  article.item.kb-focus { outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }

  /* ── AI BRIEF ── */
  .brief-btn { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border)); background:color-mix(in srgb,var(--accent) 7%,transparent); color:var(--accent); font-size:11px; font-weight:700; letter-spacing:0.04em; cursor:pointer; font-family:inherit; text-transform:uppercase; transition:background .12s,color .12s; }
  .brief-btn:hover { background:var(--accent); color:#fff; }
  .brief-btn.is-loading { pointer-events:none; opacity:0.7; }
  .brief-btn.is-open { background:var(--accent); color:#fff; }
  .brief-btn .spark { font-size:10px; line-height:1; }
  .brief-panel { margin:0 0 14px; padding:0 16px; max-height:0; overflow:hidden; transition:max-height .25s ease, padding .2s ease; background:color-mix(in srgb,var(--accent) 4%,var(--card-hover)); border-left:3px solid var(--accent); border-radius:0 6px 6px 0; }
  .brief-panel.open { max-height:1000px; padding:14px 16px; margin:0 0 18px; }
  .brief-header { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); margin-bottom:8px; }
  .brief-loading { display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:13px; padding:4px 0; }
  .brief-text { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:14.5px; line-height:1.65; color:var(--text); }
  .brief-text p { margin-bottom:8px; }
  .brief-text p:last-child { margin-bottom:0; }
  .brief-meta { margin-top:10px; padding-top:8px; border-top:1px solid color-mix(in srgb,var(--accent) 18%,var(--border)); display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--text-soft); letter-spacing:0.04em; text-transform:uppercase; }
  .brief-refresh { background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:10px; font-family:inherit; letter-spacing:0.04em; text-transform:uppercase; padding:0; }
  .brief-refresh:hover { text-decoration:underline; }
  .brief-error { color:#b91c1c; font-size:13px; line-height:1.5; }
  [data-theme="dark"] .brief-error { color:#f87171; }
  .item-text { flex:1; min-width:0; }
  .meta { display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:5px; flex-wrap:wrap; }
  .source-chip { background:var(--card-hover); color:var(--text-muted); font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; letter-spacing:0.04em; text-transform:uppercase; }
  .meta-dot { color:var(--text-soft); opacity:0.4; }
  .meta-age { font-size:11px; color:var(--text-soft); }
  .badge-row { display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; align-items:center; }
  .badge { font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; letter-spacing:0.04em; text-transform:uppercase; }
  .badge-breaking { background:#7f1d1d; color:#fecaca; }
  .badge-trending { background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 28%,transparent); }
  .badge-new { background:#14532d; color:#bbf7d0; }
  .title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:19px; font-weight:700; line-height:1.3; letter-spacing:-0.01em; color:var(--text); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .desc { margin-top:6px; font-size:14px; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .thumb { width:110px; height:110px; flex-shrink:0; border-radius:8px; background:var(--card-hover); object-fit:cover; }
  .bkmk-btn { position:absolute; bottom:18px; right:0; width:30px; height:30px; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; font-size:15px; opacity:0; transition:opacity .15s; color:var(--text-soft); padding:0; }
  article.item:hover .bkmk-btn { opacity:1; }
  article.item.bookmarked .bkmk-btn { opacity:1; color:var(--accent); }

  /* ── HERO (first story) ── */
  article.item.hero { flex-direction:column; gap:10px; padding-bottom:24px; }
  article.item.hero .thumb { width:100%; height:220px; border-radius:10px; }
  article.item.hero .title { font-size:26px; -webkit-line-clamp:4; }
  article.item.hero .desc { -webkit-line-clamp:3; font-size:15px; }

  /* ── STOCKS ── */
  .stock-input-row { display:flex; gap:8px; padding:20px 0 12px; border-bottom:1px solid var(--border); }
  .stock-input { flex:1; padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card-hover); color:var(--text); font-size:14px; outline:none; font-family:inherit; text-transform:uppercase; letter-spacing:0.03em; }
  .stock-input:focus { border-color:var(--accent); }
  .stock-add-btn { padding:0 18px; border-radius:999px; border:none; background:var(--text); color:var(--bg); font-weight:600; font-size:14px; cursor:pointer; }
  .stock-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
  .stock-main { flex:1; min-width:0; }
  .stock-ticker { font-weight:700; font-size:15px; letter-spacing:0.02em; }
  .stock-name { font-size:12px; color:var(--text-soft); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stock-spark { width:70px; height:30px; flex-shrink:0; opacity:0.9; }
  .stock-price { text-align:right; min-width:92px; }
  .stock-price .price { font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; }
  .stock-price .change { font-size:12px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .up { color:#15803d; } [data-theme="dark"] .up { color:#4ade80; }
  .down { color:#b91c1c; } [data-theme="dark"] .down { color:#f87171; }
  .stock-remove { width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--text-soft); cursor:pointer; font-size:18px; line-height:1; padding:0; flex-shrink:0; }
  .stock-remove:hover { background:var(--card-hover); color:var(--accent); }
  .stock-loading { opacity:0.5; }
  .stock-news-header { display:flex; align-items:center; gap:8px; padding:24px 0 4px; border-top:2px solid var(--border); margin-top:8px; }
  .stock-news-title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; color:var(--text); }
  .stock-news-sub { font-size:12px; color:var(--text-muted); margin-left:auto; }
  .stock-news-loading { padding:20px 0; text-align:center; color:var(--text-muted); font-size:13px; }

  /* ── FOOTER ── */
  footer { max-width:760px; margin:40px auto 0; padding:20px; text-align:center; color:var(--text-soft); font-size:12px; border-top:1px solid var(--border); }
  .retry-btn { margin-top:14px; padding:8px 18px; border-radius:999px; background:var(--accent); color:white; border:none; font-size:14px; font-weight:500; cursor:pointer; }

  /* ── RESPONSIVE ── */
  @media (max-width:520px) {
    .brand { font-size:19px; }
    .title { font-size:17px; }
    .thumb { width:84px; height:84px; }
    article.item { padding:16px 0; gap:12px; }
    article.item.hero .thumb { height:170px; }
    article.item.hero .title { font-size:21px; }
    main, .header-row, header, .weather, .section-bar, .quick-tabs, .quote-bar, .search-wrap { padding-left:16px; padding-right:16px; }
    .weather, .section-bar, .quick-tabs, .quote-bar { padding-left:0; padding-right:0; }
    .w-temp { font-size:20px; }
    .w-meta { font-size:11px; gap:6px; }
    .skel-img { width:84px; height:84px; }
    .font-btn { display:none; }
  }

  /* ── OUTDOOR / FISHING ADVISOR ── */
  .fish-advisor { background:color-mix(in srgb,var(--accent) 5%,var(--bg)); border:1px solid var(--border); border-radius:12px; padding:20px; margin:8px 0 20px; }
  .fish-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .fish-title { font-family:"Iowan Old Style","Palatino","Georgia",serif; font-size:18px; font-weight:700; }
  .fish-date { font-size:12px; color:var(--text-muted); }
  .fish-bite-meter { display:flex; align-items:center; gap:16px; padding:14px; background:var(--card-hover); border-radius:8px; margin-bottom:14px; flex-wrap:wrap; }
  .fish-bite-score { font-size:38px; line-height:1; flex-shrink:0; }
  .fish-bite-info { flex:1; min-width:80px; }
  .fish-bite-label { font-weight:700; font-size:16px; }
  .fish-bite-sub { font-size:13px; color:var(--accent); margin-top:2px; letter-spacing:0.02em; }
  .fish-conditions { display:flex; gap:16px; flex-wrap:wrap; }
  .fish-lake-stat { text-align:center; min-width:48px; }
  .fish-stat-val { font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
  .fish-stat-lbl { font-size:11px; color:var(--text-muted); }
  .fish-stat-trend { font-size:11px; font-weight:700; margin-top:2px; }
  .fish-stat-trend.rising { color:#15803d; } [data-theme="dark"] .fish-stat-trend.rising { color:#4ade80; }
  .fish-stat-trend.falling { color:#b91c1c; } [data-theme="dark"] .fish-stat-trend.falling { color:#f87171; }
  .fish-stat-trend.stable { color:var(--text-muted); }
  .fish-section { margin:12px 0; }
  .fish-section-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-bottom:6px; }

// ========== UTILS ==========
function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
}
function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
}
function extractImg(html) {
  if (!html) return "";
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  return m ? m[1] : "";
}
function relativeTime(ts) {
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  if (diff < 604800) return Math.floor(diff/86400) + "d ago";
  return new Date(ts).toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Heat score: source weight × exponential recency decay (half-life ~12h)
function heatScore(item) {
  const ageHours = (Date.now() - item.pubDate) / 3600000;
  const decay = Math.exp(-ageHours / 12);
  const weight = SOURCE_WEIGHT[item.source] || SOURCE_WEIGHT["default"];
  return decay * weight;
}

// Breaking news keyword detection
const BREAKING_RE = /\b(breaking|urgent|alert|developing|just in|emergency|exclusive)\b/i;
function isBreaking(title) { return BREAKING_RE.test(title); }

// Cross-source trending: count how many distinct sources share overlapping title words
function wordSet(title) {
  const stop = new Set(["the","a","an","in","of","to","and","is","for","on","at","by","with","as","from","are","was","his","her","its","it","says","say","after","over"]);
  return new Set(title.toLowerCase().split(/\W+/).filter(w => w.length > 3 && !stop.has(w)));
}
function markTrending(items) {
  const sets = items.map(i => wordSet(i.title));
  items.forEach((item, i) => {
    let matches = 0;
    const seenSources = new Set([item.source]);
    sets.forEach((s, j) => {
      if (i === j) return;
      if (seenSources.has(items[j].source)) return;
      const inter = [...sets[i]].filter(w => s.has(w));
      if (inter.length / Math.max(sets[i].size, s.size, 1) >= 0.38) {
        matches++;
        seenSources.add(items[j].source);
      }
    });
    item.trending = matches >= 2;
  });
}

// ========== READ / BOOKMARK ==========
const READ_TTL = 48 * 3600000; // dim read items for 48h
function getReads() { try { return JSON.parse(localStorage.getItem("news.reads")||"{}"); } catch { return {}; } }
function markRead(url) {
  const reads = getReads();
  reads[url] = Date.now();
  // Prune old reads
  Object.keys(reads).forEach(k => { if (Date.now() - reads[k] > READ_TTL) delete reads[k]; });
  try { localStorage.setItem("news.reads", JSON.stringify(reads)); } catch {}
}
function isRead(url) { const r = getReads(); return r[url] && (Date.now() - r[url]) < READ_TTL; }

function getSaved() { try { return JSON.parse(localStorage.getItem("news.saved")||"[]"); } catch { return []; } }
function toggleSave(item) {
  let saved = getSaved();
  const idx = saved.findIndex(s => s.link === item.link);
  if (idx >= 0) { saved.splice(idx, 1); }
  else { saved.unshift({ title:item.title, link:item.link, source:item.source, pubDate:item.pubDate, description:item.description, thumbnail:item.thumbnail }); }
  try { localStorage.setItem("news.saved", JSON.stringify(saved.slice(0, 200))); } catch {}
  return idx < 0; // returns true if now saved
}
function isSaved(url) { return getSaved().some(s => s.link === url); }

// ========== NWS ALERTS ==========
async function fetchNWSAlerts() {
  const cacheKey = "news.nws.alerts";
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const p = JSON.parse(cached);
      if (Date.now() - p.ts < ALERTS_CACHE_TTL_MS) { renderAlerts(p.data); return; }
    }
  } catch {}
  try {
    const res = await fetchWithTimeout(
      "https://api.weather.gov/alerts/active?point=" + WEATHER_LOCATION.lat + "," + WEATHER_LOCATION.lon, 6000
    );
    if (!res.ok) throw new Error("NWS HTTP " + res.status);
    const data = await res.json();
    const alerts = (data.features||[]).map(f => ({
      event: f.properties.event || "",
      headline: f.properties.headline || f.properties.description || "",
      severity: (f.properties.severity||"").toLowerCase(),
      url: f.properties["@id"] || ""
    }));
    try { localStorage.setItem(cacheKey, JSON.stringify({ ts:Date.now(), data:alerts })); } catch {}
    renderAlerts(alerts);
  } catch(e) { console.warn("NWS alerts:", e); }
}
function severityClass(sev) {
  if (sev==="extreme") return "extreme"; if (sev==="severe") return "severe";
  if (sev==="moderate") return "moderate"; return "minor";
}
function severityIcon(sev) {
  if (sev==="extreme"||sev==="severe") return "🚨";
  if (sev==="moderate") return "⚠️"; return "ℹ️";
}
function renderAlerts(alerts) {
  if (!alerts||!alerts.length) { alertBannerEl.classList.remove("has-alerts"); alertBannerEl.innerHTML=""; return; }
  alertBannerEl.classList.add("has-alerts");
  alertBannerEl.innerHTML = alerts.map(a =>
    '<div class="alert-item '+severityClass(a.severity)+'">' +
      '<span class="alert-icon">'+severityIcon(a.severity)+'</span>' +
      '<div class="alert-body">' +
        '<div class="alert-event">'+escapeHtml(a.event)+' — Clinton, MO</div>' +
        '<div class="alert-headline">'+escapeHtml((a.headline||"").slice(0,180))+'</div>' +
      '</div>' +
      (a.url?'<a class="alert-link" href="'+escapeHtml(a.url)+'" target="_blank" rel="noopener">Details →</a>':'') +
    '</div>'
  ).join("");
}

const TRUMAN_READINGS_KEY = "news.truman.history";

async function fetchTrumanLake() {
  // Truman pool elevation should be in 690-740 ft NGVD range under any conditions.
  // Normal pool = 706.0, flood pool max = 739.6. We use this range to validate we're
  // getting actual POOL ELEVATION (NGVD ft), not raw stage above the gauge zero.
  const isValidPoolElevation = v => isFinite(v) && v >= 690 && v <= 745;
  // NOAA TUMM7 gauge zero datum (ft NGVD 1929) — stage values from this gauge
  // are reported above this datum and must be added to it to get true pool elevation.
  const TUMM7_DATUM_NGVD = 686.32;

  // Pull a reading + 24h-ago reading from a series of {value, time} objects.
  // findHoursAgo returns the reading closest to N hours ago, or null if no
  // reading is within ±4 hours of the target time.
  const findHoursAgo = (series, hoursAgo) => {
    if (!series || !series.length) return null;
    const target = Date.now() - hoursAgo * 3600000;
    let best = null, bestDelta = Infinity;
    for (const r of series) {
      const t = new Date(r.time).getTime();
      if (!isFinite(t)) continue;
      const d = Math.abs(t - target);
      if (d < bestDelta) { best = r; bestDelta = d; }
    }
    if (!best || bestDelta > 4 * 3600000) return null;
    return best;
  };

  let stage = null, time = null, source = null, dayAgo = null, isElevation = false;

  // 1) NOAA NWS gauge TUMM7 = Truman Reservoir at Truman Dam.
  //    The gauge reports STAGE (ft above gauge zero), so we add the datum (686.32 ft
  //    NGVD) to convert to true pool elevation matching what the Corps publishes
  //    at water.usace.army.mil. e.g. stage 28.8 + 686.32 = 715.12 ft pool elevation.
  try {
    const res = await fetchWithTimeout(
      "https://api.water.noaa.gov/nwps/v1/gauges/TUMM7/stageflow/observed?period=P2D", 7000
    );
    if (res.ok) {
      const data = await res.json();
      const rows = (data?.data) || [];
      const series = rows
        .filter(r => r.primary != null && isFinite(parseFloat(r.primary)))
        .map(r => ({ value: parseFloat(r.primary) + TUMM7_DATUM_NGVD, time: r.validTime }))
        .filter(r => isValidPoolElevation(r.value));
      if (series.length) {
        const last = series[series.length - 1];
        stage = last.value; time = last.time; source = "NOAA TUMM7"; isElevation = true;
        dayAgo = findHoursAgo(series, 24);
      }
    }
  } catch(e) { console.warn("NOAA TUMM7:", e); }

  // 2) USGS Truman pool elevation fallback (parameter 00062 = NGVD elevation, ft).
  if (stage === null) {
    try {
      const res = await fetchWithTimeout(
        "https://waterservices.usgs.gov/nwis/iv/?sites=06922540&parameterCd=00062&format=json&siteStatus=all&period=P2D", 7000
      );
      if (res.ok) {
        const data = await res.json();
        const vals = data?.value?.timeSeries?.[0]?.values?.[0]?.value || [];
        const series = vals
          .filter(v => v.value && v.value !== "-999999" && isValidPoolElevation(parseFloat(v.value)))
          .map(v => ({ value: parseFloat(v.value), time: v.dateTime }));
        if (series.length) {
          const last = series[series.length - 1];
          stage = last.value; time = last.time; source = "USGS 06922540"; isElevation = true;
          dayAgo = findHoursAgo(series, 24);
        }
      }
    } catch(e) { console.warn("USGS Truman:", e); }
  }

  // 3) NOAA Warsaw gauge (WRSM7) — last resort, this is upstream stage not pool.
  if (stage === null) {
    try {
      const res = await fetchWithTimeout(
        "https://api.water.noaa.gov/nwps/v1/gauges/WRSM7/stageflow/observed?period=P2D", 6000
      );
      if (res.ok) {
        const data = await res.json();
        const rows = (data?.data) || [];
        const series = rows
          .filter(r => r.primary != null && isFinite(parseFloat(r.primary)))
          .map(r => ({ value: parseFloat(r.primary), time: r.validTime }));
        if (series.length) {
          const last = series[series.length - 1];
          stage = last.value; time = last.time; source = "NOAA Warsaw"; isElevation = false;
          dayAgo = findHoursAgo(series, 24);
        }
      }
    } catch(e) { console.warn("NOAA Warsaw:", e); }
  }

  if (stage === null) return null;

  // Maintain rolling history (48h) for fine-grained 3-hour trend.
  // The 24-hour change comes from the API series above (more accurate); we only
  // fall back to rolling history if the API didn't return a 24h-ago point.
  let history = [];
  try { history = JSON.parse(localStorage.getItem(TRUMAN_READINGS_KEY) || "[]"); } catch {}
  history.push({ stage, ts: Date.now() });
  history = history.filter(r => Date.now() - r.ts < 48 * 3600000).slice(-100);
  try { localStorage.setItem(TRUMAN_READINGS_KEY, JSON.stringify(history)); } catch {}

  // 3-hour trend (rising/falling/stable) from rolling history
  let trend = "stable", trendDiff = 0;
  const threeHoursAgo = Date.now() - 3 * 3600000;
  const old3hr = [...history].reverse().find(r => r.ts <= threeHoursAgo);
  if (old3hr) {
    trendDiff = stage - old3hr.stage;
    if (trendDiff > 0.05) trend = "rising";
    else if (trendDiff < -0.05) trend = "falling";
  }

  // 24-hour change — prefer the API's actual 24h-ago reading; fall back to rolling history
  let dailyChange = null;
  if (dayAgo && isFinite(dayAgo.value)) {
    dailyChange = stage - dayAgo.value;
  } else {
    const oneDayAgo = Date.now() - 24 * 3600000;
    const old24 = [...history].reverse().find(r => r.ts <= oneDayAgo);
    if (old24) dailyChange = stage - old24.stage;
  }

  const aboveBelow = isElevation ? (stage - TRUMAN_NORMAL_POOL).toFixed(1) : null;

  return {
    stage, time, source, trend,
    trendDiff: Math.abs(trendDiff).toFixed(2),
    dailyChange: dailyChange !== null ? parseFloat(dailyChange.toFixed(2)) : null,
    isElevation,
    aboveBelow
  };
}
async function loadWeather(force) {
  // Bumped cache keys to v2 so old cached values (e.g. raw TUMM7 stage 28.8 ft
  // from the pre-datum-offset code) are automatically invalidated.
  const cacheKey="news.weather.v2", lakeCacheKey="news.truman.v2";
  let data, lake;
  if (!force) {
    try { const p=JSON.parse(localStorage.getItem(cacheKey)||"null"); if(p&&Date.now()-p.ts<WEATHER_CACHE_TTL_MS) data=p.data; } catch {}
    try { const p=JSON.parse(localStorage.getItem(lakeCacheKey)||"null"); if(p&&Date.now()-p.ts<WEATHER_CACHE_TTL_MS) lake=p.data; } catch {}
  }
  if (data && lake!==undefined) { renderWeather(data, lake); return; }
  weatherEl.className="weather loading";
  weatherEl.innerHTML='<span class="spinner"></span><span>Loading weather…</span>';
  const url = "https://api.open-meteo.com/v1/forecast?latitude="+WEATHER_LOCATION.lat+"&longitude="+WEATHER_LOCATION.lon+
    "&current=temperature_2m,weather_code,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m" +
    "&hourly=wind_direction_10m,wind_speed_10m" +
    "&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max" +
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone="+encodeURIComponent(WEATHER_LOCATION.tz)+"&forecast_days=3&past_days=1";
  try {
    const [wRes, lakeData] = await Promise.all([fetchWithTimeout(url, FEED_TIMEOUT_MS), fetchTrumanLake()]);
    if (!wRes.ok) throw new Error("HTTP "+wRes.status);
    data = await wRes.json(); lake = lakeData;
    try { localStorage.setItem(cacheKey, JSON.stringify({ts:Date.now(),data})); } catch {}
    try { localStorage.setItem(lakeCacheKey, JSON.stringify({ts:Date.now(),data:lake})); } catch {}
    renderWeather(data, lake);
  } catch(err) {
    console.warn("Weather:", err);
    weatherEl.className="weather";
    weatherEl.innerHTML='<div class="w-current"><span class="w-icon">⚠️</span><span>Weather unavailable · '+WEATHER_LOCATION.name+'</span></div>';
  }
}
function dayLabel(dateStr, idx) {
  if (idx===0) return "Today"; if (idx===1) return "Tomorrow";
  try { return new Date(dateStr+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"}); } catch { return ""; }
}
function renderWeather(data, lake) {
  const c=data.current||{}, d=data.daily||{};
  const entry=WEATHER_CODE_MAP[c.weather_code]||["—","🌡️"];
  const temp=Math.round(c.temperature_2m), feels=Math.round(c.apparent_temperature);
  const hi=d.temperature_2m_max&&Math.round(d.temperature_2m_max[0]), lo=d.temperature_2m_min&&Math.round(d.temperature_2m_min[0]);
  const wind=Math.round(c.wind_speed_10m), hum=c.relative_humidity_2m;
  const windDirText = isFinite(c.wind_direction_10m) ? compassFromDegrees(c.wind_direction_10m)+" " : "";
  let forecastHtml="";
  for (let i=0; i<Math.min(3,(d.time||[]).length); i++) {
    const e=WEATHER_CODE_MAP[(d.weather_code||[])[i]]||["","🌡️"];
    const pop=(d.precipitation_probability_max||[])[i];
    forecastHtml+='<span class="w-day"><span class="w-day-name">'+dayLabel((d.time||[])[i],i)+'</span> '+e[1]+' '+
      Math.round((d.temperature_2m_max||[])[i])+'° / '+Math.round((d.temperature_2m_min||[])[i])+'°'+
      (isFinite(pop)&&pop>0?' <span style="color:var(--text-soft)">💧'+pop+'%</span>':'')+' </span>';
  }
  const radarHref="https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsiaWQiOiJsb2NhbCIsImNlbnRlciI6Wy05My43NzgsMzguMzY4Nl0sImxvY2F0aW9uIjpudWxsLCJ6b29tIjo4LCJmaWx0ZXJpbmciOnRydWUsImxheWVyIjoiYnJlZiIsInN0YXRpb24iOiJLRUFYIn19";
  const trendArrow = lake?.trend==="rising"?"▲":lake?.trend==="falling"?"▼":"—";
  const dc = (lake && lake.dailyChange !== null && isFinite(lake.dailyChange)) ? lake.dailyChange : null;
  const dailyText = dc !== null
    ? ' <span style="opacity:0.75;font-weight:500">('+(dc>=0?'+':'')+dc.toFixed(2)+'ft/24h)</span>'
    : '';
  const lakeHtml = lake&&isFinite(lake.stage)
    ? '<a class="w-lake" href="https://water.noaa.gov/gauges/tumm7" target="_blank" rel="noopener">🌊 Truman <strong>'+lake.stage.toFixed(1)+'ft</strong> '+trendArrow+dailyText+'</a>'
    : '<a class="w-lake" href="https://water.noaa.gov/gauges/tumm7" target="_blank" rel="noopener">🌊 Truman Lake →</a>';
  weatherEl.className="weather";
  weatherEl.innerHTML=
    '<div class="w-current">'+
      '<span class="w-icon">'+entry[1]+'</span>'+
      '<span class="w-temp">'+temp+'°F</span>'+
      '<span class="w-cond">'+entry[0]+'</span>'+
      '<span class="w-sep">·</span>'+
      '<span class="w-cond">'+escapeHtml(WEATHER_LOCATION.name)+'</span>'+
      '<span class="w-meta">'+
        '<span>H '+(isFinite(hi)?hi:"—")+'° L '+(isFinite(lo)?lo:"—")+'°</span>'+
        '<span>Feels '+feels+'°</span>'+
        '<span>💨 '+windDirText+wind+' mph</span>'+
        '<span>💧 '+hum+'%</span>'+
        lakeHtml+
      '</span>'+
    '</div>'+
    '<div class="w-forecast">'+forecastHtml+'<a class="w-radar" target="_blank" href="'+radarHref+'">📡 Radar →</a></div>';
}

// ========== NEWS FEEDS ==========
function parseXmlFeed(xmlText, source) {
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.querySelector("parsererror")) return [];
  const isAtom = doc.documentElement.nodeName.toLowerCase()==="feed";
  const entries = Array.from(doc.querySelectorAll(isAtom?"entry":"item"));
  return entries.slice(0, PER_FEED_LIMIT).map(el => {
    const get = sel => { const n=el.querySelector(sel); return n?n.textContent.trim():""; };
    let link="";
    if (isAtom) {
      const a = el.querySelector("link[rel='alternate']")||el.querySelector("link");
      link = a?(a.getAttribute("href")||a.textContent.trim()):"";
    } else { link=get("link"); }
    const title=get("title"), desc=get("description")||get("summary")||get("content");
    const pubStr=get("pubDate")||get("published")||get("updated");
    const enclosure=el.querySelector("enclosure[url]");
    return {
      title, link,
      description: stripHtml(desc).slice(0,240),
      pubDate: pubStr?new Date(pubStr).getTime():Date.now(),
      thumbnail: (enclosure?enclosure.getAttribute("url"):extractImg(desc))||"",
      source
    };
  }).filter(x=>x.title&&x.link);
}

async function fetchViaProxy(proxy, feed) {
  const res = await fetchWithTimeout(proxy.url(feed.url), FEED_TIMEOUT_MS);
  if (!res.ok) throw new Error(proxy.name+" HTTP "+res.status);
  if (proxy.parse==="json") {
    const data = await res.json();
    if (data.status!=="ok"||!Array.isArray(data.items)) throw new Error("bad rss2json");
    return data.items.slice(0,PER_FEED_LIMIT).map(it=>({
      title:(it.title||"").trim(), link:it.link,
      description: stripHtml(it.description||it.content||"").slice(0,240),
      pubDate: it.pubDate?new Date(it.pubDate).getTime():Date.now(),
      thumbnail: it.thumbnail||(it.enclosure&&it.enclosure.link)||extractImg(it.content||it.description)||"",
      source: feed.source
    })).filter(x=>x.title&&x.link);
  }
  if (proxy.parse==="allorigins") {
    const data = await res.json();
    if (!data.contents) throw new Error("empty allorigins");
    return parseXmlFeed(data.contents, feed.source);
  }
  if (proxy.parse==="xml") {
    const text = await res.text();
    if (!text || text.length < 50) throw new Error("empty xml response");
    return parseXmlFeed(text, feed.source);
  }
  throw new Error("unknown parse mode");
}

// Race both proxies simultaneously — use whichever responds first with valid data
async function fetchFeed(feed) {
  const cacheKey = "news.cache." + feed.url;
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try { const p=JSON.parse(cached); if(Date.now()-p.ts<CACHE_TTL_MS) return p.items; } catch {}
  }
  // Race all proxies — resolve on first success, ignore failures
  const items = await new Promise(resolve => {
    let settled = false, failed = 0;
    PROXIES.forEach(proxy => {
      fetchViaProxy(proxy, feed)
        .then(result => {
          if (!settled && result.length) {
            settled = true;
            try { localStorage.setItem(cacheKey, JSON.stringify({ts:Date.now(), items:result})); } catch {}
            resolve(result);
          } else if (!settled) {
            failed++;
            if (failed === PROXIES.length) resolve([]);
          }
        })
        .catch(() => {
          if (!settled) {
            failed++;
            if (failed === PROXIES.length) resolve([]);
          }
        });
    });
  });
  return items;
}

// ── WIND HELPERS ──
// Convert wind direction in degrees (0=N, 90=E, 180=S, 270=W) into a 16-point compass label.
function compassFromDegrees(deg) {
  if (!isFinite(deg)) return "—";
  const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return dirs[Math.floor(((deg % 360) / 22.5) + 0.5) % 16];
}

// Walk back through hourly wind direction data and count how many consecutive hours
// the wind has been within ±30° of the current direction. This is "sustained hours".
function computeSustainedWindHours(hourly, currentDir) {
  if (!hourly || !hourly.time || !hourly.wind_direction_10m || !isFinite(currentDir)) return 0;
  const times = hourly.time;
  const dirs  = hourly.wind_direction_10m;
  const now = Date.now();
  // Find the index of the most recent past hour
  let nowIdx = -1;
  for (let i = 0; i < times.length; i++) {
    const t = new Date(times[i]).getTime();
    if (!isFinite(t)) continue;
    if (t <= now) nowIdx = i;
    else break;
  }
  if (nowIdx < 0) return 0;
  // Walk back; stop when direction diverges by more than 30°
  let hours = 0;
  for (let i = nowIdx; i >= 0; i--) {
    const d = dirs[i];
    if (!isFinite(d)) break;
    // Compute angular difference (always 0-180)
    const diff = Math.abs(((d - currentDir + 540) % 360) - 180);
    if (diff > 30) break;
    hours++;
  }
  return hours;
}

// Translate current wind direction + sustained duration + speed into a Grand-arm-specific
// shad bank recommendation. The Grand River arm runs roughly NW–SE; Sparrowfoot Park sits
// on the south shore near the upper (NW) end. So a north wind pushes shad onto Sparrowfoot's
// shore, a south wind pushes them across to the opposite bank, and so on.
function shadBankAdvice(windDir, windMph, sustainedHours) {
  if (!isFinite(windDir) || !isFinite(windMph) || windMph < 5) return null;
  const fromDir = compassFromDegrees(windDir);

  let bankSide, sparrowfootNote;
  if (windDir >= 315 || windDir < 45) {
    bankSide = "south-facing banks of the Grand arm";
    sparrowfootNote = "that's Sparrowfoot's side — walk the south shoreline and look for shad piled tight against the bank.";
  } else if (windDir >= 45 && windDir < 135) {
    bankSide = "west-facing banks (upper Grand arm)";
    sparrowfootNote = "Sparrowfoot's west coves are getting fetch — bait piles up in the back of those coves.";
  } else if (windDir >= 135 && windDir < 225) {
    bankSide = "north-facing banks of the Grand arm";
    sparrowfootNote = "Sparrowfoot's south shore will be slack — by boat, run across to the north bank; from shore, drive around to the opposite shoreline.";
  } else {
    bankSide = "east-facing banks (lower Grand arm)";
    sparrowfootNote = "wind is pushing bait DOWN the arm — head east toward the lower cuts and points by boat.";
  }

  let strength;
  if (sustainedHours >= 6 && windMph >= 12) {
    strength = "stacked tight — best cast-netting window of the day, hit it now";
  } else if (sustainedHours >= 4 && windMph >= 8) {
    strength = "concentrated and tightening";
  } else if (sustainedHours >= 2) {
    strength = "starting to pile up";
  } else {
    strength = "just starting to push — give it another hour or two to fully concentrate";
  }

  return "Wind from "+fromDir+" at "+Math.round(windMph)+" mph for "+sustainedHours+"h — shad "+strength+" on "+bankSide+". "+sparrowfootNote;
}

function generateFishingAdvice(lake, weather) {
  // Tailored to Matt's targets at Sparrowfoot / Grand River arm:
  //   Blue Catfish, Flathead Catfish, Crappie, Shad (cast netting), Farm Pond Bluegill
  const now = new Date();
  const month = now.getMonth(); // 0-11
  const hour = now.getHours();
  const c = weather?.current || {};
  const airTempF = isFinite(c.temperature_2m) ? c.temperature_2m : 68;
  const windMph  = isFinite(c.wind_speed_10m) ? c.wind_speed_10m : 5;
  const windDir  = isFinite(c.wind_direction_10m) ? c.wind_direction_10m : null;
  const sustainedHours = windDir !== null ? computeSustainedWindHours(weather?.hourly, windDir) : 0;
  const windBankAdvice = shadBankAdvice(windDir, windMph, sustainedHours);
  const weatherCode = c.weather_code ?? 0;

  const season = (month<=1||month===11)?"winter":(month<=4)?"spring":(month<=7)?"summer":"fall";
  const isRaining = weatherCode >= 51 && weatherCode < 95;
  const isStormy  = weatherCode >= 95;
  const isDawn    = hour>=5 && hour<8;
  const isEvening = hour>=17 && hour<20;
  const isMidDay  = hour>=11 && hour<16;
  const isNight   = hour>=20 || hour<5;

  let bite = 3;
  let tips = [], topSpecies = [], baits = [], hotspots = [];
  let shadTip = "", pondTip = "";

  // ── SEASON BASE ──
  if (season === "spring") {
    bite = 4;
    topSpecies = ["Crappie","Blue Catfish","Flathead Catfish","Shad (bait)"];
    tips.push("Spring on the Grand River arm: crappie are pushing up shallow into flooded timber and brush (3–8 ft) to spawn. Blue cats are running up the Grand chasing shad — drift cut shad through the channel from Sparrowfoot up. Flatheads are waking from winter and staging near deep current breaks; live bluegill is the move.");
    baits = ["1/16 oz chartreuse/white jig (crappie)","Live minnow on a slip float (crappie)","Fresh-cut shad on circle hooks 5/0 (blue cats)","Live bluegill 6–10 in (flatheads)"];
    hotspots = ["Sparrowfoot brushy coves — flooded timber for crappie","Grand River channel below Sparrowfoot (blues drifting cut shad)","Tebo Creek inlet at the mouth","Big laydowns 12–20 ft for staging flatheads"];
    shadTip = "Shad spawn April–May. At dawn watch shorelines for surface splashes that look like raindrops — that's spawning shad on gravel. Throw the cast net on those rings. Creek mouths and runoff points after a warm rain are also stacked.";
    pondTip = "Bluegill aren't bedding yet but are moving shallow as water hits 60°F. Hit any cover (docks, brush, fallen wood) in 3–6 ft. Small piece of worm under a tiny bobber is all you need.";
  } else if (season === "summer") {
    bite = airTempF > 88 ? 2 : 3;
    topSpecies = ["Blue Catfish","Flathead Catfish","Crappie","Shad (bait)"];
    if (airTempF > 86) {
      tips.push("Heat is on. Blue cats and flatheads are the smart play — they thrive in deep, oxygenated water on the Grand channel edges (25–40 ft). Crappie are deep on brush piles in 18–25 ft, requiring a slow vertical presentation. Best windows: 5–9 AM and 7 PM through the night.");
    } else {
      tips.push("Pre-bake summer: blues are stacked on the old riverbed channel — drift fresh-cut shad on a Santee Cooper rig through 25–35 ft. Flatheads are nocturnal — set live bluegill on slip-sinker rigs near big timber and laydowns after dark. Crappie holding deep on brush piles, 1/8 oz hair jig is hard to beat.");
    }
    baits = ["Cut shad or skipjack on Santee rig (blues)","Live bluegill 6–10 in on circle hook (flatheads)","1/8 oz hair jig in 18–25 ft (crappie)","Drop shot with minnow (deep crappie)"];
    hotspots = ["Grand River channel ledges 25–40 ft (blues)","Big standing timber and laydowns 15–25 ft (flatheads, after dark)","Submerged brush piles 18–25 ft (crappie)","Tailwater current breaks below the dam — trophy blues"];
    shadTip = "Best cast netting is at night under marina/dock lights — shad pile up tight under any light source. Throw the net 5–10 ft to the side, not directly under, so they don't spook. At dawn, hit creek mouths before the sun pushes them deep.";
    pondTip = "Bluegill are bedding (June) or post-spawn (July). Bedding gills concentrate in 2–4 ft on sandy or gravel bottoms — accuracy matters, drop a small piece of worm right on the bed. Post-spawn, fish under shaded cover in 4–8 ft midday.";
  } else if (season === "fall") {
    bite = 4;
    topSpecies = ["Blue Catfish","Crappie","Flathead Catfish","Shad (bait)"];
    tips.push("Fall is gold on Truman. Cold fronts push shad into the back of creek arms and blue cats follow in numbers — drift cut shad through 15–25 ft over creek channels. Crappie are gorging before winter, stacked on transitional brush in 12–20 ft. Flatheads feeding heavily before dormancy — last big window for a trophy fish on live bluegill.");
    baits = ["Fresh-cut shad on Santee Cooper rig (drift, blues)","Live skipjack or large shad (trophy blues)","Live bluegill on slip rig (flatheads)","Shad-colored 1/16 oz jig (crappie)"];
    hotspots = ["Creek channel mouths in the Grand River arm","Wind-blown shad-loaded points","Brush on transition banks 12–20 ft (crappie)","Big laydowns deep in creek arms after dark (flatheads)"];
    shadTip = "Cold fronts push shad into creek arms — follow them. Cast net the back third of any creek arm, especially on cloudy windy days when they're less spooky. Watch for surface dimples at dawn.";
    pondTip = "Bluegill move shallow chasing bugs again as water cools through the 60s. Hit any wood or weed cover in 3–6 ft — fly rod, ultralight jig, or a worm under a slip bobber all work.";
  } else {
    // winter
    bite = 2;
    topSpecies = ["Blue Catfish","Crappie"];
    tips.push("Winter Truman: blues are the best bite if you slow way down. They stack in deep wintering holes on the main lake (35–55 ft) — fresh cut shad on a tight-line, virtually no movement. Crappie are deep on brush piles and treetops in 25–40 ft, requiring patience and a soft touch. A bite often takes 30 seconds of no movement.");
    tips.push("Flatheads are mostly dormant — they'll bite occasionally on warm stable days but it's a low-percentage hunt this time of year.");
    baits = ["Fresh-cut shad on tight-line rig (blues)","1/32 oz tube jig pink/white (deep crappie)","Live minnow on long-line slip rig","Blade bait worked very slowly"];
    hotspots = ["Deep main-lake wintering holes 35–55 ft","Standing timber tops in 25–40 ft (crappie)","Channel bends in the Grand near Sparrowfoot","Heat-discharge or warm-water inflow areas"];
    shadTip = "Shad are deep and tightly schooled — cast netting is tough. Best chance: warm-water discharge or deep creek channel ledges where shad concentrate. Most folks fish frozen shad bought from a bait shop in winter.";
    pondTip = "Bluegill go deep and slow. Tiny ice jig tipped with a wax worm or red worm, very slow vertical presentation in 8–15 ft. Best on warming sunny afternoons when surface temp climbs a few degrees.";
  }

  // ── LAKE LEVEL MODIFIER ──
  if (lake?.trend === "rising") {
    bite = Math.min(5, bite + 1);
    tips.push("Rising water — fish are pushing into newly flooded timber and brush. Blues and crappie work the freshest flooded cover in 4–10 ft. Flatheads slide into newly submerged laydowns. Bait gets disoriented on a rise, which makes shad easier to net for a day or two.");
  } else if (lake?.trend === "falling") {
    tips.push("Falling water pulls fish off the flats and back to the channel edges. Blue cats are EXCELLENT right now on channel breaks — they follow disoriented shad pulled out by the drop. Crappie slide deeper to the next structural piece. Flatheads sit tight in their cover.");
  }

  // 24-hour change context — tells how big the swing was and warns of a delayed bite
  if (lake?.dailyChange !== null && lake?.dailyChange !== undefined && isFinite(lake.dailyChange)) {
    const dc = parseFloat(lake.dailyChange);
    if (Math.abs(dc) >= 0.3) {
      const dir = dc >= 0 ? "rose" : "dropped";
      tips.push("Pool "+dir+" "+Math.abs(dc).toFixed(2)+" ft over the last 24 hours — that's a meaningful swing. Give the bite 12–24 hours to settle after the change. Cats fire up first, crappie take longest to settle into a new pattern.");
    }
  }

  if (lake?.isElevation && lake?.aboveBelow !== null) {
    const diff = parseFloat(lake.aboveBelow);
    if (diff > 2) {
      tips.push("Pool is "+Math.abs(diff).toFixed(1)+" ft above normal — flooded shoreline brush and timber are prime ambush spots for blues and crappie. Bank access is limited but the flooded cover is fresh.");
    } else if (diff < -2) {
      tips.push("Pool is "+Math.abs(diff).toFixed(1)+" ft below normal — fish are concentrated in the remaining deep water. Main lake channel structure is your best bet for blues and crappie. Shad are easier to find since they have less water to spread out in.");
    }
  }

  // ── WIND MODIFIER ──
  if (windMph > 20) {
    bite = Math.max(1, bite - 1);
    tips.push("High winds ("+Math.round(windMph)+" mph) — protected coves and the back of creek arms only. Wind-blown rocky points still produce blues since wave action concentrates baitfish, but bank access on the windward side gets ugly fast.");
  } else if (windMph >= 7 && windMph <= 18) {
    bite = Math.min(5, bite + 0.5);
    tips.push("The "+Math.round(windMph)+" mph breeze is your friend — wind-blown banks load up with shad and blues stack up on the windward side to feed. Anchor or drift cut shad along the windward bank. Watch where the wind is hitting and head there.");
  }

  // ── RAIN / STORM ──
  if (isStormy) {
    bite = 1;
    tips = ["⚠️ Storm conditions — stay off the water. Lightning + open water + tall fishing rods is a deadly combination. Wait it out."];
    baits = []; hotspots = []; shadTip = ""; pondTip = "";
  } else if (isRaining) {
    bite = Math.min(5, bite + 0.5);
    tips.push("Light rain reduces surface glare and triggers feeding. Runoff points where creeks dump fresh muddy water into the lake are prime — blue cats and shad stack right where the colored and clear water meet.");
  }

  // ── TIME OF DAY ──
  if (isDawn || isEvening) {
    bite = Math.min(5, bite + 0.5);
    if (isDawn) {
      tips.push("Dawn — cast net window for shad is wide open right now. After you've got bait, drift cut shad along channel edges for blues. Crappie bite hardest in low light.");
    } else {
      tips.push("Evening — best window of the day for crappie and pre-dark blues. Set up before dark and stay through the first hour after — that's when flatheads start prowling.");
    }
  } else if (isMidDay && airTempF > 78 && !isRaining) {
    tips.push("Midday heat — go deep or wait. Blues on deep channel breaks (30–40 ft) tight-line. Crappie on shaded structure or deep brush. Don't waste time in shallow water until evening.");
  } else if (isNight && !isStormy) {
    tips.push("Night fishing on Truman is prime: flatheads are actively prowling timber, blues feed heavily on deep channels. Live bluegill set near big laydowns for flatheads, fresh-cut shad on the channel for blues.");
  }

  bite = Math.round(Math.max(1, Math.min(5, bite)));
  return { bite, tips, topSpecies, baits, hotspots, season, shadTip, pondTip, windBankAdvice };
}

function getWatchlist() {
  let list=null;
  try { const raw=localStorage.getItem("news.watchlist"); if(raw) list=JSON.parse(raw); } catch {}
  if (!list) list=DEFAULT_TICKERS.slice();
  const savedVersion=parseInt(localStorage.getItem("news.watchlist.version")||"1",10);
  if (savedVersion<WATCHLIST_VERSION) {
    DEFAULT_TICKERS.forEach(t=>{ if(!list.includes(t)) list.push(t); });
    try { localStorage.setItem("news.watchlist",JSON.stringify(list)); localStorage.setItem("news.watchlist.version",String(WATCHLIST_VERSION)); } catch {}
  }
  return list;
}
function setWatchlist(list) { localStorage.setItem("news.watchlist",JSON.stringify(list)); }

async function fetchTextThroughProxies(targetUrl) {
  let lastErr;
  for (const proxy of CORS_PROXIES) {
    try {
      const res=await fetchWithTimeout(proxy.url(targetUrl), FEED_TIMEOUT_MS);
      if (!res.ok) { lastErr=new Error(proxy.name+" HTTP "+res.status); continue; }
      const text=await res.text();
      if (!text||text.length<10) { lastErr=new Error(proxy.name+" empty"); continue; }
      return text;
    } catch(err) { lastErr=err; }
  }
  throw lastErr||new Error("all stock proxies failed");
}

async function fetchQuoteYahoo(ticker) {
  const yahooUrl="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(ticker)+"?interval=1d&range=1mo";
  const text=await fetchTextThroughProxies(yahooUrl);
  const data=JSON.parse(text);
  const result=data&&data.chart&&data.chart.result&&data.chart.result[0];
  if (!result) throw new Error("no chart data");
  const meta=result.meta||{};
  const closesRaw=(result.indicators&&result.indicators.quote&&result.indicators.quote[0]&&result.indicators.quote[0].close)||[];
  const closes=closesRaw.filter(x=>x!==null&&x!==undefined);
  const price=(meta.regularMarketPrice!==undefined&&meta.regularMarketPrice!==null)?meta.regularMarketPrice:closes[closes.length-1];
  const prevClose=(meta.chartPreviousClose!==undefined&&meta.chartPreviousClose!==null)?meta.chartPreviousClose:(meta.previousClose||closes[closes.length-2]);
  const change=price-prevClose;
  return { ticker, name:meta.shortName||meta.longName||ticker, price, change, changePct:(change/prevClose)*100, currency:meta.currency||"USD", closes:closes.slice(-30), source:"Yahoo" };
}
async function fetchQuoteStooq(ticker) {
  const sym=ticker.toLowerCase()+(ticker.indexOf(".")===-1?".us":"");
  const csv=await fetchTextThroughProxies("https://stooq.com/q/d/l/?s="+encodeURIComponent(sym)+"&i=d");
  if (!csv||csv.indexOf("Date")===-1) throw new Error("no stooq data");
  const rows=csv.trim().split(/\r?\n/).slice(1).map(l=>l.split(",")).filter(r=>r.length>=5);
  if (rows.length<2) throw new Error("not enough rows");
  const closes=rows.slice(-30).map(r=>parseFloat(r[4])).filter(x=>!isNaN(x));
  if (closes.length<2) throw new Error("bad closes");
  const price=closes[closes.length-1], prev=closes[closes.length-2], change=price-prev;
  return { ticker, name:ticker, price, change, changePct:(change/prev)*100, currency:"USD", closes, source:"Stooq" };
}
async function fetchQuote(ticker, force) {
  const cacheKey="news.quote."+ticker;
  if (!force) {
    const cached=localStorage.getItem(cacheKey);
    if (cached) { try { const p=JSON.parse(cached); if(Date.now()-p.ts<STOCKS_CACHE_TTL_MS) return p.data; } catch {} }
  }
  for (const fn of [fetchQuoteYahoo, fetchQuoteStooq]) {
    try {
      const info=await fn(ticker);
      if (info&&isFinite(info.price)&&isFinite(info.change)) {
        try { localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data:info})); } catch {}
        return info;
      }
    } catch(err) { console.warn("["+ticker+"] "+fn.name+":", (err&&err.message)||err); }
  }
  return null;
}
function sparklineSvg(closes) {
  if (!closes||closes.length<2) return '<div class="stock-spark"></div>';
  const w=70,h=30,pad=2,min=Math.min(...closes),max=Math.max(...closes),range=max-min||1;
  const points=closes.map((c,i)=>{
    const x=pad+(i/(closes.length-1))*(w-2*pad);
    const y=h-pad-((c-min)/range)*(h-2*pad);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  const up=closes[closes.length-1]>=closes[0];
  return '<svg class="stock-spark" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg"><polyline fill="none" stroke="'+(up?"#22c55e":"#ef4444")+'" stroke-width="1.5" points="'+points+'"/></svg>';
}
function fmtMoney(n,currency) {
  if (n===null||n===undefined||!isFinite(n)) return "—";
  return (currency==="USD"?"$":"")+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtChange(abs,pct) {
  if (abs===null||abs===undefined||!isFinite(abs)) return "—";
  const sign=abs>=0?"+":"";
  return sign+abs.toFixed(2)+" ("+sign+pct.toFixed(2)+"%)";
}

// ========== AI BRIEF ==========
const BRIEF_ENDPOINT     = CF_WORKER.replace(/\/$/, "") + "/brief";
const BRIEF_CACHE_TTL_MS = 7 * 24 * 3600000; // 7 days

function briefHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return Math.abs(h).toString(36);
}
function getBriefCache(url) {
  try {
    const raw = localStorage.getItem("news.brief." + briefHash(url));
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.ts > BRIEF_CACHE_TTL_MS) return null;
    return obj.data;
  } catch { return null; }
}
function setBriefCache(url, data) {
  try {
    localStorage.setItem("news.brief." + briefHash(url), JSON.stringify({ ts: Date.now(), data }));
  } catch {}
}

async function handleBriefClick(item, btn, panel) {
  // Toggle close if already open and not loading
  if (panel.classList.contains("open") && !btn.classList.contains("is-loading")) {
    panel.classList.remove("open");
    btn.classList.remove("is-open");
    return;
  }
  const cached = getBriefCache(item.link);
  if (cached && cached.brief) {
    renderBriefPanel(panel, { ...cached, cached: true }, item, btn);
    panel.classList.add("open");
    btn.classList.add("is-open");
    return;
  }
  await fetchAndShowBrief(item, btn, panel);
}

async function fetchAndShowBrief(item, btn, panel) {
  btn.classList.add("is-loading");
  btn.classList.add("is-open");
  panel.innerHTML =
    '<div class="brief-header"><span>✦</span> AI Brief</div>' +
    '<div class="brief-loading"><span class="spinner"></span><span>Researching the story…</span></div>';
  panel.classList.add("open");

  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(BRIEF_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        url: item.link,
        title: item.title,
        description: item.description || "",
        source: item.source || ""
      })
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { throw new Error("Bad JSON: " + text.slice(0, 200)); }
    if (!res.ok || !data.brief) {
      throw new Error(data.error || ("HTTP " + res.status));
    }
    setBriefCache(item.link, data);
    renderBriefPanel(panel, data, item, btn);
  } catch (err) {
    const msg = err.name === "AbortError" ? "Research timed out — try again" : (err.message || String(err));
    panel.innerHTML =
      '<div class="brief-header"><span>✦</span> AI Brief</div>' +
      '<div class="brief-error">Couldn\'t generate a brief: ' + escapeHtml(msg) + '</div>';
  } finally {
    clearTimeout(timer);
    btn.classList.remove("is-loading");
  }
}

function renderBriefPanel(panel, data, item, btn) {
  const paras = String(data.brief)
    .split(/\n\n+/)
    .filter(p => p.trim())
    .map(p => "<p>" + escapeHtml(p.trim()) + "</p>")
    .join("");
  const ts = data.generated_at ? new Date(data.generated_at) : null;
  const tsStr = ts && isFinite(ts) ? ts.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";
  panel.innerHTML =
    '<div class="brief-header"><span>✦</span> AI Brief</div>' +
    '<div class="brief-text">' + paras + '</div>' +
    '<div class="brief-meta">' +
      '<span>' + (data.cached ? "Researched earlier" : "Researched just now") + (tsStr ? " · " + tsStr : "") + '</span>' +
      '<button class="brief-refresh" type="button">Refresh</button>' +
    '</div>';
  panel.querySelector(".brief-refresh").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    try { localStorage.removeItem("news.brief." + briefHash(item.link)); } catch {}
    fetchAndShowBrief(item, btn, panel);
  });
}

// ========== ARTICLE BUILDER ==========
function buildArticle(item, isHero) {
  const wrap = document.createElement("div");
  wrap.className = "item-wrap";

  const a = document.createElement("a");
  a.className = "item" + (isHero?" hero":"") + (isRead(item.link)?" read":"") + (isSaved(item.link)?" bookmarked":"");
  a.href = item.link;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("role","article");
  a.dataset.link = item.link;

  const hasImg = item.thumbnail && /^https?:\/\//.test(item.thumbnail);
  const breaking = isBreaking(item.title);
  const badgeHtml =
    (breaking || item.trending || item.isNew)
    ? '<div class="badge-row">' +
        (breaking ? '<span class="badge badge-breaking">Breaking</span>' : '') +
        (item.trending ? '<span class="badge badge-trending">Trending</span>' : '') +
        (item.isNew ? '<span class="badge badge-new">New</span>' : '') +
      '</div>'
    : '';

  a.innerHTML =
    '<div class="item-text">' +
      '<div class="meta">' +
        '<span class="source-chip">'+escapeHtml(item.source)+'</span>' +
        '<span class="meta-dot">·</span>' +
        '<span class="meta-age">'+relativeTime(item.pubDate)+'</span>' +
        '<button class="brief-btn" type="button" title="Research this story with AI"><span class="spark">✦</span> AI Brief</button>' +
      '</div>' +
      badgeHtml +
      '<div class="title">'+escapeHtml(item.title)+'</div>' +
      (item.description?'<div class="desc">'+escapeHtml(item.description)+'</div>':'') +
    '</div>' +
    (hasImg?'<img class="thumb" src="'+escapeHtml(item.thumbnail)+'" alt="" loading="lazy" onerror="this.remove()">':'') +
    '<button class="bkmk-btn" title="'+(isSaved(item.link)?"Remove bookmark":"Bookmark")+'">'+(isSaved(item.link)?"🔖":"🏷️")+'</button>';

  // Brief panel is a sibling of the article inside the wrapper
  const panel = document.createElement("div");
  panel.className = "brief-panel";

  wrap.appendChild(a);
  wrap.appendChild(panel);

  // Mark read on click — but ignore clicks on action buttons
  a.addEventListener("click", e => {
    if (e.target.closest(".bkmk-btn") || e.target.closest(".brief-btn")) {
      e.preventDefault();
      return;
    }
    markRead(item.link);
    a.classList.add("read");
  });

  // Bookmark button
  const bkmkBtn = a.querySelector(".bkmk-btn");
  bkmkBtn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const nowSaved = toggleSave(item);
    a.classList.toggle("bookmarked", nowSaved);
    bkmkBtn.textContent = nowSaved ? "🔖" : "🏷️";
    bkmkBtn.title = nowSaved ? "Remove bookmark" : "Bookmark";
  });

  // AI Brief button
  const briefBtn = a.querySelector(".brief-btn");
  briefBtn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    handleBriefClick(item, briefBtn, panel);
  });

  return wrap;
}

// ========== RENDER NEWS ==========
function renderNews(items) {
  kbIndex = -1;
  const frag = document.createDocumentFragment();
  items.forEach((item, i) => {
    frag.appendChild(buildArticle(item, i === 0));
  });
  listEl.innerHTML = "";
  listEl.appendChild(frag);
}

// ========== SKELETON ==========
function showSkeleton(n) {
  listEl.innerHTML = Array.from({length:n}, () =>
    '<div class="skel">' +
      '<div class="skel-body">' +
        '<div class="skel-line s1"></div>' +
        '<div class="skel-line s2"></div>' +
        '<div class="skel-line s3"></div>' +
        '<div class="skel-line s4"></div>' +
        '<div class="skel-line s5"></div>' +
      '</div>' +
      '<div class="skel-img"></div>' +
    '</div>'
  ).join("");
}

// ========== LOAD CATEGORY ==========
async function loadCategory(force) {
  const cat = CATEGORIES.find(c => c.id === activeCat);

  if (cat.isStocks)  return loadStocks(force);
  if (cat.isOutdoor) return loadOutdoor(force);

  if (cat.isSaved) {
    statusEl.style.display = "none";
    const saved = getSaved();
    if (!saved.length) {
      listEl.innerHTML = '<div class="status">No saved stories yet. Hover any article and tap 🏷️ to save it.</div>';
    } else {
      currentItems = saved;
      renderNews(saved);
    }
    return;
  }

  showSkeleton(7);
  statusEl.style.display = "none";
  newPillEl.style.display = "none";

  if (force) cat.feeds.forEach(f => localStorage.removeItem("news.cache." + f.url));

  const lastVisit = parseInt(localStorage.getItem("news.lastVisit."+cat.id) || "0");
  localStorage.setItem("news.lastVisit."+cat.id, String(Date.now()));
  const cutoffMs = cat.maxAgeHours ? Date.now() - cat.maxAgeHours * 3600000 : 0;

  // Fetch all feeds in parallel, catch individual failures so one bad feed doesn't break everything
  const results = await Promise.all(cat.feeds.map(f => fetchFeed(f).catch(() => [])));
  const all = results.flat();

  // Deduplicate, apply recency window, sort by heat score
  const seen = new Set();
  const deduped = all.filter(item => {
    if (cutoffMs && item.pubDate < cutoffMs) return false;
    const key = item.title.toLowerCase().slice(0, 60);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).sort((a, b) => heatScore(b) - heatScore(a));

  if (deduped.length === 0) {
    listEl.innerHTML = "";
    statusEl.style.display = "block";
    statusEl.innerHTML = "Couldn't load any stories. The RSS proxies may be slow or down.<br>" +
      '<span style="opacity:.6">Tried: '+cat.feeds.map(f=>f.source).join(", ")+'</span><br>' +
      '<button class="retry-btn" onclick="loadCategory(true)">Try again</button>';
    return;
  }

  markTrending(deduped);
  deduped.forEach(i => { i.isNew = lastVisit > 0 && i.pubDate > lastVisit; });
  currentItems = deduped;
  renderNews(deduped);

  const newCount = deduped.filter(i => i.isNew).length;
  if (newCount > 0 && lastVisit > 0) {
    newPillEl.textContent = newCount + " new";
    newPillEl.style.display = "";
  }
}

window.loadCategory = loadCategory;

// ========== KEYBOARD NAVIGATION ==========
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { closeDrawer(); if(searchOpen){searchBtn.click();} return; }
  const articles = [...listEl.querySelectorAll("article.item")];
  if (!articles.length) return;
  if (e.key === "j" || e.key === "ArrowDown") {
    e.preventDefault();
    articles[kbIndex]?.classList.remove("kb-focus");
    kbIndex = Math.min(kbIndex + 1, articles.length - 1);
    articles[kbIndex].classList.add("kb-focus");
    articles[kbIndex].scrollIntoView({ block:"nearest", behavior:"smooth" });
  } else if (e.key === "k" || e.key === "ArrowUp") {
    e.preventDefault();
    articles[kbIndex]?.classList.remove("kb-focus");
    kbIndex = Math.max(kbIndex - 1, 0);
    articles[kbIndex].classList.add("kb-focus");
    articles[kbIndex].scrollIntoView({ block:"nearest", behavior:"smooth" });
  } else if (e.key === "Enter" && kbIndex >= 0) {
    const link = articles[kbIndex]?.href;
    if (link) window.open(link, "_blank", "noopener");
  } else if (e.key === "b" && kbIndex >= 0) {
    const bkmkBtn = articles[kbIndex]?.querySelector(".bkmk-btn");
    if (bkmkBtn) bkmkBtn.click();
  }
});

// ========== INIT ==========
document.getElementById("refreshBtn").addEventListener("click", () => {
  localStorage.removeItem("news.nws.alerts");
  fetchNWSAlerts(); loadWeather(true); loadCategory(true);
});

// Pull-to-refresh
let startY=0, pulling=false;
document.addEventListener("touchstart", e=>{ if(window.scrollY===0){startY=e.touches[0].clientY;pulling=true;} },{passive:true});
document.addEventListener("touchend", e=>{
  if (!pulling) return;
  if (e.changedTouches[0].clientY - startY > 80) { fetchNWSAlerts(); loadWeather(true); loadCategory(true); }
  pulling=false;
});

renderQuoteOfDay();
renderDrawer();
renderQuickTabs();
updateSectionLabel();
fetchNWSAlerts();
loadWeather();
loadCategory();

setInterval(()=>{ localStorage.removeItem("news.nws.alerts"); fetchNWSAlerts(); }, ALERTS_CACHE_TTL_MS);
</script>
