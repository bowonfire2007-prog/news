name = "rss-proxy"
main = "worker.js"
compatibility_date = "2026-05-01"
account_id = "3826a504e1b9ef4b240565bea6621cb9"

# ── KV namespace for Missouri Weekly Market Summary data ──────────────────────
# One-time setup:
#   1. Run:  wrangler kv namespace create WEEKLY_KV
#   2. Copy the printed `id = "..."` value and paste it below (replace the placeholder)
#   3. Deploy:  wrangler deploy
# The WEEKLY_KV data persists forever and is shared across ALL users on every device.
[[kv_namespaces]]
binding = "WEEKLY_KV"
id = "0f86e3f7503f41279b0af5e8f132cacd"

# ── Cron Triggers (auto-fetch market reports) ─────────────────────────────────
# Times are UTC. Missouri is CST (UTC-6) / CDT (UTC-5) depending on DST.
#
#   "0 21 * * 5"  →  every Friday   at 21:00 UTC  =  3 pm CST / 4 pm CDT
#                    Wheeler Livestock sells on Tuesdays; report is usually up by Friday.
#
#   "0 15 * * 1"  →  every Monday   at 15:00 UTC  =  9 am CST / 10 am CDT
#                    Missouri Dept of Agriculture posts the new weekly summary PDF Monday morning.
#
#   "0 18 * * 2"  →  every Tuesday  at 18:00 UTC  =  noon CST / 1 pm CDT
#                    Backup pull — catches reports that drop late on holiday weeks
#                    (Memorial Day, Labor Day, etc. when MDA is closed Monday).
#                    Safe to run weekly: it's a no-op if Monday already grabbed it.
#
[[kv_namespaces]]
binding = "BILLS_KV"
id = "77445f232f1e4bc6a3dd1cf86c888979"

[triggers]
crons = ["0 21 * * 5", "0 15 * * 1", "0 18 * * 2", "0 13 * * *", "0 1 * * *"]

# ── Secrets (set in Cloudflare dashboard or via wrangler secret put) ──────────
# ANTHROPIC_API_KEY  — Claude API key for PDF parsing and cattle price OCR
# UPLOAD_PIN         — PIN to protect the weekly PDF upload endpoint (set any value you like)
#
# Notes:
# - Worker name matches the existing one (rss-proxy.bowonfire2007.workers.dev)
# - Secrets like ANTHROPIC_API_KEY are managed in the Cloudflare dashboard
#   and are NOT redeployed by wrangler — they persist across deploys.
# - If you ever need to add a new secret:  wrangler secret put SECRET_NAME
